/* ========================= PRACTICE ENGINE ========================= */
function startPracticeSession(def, playerId){
  const ps = {
    def, playerId,
    sequence: def.targets.slice(),
    order: def.order,
    randomMode: def.randomMode || null,
    idx: 0,
    dartsOnCurrentTurn: 0,
    requiredHits: def.requiredHits,
    totalDarts: 0,
    successfulHits: 0,
    misses: 0,
    perTarget: {},
    dartsSpentPerTarget: {},
    dartsPerTarget: {},
    hitPoints: [],
    startTime: Date.now(),
    complete:false,
  };
  if(ps.randomMode) ps.currentTarget = practicePickRandomTarget(ps);
  return ps;
}
function practicePickRandomTarget(ps){
  const remaining = ps.def.targets.filter(t => (ps.perTarget[t]||0) < ps.requiredHits);
  if(!remaining.length) return null;
  return remaining[Math.floor(Math.random()*remaining.length)];
}
function practiceCurrentTarget(ps){ return ps.randomMode ? ps.currentTarget : ps.sequence[ps.idx]; }
function practiceApplyDart(ps, hitTarget, multiplier){
  ps.totalDarts++;
  const target = practiceCurrentTarget(ps);
  ps.dartsSpentPerTarget[target] = (ps.dartsSpentPerTarget[target]||0)+1;
  const reqMult = ps.def.requiredMultiplier || 'any';
  const multOk = reqMult==='any' ? true : (reqMult==='double' ? (multiplier==='double'||multiplier==='bull') : reqMult===multiplier);
  const isHit = (hitTarget === target) && multOk;
  if(isHit){
    const hitValue = ps.def.multiplierRule==='simple' ? 1 : (ps.def.multiplierRule==='exact' ? 1 : (multiplier==='triple'?3:multiplier==='double'?2:1));
    ps.perTarget[target] = (ps.perTarget[target]||0)+hitValue;
    ps.successfulHits++;
  } else {
    ps.misses++;
  }
  const wasAlreadyDone = ps.dartsPerTarget[target] !== undefined;
  const nowComplete = (ps.perTarget[target]||0) >= ps.requiredHits;
  if(nowComplete && !wasAlreadyDone) ps.dartsPerTarget[target] = ps.dartsSpentPerTarget[target];
  if(ps.randomMode){
    ps.dartsOnCurrentTurn++;
    const turnUp = ps.randomMode==='perTurn' && ps.dartsOnCurrentTurn>=3;
    if(nowComplete || ps.randomMode==='perDart' || turnUp){
      const next = practicePickRandomTarget(ps);
      if(next===null){
        ps.complete = true;
        ps.completionTime = Math.round((Date.now()-ps.startTime)/1000);
      } else {
        ps.currentTarget = next;
        ps.dartsOnCurrentTurn = 0;
      }
    }
  } else if(nowComplete){
    ps.idx++;
    if(ps.idx >= ps.sequence.length){
      ps.complete = true;
      ps.completionTime = Math.round((Date.now()-ps.startTime)/1000);
    }
  }
  return isHit;
}

/* ========================= CHECKOUT PRACTICE ENGINE ========================= */
const CHECKOUT_PRACTICE_POOL = [16,20,24,32,36,40,50,60,70,80,90,100,110,121,141,161,170];
function pickCheckoutPracticeScore(){
  return CHECKOUT_PRACTICE_POOL[Math.floor(Math.random()*CHECKOUT_PRACTICE_POOL.length)];
}
function checkoutPracticeThrowValue(num, mult){
  if(num==='B') return mult==='bull' ? 50 : 25;
  if(mult==='triple') return num*3;
  if(mult==='double') return num*2;
  return num;
}
function startCheckoutPractice(){
  return {
    attemptsTotal:10, attemptsCompleted:0, successes:0, totalDarts:0,
    currentScore: pickCheckoutPracticeScore(), dartsThisAttempt:[], startTime:Date.now(), complete:false,
  };
}
function checkoutPracticeApplyDart(cp, num, mult){
  cp.totalDarts++;
  const val = checkoutPracticeThrowValue(num, mult);
  const remaining = cp.currentScore - val;
  let bust=false, finished=false;
  const isFinishThrow = num==='B' ? mult==='bull' : mult==='double';
  if(remaining<0) bust=true;
  else if(remaining===0){ if(isFinishThrow) finished=true; else bust=true; }
  const label = fullDartLabel(num, mult);
  cp.dartsThisAttempt.push({label, bust, finished});
  if(!bust) cp.currentScore = remaining;
  if(finished) cp.successes++;
  const attemptOver = bust || finished || cp.dartsThisAttempt.length>=3;
  if(attemptOver){
    cp.attemptsCompleted++;
    if(cp.attemptsCompleted>=cp.attemptsTotal){
      cp.complete=true;
      cp.completionTime = Math.round((Date.now()-cp.startTime)/1000);
    } else {
      cp.currentScore = pickCheckoutPracticeScore();
      cp.dartsThisAttempt=[];
    }
  }
  return {attemptOver, bust, finished};
}

/* ========================= DARTBOARD SVG ========================= */
const BOARD_ORDER = [1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5,20];
// BOARD_ORDER[0] (currently "1") is drawn one wedge past the top by default. This adds 18° (one
// wedge width) to every drawing/detection calculation so the sequence keeps its correct pairing
// with the alternating colors but visually starts with 20 at 12 o'clock, matching a real board.
const WEDGE_ROTATION = 18;
// Splits rendered screen HTML into a scrollable part (before) and a persistent, always-visible
// footer part (after) — used so score rows and Undo/Menu controls never get scrolled out of view
// behind a large dartboard, regardless of window size or fullscreen mode.
const FOOTER_MARKER = '<!--__FOOTER__-->';
const BOARD_CX=310, BOARD_CY=310, BOARD_CANVAS=620;
const KILLER_COLORS = ['#5B9BF5','#C9584A','#4A8A66','#9B6BC9','#D48A3D','#3DBFCC'];
const R_BULL_INNER=11, R_BULL_OUTER=24, R_TRIPLE_IN=106, R_TRIPLE_OUT=122, R_DOUBLE_IN=178;
const R_DOUBLE_OUT = R_DOUBLE_IN + (R_TRIPLE_OUT-R_TRIPLE_IN); // double ring width == triple ring width
const R_BEZEL = R_DOUBLE_OUT+32, R_OVER_OUT = R_DOUBLE_OUT+22;
const R_NUMBER_LABEL = R_DOUBLE_OUT+16;
function polar(cx,cy,r,angleDeg){
  const rad = angleDeg*Math.PI/180;
  return [ (cx + r*Math.sin(rad)).toFixed(2), (cy - r*Math.cos(rad)).toFixed(2) ];
}
function wedgePath(cx,cy,rIn,rOut,aStart,aEnd){
  const p1 = polar(cx,cy,rOut,aStart);
  const p2 = polar(cx,cy,rOut,aEnd);
  const p3 = polar(cx,cy,rIn,aEnd);
  const p4 = polar(cx,cy,rIn,aStart);
  return `M ${p1} A ${rOut} ${rOut} 0 0 1 ${p2} L ${p3} A ${rIn} ${rIn} 0 0 0 ${p4} Z`;
}

/* ========================= PRECISION TRAINER (coordinate-based): geometry & scoring ========================= */
// Board-space (px,py) <-> normalized real-board coordinates. Center = (0,0). +X = right, +Y = up.
// Distance 1.0 = exactly on the doubles wire (a real dartboard's outer scoring radius).
function boardToNormalized(px, py){
  return { x: (px - BOARD_CX) / R_DOUBLE_OUT, y: -(py - BOARD_CY) / R_DOUBLE_OUT };
}
function normalizedToBoard(nx, ny){
  return { x: BOARD_CX + nx*R_DOUBLE_OUT, y: BOARD_CY - ny*R_DOUBLE_OUT };
}
// Inverse of polar(): given a board-space point, return {radius, angleDeg} in the same 0=top/clockwise convention used to draw wedges.
function boardPointToPolar(px, py){
  const dx = px - BOARD_CX, dy = py - BOARD_CY;
  const radius = Math.sqrt(dx*dx + dy*dy);
  let angleDeg = Math.atan2(dx, -dy) * 180/Math.PI;
  if(angleDeg < -9) angleDeg += 360;
  return { radius, angleDeg };
}
function numberForAngle(angleDeg){
  let a = angleDeg + 9 - WEDGE_ROTATION; // shift so wedge 0 spans 0-18, then undo the visual rotation
  a = ((a % 360) + 360) % 360;
  const idx = Math.floor(a/18) % 20;
  return BOARD_ORDER[idx];
}
function ringForRadius(radius){
  if(radius <= R_BULL_INNER) return 'bullInner';
  if(radius <= R_BULL_OUTER) return 'bullOuter';
  if(radius <= R_TRIPLE_IN) return 'inner';
  if(radius <= R_TRIPLE_OUT) return 'triple';
  if(radius <= R_DOUBLE_IN) return 'outer';
  if(radius <= R_DOUBLE_OUT) return 'double';
  if(radius <= R_OVER_OUT) return 'over';
  return 'totalMiss';
}
const RING_LABELS = {bullInner:'Bull', bullOuter:'Outer Bull', inner:'Inner Single', triple:'Triple', outer:'Outer Single', double:'Double', over:'Just Outside', totalMiss:'Total Miss'};
function scoreForPoint(px, py){
  const {radius, angleDeg} = boardPointToPolar(px, py);
  const ring = ringForRadius(radius);
  const number = (ring==='bullInner'||ring==='bullOuter') ? 'B' : numberForAngle(angleDeg);
  let score = 0;
  if(ring==='bullInner') score = 50;
  else if(ring==='bullOuter') score = 25;
  else if(ring==='inner'||ring==='outer') score = number;
  else if(ring==='triple') score = number*3;
  else if(ring==='double') score = number*2;
  return { number, ring, score, radius, angleDeg };
}
function pointLabel(number, ring){
  if(ring==='bullInner') return 'Bull';
  if(ring==='bullOuter') return 'Outer Bull';
  if(ring==='over') return 'Just Outside '+number;
  if(ring==='totalMiss') return 'Total Miss';
  const prefix = ring==='double'?'D':ring==='triple'?'T':'S';
  return prefix+number;
}
function boardDistanceToMm(normDist){
  // A regulation doubles-wire radius is 170mm from the bullseye center; normDist=1.0 == 170mm.
  return Math.round(normDist * 170);
}

/* ========================= THROW ANALYZER: CORE MATH ========================= */
// Converts a raw pixel distance (in the same SVG coordinate space every dart
// hit already arrives in, whether tapped or camera-detected) into real-world
// millimeters, using the same 170mm double-ring reference boardDistanceToMm
// already relies on — so this is exact, not a separate approximation.
function pxToMm(px){ return (px / R_DOUBLE_OUT) * 170; }
// dyMm follows the SVG convention (down is positive) — meaning a positive
// dyMm genuinely means "landed below the target," matching how a person
// would naturally describe their own miss.
function throwErrorVector(target, hit){
  return { dxMm: pxToMm(hit.x-target.x), dyMm: pxToMm(hit.y-target.y) };
}
// The actual statistics behind the diagnosis — bias (centroid, i.e. where
// your average dart lands relative to the target) is a completely separate
// question from dispersion (how tightly you group), and conflating them is
// exactly the mistake worth avoiding here.
function computeThrowStats(errors){
  const n = errors.length;
  const centroidDx = errors.reduce((s,e)=>s+e.dxMm,0)/n;
  const centroidDy = errors.reduce((s,e)=>s+e.dyMm,0)/n;
  const centroidDist = Math.sqrt(centroidDx*centroidDx + centroidDy*centroidDy);
  const dispersion = Math.sqrt(errors.reduce((s,e)=>s+Math.pow(e.dxMm-centroidDx,2)+Math.pow(e.dyMm-centroidDy,2),0)/n);
  const varX = errors.reduce((s,e)=>s+Math.pow(e.dxMm-centroidDx,2),0)/n;
  const varY = errors.reduce((s,e)=>s+Math.pow(e.dyMm-centroidDy,2),0)/n;
  const dominantAxis = varY > varX*1.4 ? 'vertical' : varX > varY*1.4 ? 'horizontal' : 'mixed';
  return { n, centroidDx, centroidDy, centroidDist, dispersion, varX, varY, dominantAxis };
}
// The diagnostic matrix itself — grounded specifically in what search
// actually turned up (not invented), and deliberately hedged: every
// suggestion is framed as "worth testing," never a diagnosis. Horizontal
// bias points at stance/alignment first because that's what the darts
// coaching sources converge on; vertical bias points at release
// timing/follow-through first, since multiple independent sources draw
// that same distinction. A confirmed-tight group that's simply off-target
// gets a different, much simpler answer: aim calibration, not mechanics.
const THROW_DIAGNOSTIC_MATRIX = {
  vertical_low: { title:'Your throw tends low', suggestion:'Check your follow-through',
    body:"A consistent low miss with a tight group is often linked to release timing or a shortened follow-through — releasing a touch late tends to send darts low. This isn't necessarily your cause, but it's the most common one for this exact pattern, and it's easy to test." },
  vertical_high: { title:'Your throw tends high', suggestion:'Check your release timing',
    body:"Consistently landing high, with your left-right aim staying tight, is usually linked to releasing a touch early or with extra lift. Worth testing whether releasing a fraction later brings it back down." },
  horizontal_left: { title:'Your throw drifts left', suggestion:'Check your stance angle',
    body:"For a right-handed thrower, consistently drifting left is commonly tied to stance alignment — the body angled slightly across the throw, or the elbow drifting out during release. A small adjustment to your back foot, angling your stance a bit more toward the board, is the most commonly cited fix for exactly this pattern." },
  horizontal_right: { title:'Your throw drifts right', suggestion:'Check your stance angle',
    body:"Consistently drifting right is the mirror of the left-drift pattern — commonly tied to stance alignment or the arm moving outward through release. Moving your back foot the other way to adjust your facing angle is the most commonly suggested fix." },
  tight_off_target: { title:"You're tight, just not on target", suggestion:'This looks like aim, not mechanics',
    body:"Your grouping is genuinely tight — that's a sign your mechanics are already repeatable. This isn't a mechanical issue at all; it's simply aim calibration. Try consciously aiming a little in the opposite direction of your average miss." },
  wide_dispersion: { title:"Your grouping is spread out", suggestion:'Focus on rhythm and grip pressure',
    body:"Without a strong directional bias, a wide spread usually points to general consistency — grip tension, rushing the throw, or body movement during release, rather than any single specific fix. Slowing down and keeping a consistent pre-throw routine is the most broadly supported starting point." },
};
function diagnoseThrowStats(stats){
  if(stats.dispersion < 12 && stats.centroidDist < 8) return null; // genuinely on target, nothing to suggest
  if(stats.dispersion < 15 && stats.centroidDist >= 8) return {...THROW_DIAGNOSTIC_MATRIX.tight_off_target, axis:'bias'};
  if(stats.dominantAxis==='vertical') return {...THROW_DIAGNOSTIC_MATRIX[stats.centroidDy>0?'vertical_low':'vertical_high'], axis:'vertical'};
  if(stats.dominantAxis==='horizontal') return {...THROW_DIAGNOSTIC_MATRIX[stats.centroidDx>0?'horizontal_right':'horizontal_left'], axis:'horizontal'};
  return {...THROW_DIAGNOSTIC_MATRIX.wide_dispersion, axis:'dispersion'};
}
function angleForBoardNumber(num){ return BOARD_ORDER.indexOf(num)*18 + WEDGE_ROTATION; }
const THROW_ANALYZER_PRESETS = (()=>{
  const tripleR = (R_TRIPLE_IN+R_TRIPLE_OUT)/2;
  const mk = (id,label,num)=>{ const [x,y]=polar(BOARD_CX,BOARD_CY,tripleR,angleForBoardNumber(num)); return {id,label,x:parseFloat(x),y:parseFloat(y)}; };
  return [
    mk('upper','Upper board (near 20)',20),
    mk('lower','Lower board (near 3)',3),
    mk('left','Left side (near 11)',11),
    mk('right','Right side (near 6)',6),
    {id:'center', label:'Center (bullseye)', x:BOARD_CX, y:BOARD_CY},
  ];
})();
const THROW_ANALYZER_WARMUP_DARTS = 12;
const THROW_ANALYZER_MIN_DARTS = 9;
const THROW_ANALYZER_MAX_DARTS = 18;
function startThrowAnalyzer(presetId){
  const preset = THROW_ANALYZER_PRESETS.find(p=>p.id===presetId) || THROW_ANALYZER_PRESETS[0];
  state.throwAnalyzer = {
    phase:'warmup', preset, target:preset,
    warmupThrown:0, warmupTarget: randomBoardPoint(),
    diagnosticErrors: [], testErrors: [], suggestion:null, priorSuggestion:null,
  };
  state.screen = 'throwAnalyzer';
  render();
}
function randomBoardPoint(){
  const r = Math.random()*R_DOUBLE_OUT*0.85;
  const a = Math.random()*360;
  const [x,y] = polar(BOARD_CX,BOARD_CY,r,a);
  return {x:parseFloat(x), y:parseFloat(y)};
}
// No feedback shown while actually throwing, by explicit request — darts
// just land, and every stat/diagnosis appears only once a whole block
// (warmup, diagnostic, or test) genuinely completes.
function throwAnalyzerRecordDart(point){
  const t = state.throwAnalyzer;
  if(!t) return;
  if(t.phase==='warmup'){
    t.warmupThrown++;
    if(t.warmupThrown>=THROW_ANALYZER_WARMUP_DARTS){
      t.phase='diagnostic';
    } else {
      t.warmupTarget = randomBoardPoint();
    }
  } else if(t.phase==='diagnostic'){
    t.diagnosticErrors.push(throwErrorVector(t.target, point));
    if(throwAnalyzerBlockDone(t.diagnosticErrors)){
      t.stats = computeThrowStats(t.diagnosticErrors);
      t.suggestion = diagnoseThrowStats(t.stats);
      t.phase = 'results';
    }
  } else if(t.phase==='testing'){
    t.testErrors.push(throwErrorVector(t.target, point));
    if(throwAnalyzerBlockDone(t.testErrors)){
      t.testStats = computeThrowStats(t.testErrors);
      t.phase = 'testResult';
      const before = t.stats[t.suggestion.axis==='vertical' ? 'centroidDy' : t.suggestion.axis==='horizontal' ? 'centroidDx' : 'centroidDist'];
      const after = t.testStats[t.suggestion.axis==='vertical' ? 'centroidDy' : t.suggestion.axis==='horizontal' ? 'centroidDx' : 'centroidDist'];
      const improvementPct = before!==0 ? Math.round((1 - Math.abs(after)/Math.abs(before))*100) : 0;
      const groupingHeld = t.testStats.dispersion <= t.stats.dispersion*1.25;
      t.testHelped = improvementPct >= 25 && groupingHeld;
      t.testImprovementPct = improvementPct;
    }
  }
  render();
}
// Adaptive count — stop at the minimum once the signal is already clear,
// extend up to the max only when it genuinely isn't (bias too small to
// tell apart from ordinary dispersion yet).
function throwAnalyzerBlockDone(errors){
  if(errors.length < THROW_ANALYZER_MIN_DARTS) return false;
  if(errors.length >= THROW_ANALYZER_MAX_DARTS) return true;
  const s = computeThrowStats(errors);
  const ambiguous = s.centroidDist < s.dispersion*0.5;
  return !ambiguous;
}
function throwAnalyzerStartTest(){
  const t = state.throwAnalyzer;
  if(!t) return;
  t.testErrors = [];
  t.phase = 'testing';
  render();
}
function throwAnalyzerTryDifferentCause(){
  const t = state.throwAnalyzer;
  if(!t) return;
  // Deliberately deprioritizes rather than deletes — throw issues can be a
  // culmination of more than one factor, so a cause that didn't help this
  // time may still be worth revisiting later once something else is fixed.
  t.priorSuggestion = t.suggestion;
  t.diagnosticErrors = [];
  t.phase = 'diagnostic';
  render();
}
function exitThrowAnalyzer(){
  state.throwAnalyzer = null;
  state.screen = 'practice';
  render();
}

/* ========================= SECTION TRAINER: ZONE MODEL ========================= */
const SECTION_BAND_LABELS = {inner:'Inner Single', triple:'Triple', outer:'Outer Single', double:'Double', over:'Just Outside the Board', 'bull-outer':'Outer Bull', 'bull-inner':'Bull'};
function buildSectionZones(){
  const zones = [];
  for(let i=0;i<20;i++){
    const num = BOARD_ORDER[i];
    const aMid = (-9 + i*18) + 9 + WEDGE_ROTATION;
    const bands = [
      {band:'inner', rIn:R_BULL_OUTER, rOut:R_TRIPLE_IN, isTarget:true},
      {band:'triple', rIn:R_TRIPLE_IN, rOut:R_TRIPLE_OUT, isTarget:true},
      {band:'outer', rIn:R_TRIPLE_OUT, rOut:R_DOUBLE_IN, isTarget:true},
      {band:'double', rIn:R_DOUBLE_IN, rOut:R_DOUBLE_OUT, isTarget:true},
      {band:'over', rIn:R_DOUBLE_OUT, rOut:R_OVER_OUT, isTarget:false},
    ];
    bands.forEach(b=>{
      const rMid = (b.rIn+b.rOut)/2;
      const [x,y] = polar(BOARD_CX,BOARD_CY,rMid,aMid);
      zones.push({id:num+'-'+b.band, type:'wedge', number:num, band:b.band, isTarget:b.isTarget, rIn:b.rIn, rOut:b.rOut, aMid, x:parseFloat(x), y:parseFloat(y)});
    });
  }
  zones.push({id:'bull-outer', type:'bull', band:'bull-outer', number:null, isTarget:true, rIn:R_BULL_INNER, rOut:R_BULL_OUTER, x:BOARD_CX, y:BOARD_CY});
  zones.push({id:'bull-inner', type:'bull', band:'bull-inner', number:null, isTarget:true, rIn:0, rOut:R_BULL_INNER, x:BOARD_CX, y:BOARD_CY});
  return zones;
}
const SECTION_ZONES = buildSectionZones();
const SECTION_TARGET_ZONES = SECTION_ZONES.filter(z=>z.isTarget);
function sectionZoneById(id){ return SECTION_ZONES.find(z=>z.id===id); }
function sectionZoneDistance(idA, idB){
  const a=sectionZoneById(idA), b=sectionZoneById(idB);
  return Math.sqrt((a.x-b.x)*(a.x-b.x) + (a.y-b.y)*(a.y-b.y));
}
const SECTION_WORST_CASE = (()=>{
  let max=0;
  SECTION_TARGET_ZONES.forEach(t=>{
    SECTION_ZONES.forEach(l=>{
      const d = sectionZoneDistance(t.id, l.id);
      if(d>max) max=d;
    });
  });
  return max;
})();
function sectionScoreForThrow(targetId, landedId){
  if(landedId==='totalmiss') return 0;
  const d = sectionZoneDistance(targetId, landedId);
  const score = Math.round(100*(1 - d/SECTION_WORST_CASE));
  return Math.max(0, Math.min(100, score));
}
function sectionZoneLabel(id){
  if(id==='totalmiss') return 'Total Miss';
  if(id && id.endsWith('-single')) return 'Single '+id.slice(0, id.lastIndexOf('-'));
  const z = sectionZoneById(id);
  if(z.type==='bull') return SECTION_BAND_LABELS[z.band];
  return SECTION_BAND_LABELS[z.band]+' '+z.number;
}
function pickRandomSectionTarget(){
  return SECTION_TARGET_ZONES[Math.floor(Math.random()*SECTION_TARGET_ZONES.length)].id;
}

/* ========================= SECTION TRAINER: SESSION ENGINE ========================= */
function startSectionSession(turnsTotal, fixedTarget){
  return {
    turnsTotal, turnsCompleted:0,
    fixedTarget: fixedTarget || null,
    currentTarget: fixedTarget || pickRandomSectionTarget(),
    dartsThisTurn: [],
    turnScores: [],
    turnHistory: [],
    allThrows: [],
    byBand: {}, byNumber: {},
    startTime: Date.now(), complete:false,
  };
}
function sectionApplyThrow(ps, landedZoneId){
  const score = sectionScoreForThrow(ps.currentTarget, landedZoneId);
  const targetZone = sectionZoneById(ps.currentTarget);
  ps.dartsThisTurn.push({zoneId:landedZoneId, score, targetId:ps.currentTarget});
  ps.allThrows.push(score);
  const bandKey = targetZone.band;
  if(!ps.byBand[bandKey]) ps.byBand[bandKey] = {sum:0,count:0};
  ps.byBand[bandKey].sum += score; ps.byBand[bandKey].count++;
  if(targetZone.type==='wedge'){
    if(!ps.byNumber[targetZone.number]) ps.byNumber[targetZone.number] = {sum:0,count:0};
    ps.byNumber[targetZone.number].sum += score; ps.byNumber[targetZone.number].count++;
  }
  if(ps.dartsThisTurn.length>=3){
    const turnAvg = Math.round(ps.dartsThisTurn.reduce((a,d)=>a+d.score,0)/3);
    ps.turnScores.push(turnAvg);
    ps.turnHistory.push({target:ps.currentTarget, darts:ps.dartsThisTurn.slice()});
    ps.turnsCompleted++;
    ps.dartsThisTurn = [];
    if(ps.turnsCompleted>=ps.turnsTotal){
      ps.complete = true;
      ps.completionTime = Math.round((Date.now()-ps.startTime)/1000);
    } else {

function reverseSectionStats(ps, targetId, score){
  const zone = sectionZoneById(targetId);

  if(ps.byBand[band]){
    ps.byBand[band].sum -= score; ps.byBand[band].count--;
    if(ps.byBand[band].count<=0) delete ps.byBand[band];
  }
  if(zone.type==='wedge' && ps.byNumber[zone.number]){
    ps.byNumber[zone.number].sum -= score; ps.byNumber[zone.number].count--;
    if(ps.byNumber[zone.number].count<=0) delete ps.byNumber[zone.number];
  }
  ps.allThrows.pop();
}
function sectionUndoThrow(ps){
  if(ps.dartsThisTurn.length>0){
    const last = ps.dartsThisTurn.pop();
    reverseSectionStats(ps, last.targetId, last.score);
    return true;
  } else if(ps.turnHistory.length>0){
    const lastTurn = ps.turnHistory.pop();
    ps.turnScores.pop();
    ps.turnsCompleted--;
    ps.currentTarget = lastTurn.target;
    ps.dartsThisTurn = lastTurn.darts.slice(0,2);
    const removedDart = lastTurn.darts[2];
    reverseSectionStats(ps, removedDart.targetId, removedDart.score);
    ps.complete = false;
    return true;
  }

}

/* ========================= PRO ROUTINE: SIX-PHASE PRACTICE SESSION ========================= */
// Adapted from a real coaching-style routine, converted from time-boxed
// (5 min, 10 min, etc.) into dart-count-boxed phases, since Oche is
// inherently turn-based rather than clock-based — a more natural fit for
// the same structure, not a compromise of it.
const PRO_ROUTINE_WARMUP_TARGETS = [20,19,18,'B',20,19,18,'B']; // 2 cycles, 3 darts each = 24 darts
const PRO_ROUTINE_PRECISION_TARGETS = ['t20-center','t20-outer','t19-center']; // 10 rounds total, cycling through these 3
const PRO_ROUTINE_DOUBLES_ORDER = [20,10,16,8,4,12,18];
const PRO_ROUTINE_CHECKOUTS = [40,32,48,52,60,64,68,72,76,80,81];
function proRoutinePrecisionPoint(id){
  // "Center" = the middle of the triple ring at that number's angle.
  // "Outer" = the outer edge of the same triple ring — a distinct, testable
  // radial precision point rather than an ambiguous "upper" direction that
  // doesn't have one clear meaning on a wedge already at the board's top.
  const tripleMidR = (R_TRIPLE_IN+R_TRIPLE_OUT)/2;
  if(id==='t20-center'){ const [x,y]=polar(BOARD_CX,BOARD_CY,tripleMidR,angleForBoardNumber(20)); return {x:parseFloat(x),y:parseFloat(y),label:'Center of Triple 20'}; }
  if(id==='t20-outer'){ const [x,y]=polar(BOARD_CX,BOARD_CY,R_TRIPLE_OUT-4,angleForBoardNumber(20)); return {x:parseFloat(x),y:parseFloat(y),label:'Outer Edge of Triple 20'}; }
  if(id==='t19-center'){ const [x,y]=polar(BOARD_CX,BOARD_CY,tripleMidR,angleForBoardNumber(19)); return {x:parseFloat(x),y:parseFloat(y),label:'Center of Triple 19'}; }
}
function startProRoutine(){
  state.proRoutine = {
    phase:'warmup',
    warmup:{idx:0, thrownAtCurrent:0},
    precision:{round:0, thrownThisRound:0, errorsByTarget:{'t20-center':[],'t20-outer':[],'t19-center':[]}},
    scoring:{stage:'t20', visitsAtT20:0, visitsAtT19:0, currentVisit:[], t20:{darts:[], visits:[]}, t19:{darts:[], visits:[]}},
    doubles:{idx:0, dartsThisDouble:0, hitsThisDouble:0, results:{}, extra:false, extraQueue:[]},
    finishing:{idx:0, remaining:PRO_ROUTINE_CHECKOUTS[0], dartsThisCheckout:0, results:{}},
    pressure:{challenge:'checkout40x3', successes:0, attempts:0, needed:3},
  };
  state.screen = 'proRoutine';
  render();
}
function exitProRoutine(){ state.proRoutine=null; state.screen='practice'; render(); }
function proRoutineAdvancePhase(){
  const order = ['warmup','precision','scoring','doubles','finishing','pressure','summary'];
  const t = state.proRoutine;
  const i = order.indexOf(t.phase);
  t.phase = order[i+1];
}
function proRoutineDartValue(num, mult){
  if(mult==='miss') return 0;
  return personalBestDartValue(num, mult);
}
function proRoutineWarmupDart(){
  const w = state.proRoutine.warmup;
  w.thrownAtCurrent++;
  if(w.thrownAtCurrent>=3){
    w.idx++;
    w.thrownAtCurrent=0;
    if(w.idx>=PRO_ROUTINE_WARMUP_TARGETS.length) proRoutineAdvancePhase();
  }
}
function proRoutinePrecisionDart(point){
  if(!point) return; // a genuine off-board miss has no coordinate to measure — silently skipped, same convention Throw Analyzer uses
  const p = state.proRoutine.precision;
  const targetId = PRO_ROUTINE_PRECISION_TARGETS[p.round % 3];
  const target = proRoutinePrecisionPoint(targetId);
  p.errorsByTarget[targetId].push(throwErrorVector(target, point));
  p.thrownThisRound++;
  if(p.thrownThisRound>=3){
    p.thrownThisRound=0;
    p.round++;
    if(p.round>=10) proRoutineAdvancePhase();
  }
}
function proRoutineScoringDart(num, mult){
  const sc = state.proRoutine.scoring;
  const stageKey = sc.stage;
  const value = proRoutineDartValue(num, mult);
  const isTreble = mult==='triple';
  const adjacent = stageKey==='t20' ? [1,5] : [3,7];
  const isAdjacent = mult!=='miss' && num!=='B' && adjacent.includes(parseInt(num,10));
  const isTargetNumber = mult!=='miss' && num!=='B' && String(parseInt(num,10))===String(stageKey==='t20'?20:19);
  sc.currentVisit.push({num, mult, value, isTreble, isAdjacent, isTargetNumber});
  if(sc.currentVisit.length>=3){
    const visitTotal = sc.currentVisit.reduce((s,d)=>s+d.value,0);
    sc[stageKey].darts.push(...sc.currentVisit);
    sc[stageKey].visits.push(visitTotal);
    sc.currentVisit = [];
    if(stageKey==='t20'){
      sc.visitsAtT20++;
      if(sc.visitsAtT20>=10) sc.stage='t19';
    } else {
      sc.visitsAtT19++;
      if(sc.visitsAtT19>=5) proRoutineAdvancePhase();
    }
  }

function proRoutineDoublesDart(num, mult){
  const d = state.proRoutine.doubles;
  const currentTargets = d.extra ? d.extraQueue : PRO_ROUTINE_DOUBLES_ORDER;
  const targetNum = currentTargets[d.idx];
  const isHit = mult==='double' && num!=='B' && String(parseInt(num,10))===String(targetNum);
  if(isHit) d.hitsThisDouble++;
  d.dartsThisDouble++;
  const dartsNeeded = d.extra ? 3 : 6;
  if(d.dartsThisDouble>=dartsNeeded){
    d.results[targetNum+(d.extra?'-extra':'')] = {hits:d.hitsThisDouble, of:dartsNeeded};
    d.dartsThisDouble=0; d.hitsThisDouble=0;
    d.idx++;
    if(!d.extra && d.idx>=PRO_ROUTINE_DOUBLES_ORDER.length){
      const rates = PRO_ROUTINE_DOUBLES_ORDER.map(n=>({n, rate: d.results[n].hits/d.results[n].of}));
      rates.sort((a,b)=>a.rate-b.rate);
      d.extraQueue = [rates[0].n, rates[1].n];
      d.extra = true;
      d.idx = 0;
    } else if(d.extra && d.idx>=d.extraQueue.length){
      proRoutineAdvancePhase();
    }
  }
}
function proRoutineFinishingDart(num, mult){
  const f = state.proRoutine.finishing;
  const value = proRoutineDartValue(num, mult);
  const target = PRO_ROUTINE_CHECKOUTS[f.idx];
  const isFinishDart = (mult==='double' || (num==='B'&&mult==='bull')) && value===f.remaining;
  f.dartsThisCheckout++;
  if(isFinishDart){
    f.results[target] = {success:true, dartsUsed:f.dartsThisCheckout};
    proRoutineFinishingNext();
    return;
  }
  const newRemaining = f.remaining - value;
  const busted = newRemaining<0 || newRemaining===1;
  if(busted || f.dartsThisCheckout>=3){
    f.results[target] = {success:false, dartsUsed:f.dartsThisCheckout};
    proRoutineFinishingNext();
    return;
  }
  f.remaining = newRemaining;
}
function proRoutineFinishingNext(){
  const f = state.proRoutine.finishing;
  f.idx++;
  f.dartsThisCheckout=0;
  if(f.idx>=PRO_ROUTINE_CHECKOUTS.length) proRoutineAdvancePhase();
  else f.remaining = PRO_ROUTINE_CHECKOUTS[f.idx];
}
function proRoutinePressureDart(num, mult){
  const pr = state.proRoutine.pressure;
  if(pr.remaining===undefined) pr.remaining = 40;
  if(!pr.currentVisit) pr.currentVisit = [];
  const value = proRoutineDartValue(num, mult);
  const isFinishDart = mult==='double' && value===pr.remaining;
  pr.currentVisit.push({num,mult,value});
  if(isFinishDart){
    pr.successes++; pr.attempts++;
    pr.currentVisit=[]; pr.remaining=40;
    if(pr.successes>=pr.needed) proRoutineAdvancePhase();
    return;
  }
  const newRemaining = pr.remaining - value;
  const busted = newRemaining<0 || newRemaining===1;
  if(busted || pr.currentVisit.length>=3){
    pr.attempts++;
    pr.currentVisit=[]; pr.remaining=40;
    return;
  }
  pr.remaining = newRemaining;
}
function proRoutineRecordDart(num, mult, point){
  const t = state.proRoutine;
  if(!t) return;
  if(t.phase==='warmup') proRoutineWarmupDart();
  else if(t.phase==='precision') proRoutinePrecisionDart(point);
  else if(t.phase==='scoring') proRoutineScoringDart(num, mult);
  else if(t.phase==='doubles') proRoutineDoublesDart(num, mult);
  else if(t.phase==='finishing') proRoutineFinishingDart(num, mult);
  else if(t.phase==='pressure') proRoutinePressureDart(num, mult);
  render();
}

function commitBoardThrow(c){
  if(state.screen==='throwAnalyzer'){
    if(c.point) throwAnalyzerRecordDart(c.point);
    return;
  }
  state.pendingBoard = null;
  state.pendingHitPoint = c.point || null;
  state.returnedToPreviousPlayer = false;
  if(state.practiceSession && c.point) state.practiceSession.lastHitPoint = c.point;
  if(state.checkoutPractice && c.point) state.checkoutPractice.lastHitPoint = c.point;
  let num, mult;
  if(c.seg==='bullinner'){ num='B'; mult='bull'; }
  else if(c.seg==='bullouter'){ num='B'; mult='single'; }
  else { num=parseInt(c.num,10); mult=c.seg; }
  if(state.screen==='proRoutine'){
    proRoutineRecordDart(num, mult, c.point);
    return;
  }
  if(state.screen==='practiceActive'){
    const ps = state.practiceSession;
    const aimedAt = practiceCurrentTarget(ps);
    const aimSeg = (ps.def.requiredMultiplier && ps.def.requiredMultiplier!=='any') ? ps.def.requiredMultiplier : 'single';
    const isHit = practiceApplyDart(ps, num, mult);
    if(c.point && aimedAt!==undefined){
      if(!ps.hitPoints) ps.hitPoints = [];
      const ideal = boardPointForTarget(aimedAt, aimSeg);
      const distPx = Math.sqrt((c.point.x-ideal.x)**2 + (c.point.y-ideal.y)**2);
      const distMM = distPx / (R_DOUBLE_OUT/170);
      ps.hitPoints.push({x:c.point.x, y:c.point.y, hit:!!isHit, distMM});
    }
    checkPracticeDone();
    render();
  } else if(state.screen==='checkoutPracticeActive'){
    checkoutPracticeApplyDart(state.checkoutPractice, num, mult);
    checkCheckoutPracticeDone();
    render();
  } else if(state.screen==='blackoutActive'){
    const bs = state.blackoutSession;
    const wasComplete = bs.complete;
    blackoutApplyDart(bs, num, mult, c.point);
    if(bs.complete && !wasComplete) finishBlackoutSession();
    render();
  } else if(state.session && state.session.kind==='callshot'){
    // Route through the exact same state machine manual board taps use —
    // confirmed the bug: camera throws were reaching commitBoardThrow but
    // falling through every branch here with no callshot case at all.
    const zoneId = callShotZoneIdFromNumSeg(c.num, c.seg);
    callShotRegisterDart(zoneId);
  } else if(state.session){
    dispatchThrow(num, mult);
  }
}

/* ========================= THROW DISPATCH ========================= */
function dispatchThrow(num, segType){
  const s = state.session;
  if(!s) return;
  const pid = currentSessionPlayerId(s);
  const targets = accuracyTargetsFor(s);
  dispatchThrowCore(num, segType);
  if(pid && targets.length) recordAccuracyDart(pid, targets, num);
}
function dispatchThrowCore(num, segType){
  const s = state.session;
  if(!s) return;
  if(!s.turnHitPoints || s.currentTurnDarts.length===0) s.turnHitPoints = [];
  const thisPoint = state.pendingHitPoint || null;
  state.pendingHitPoint = null;
  if(thisPoint) s.turnHitPoints.push(thisPoint);
  if(s.kind==='x01'){
    let throwObj;
    if(num==='B' && segType==='bull') throwObj = {label:fullDartLabel('B','bull'),value:50,type:'bull'};
    else if(num==='B' && segType==='single') throwObj = {label:fullDartLabel('B','single'),value:25,type:'bull'};
    else {
      const n = num;
      if(segType==='single') throwObj = {label:fullDartLabel(n,'single'),value:n,type:'single',n};
      else if(segType==='double') throwObj = {label:fullDartLabel(n,'double'),value:n*2,type:'double',n};
      else throwObj = {label:fullDartLabel(n,'triple'),value:n*3,type:'triple',n};
    }
    const res = x01ApplyDart(s, throwObj);
    if(res.turnOver){
      if(res.bust){ finalizeBustThenAdvance(s); }
      else { x01EndTurn(s); if(s.complete) finishX01Game(s); }
    }
  } else if(s.kind==='cricket'){
    const validNums = [20,19,18,17,16,15,'B'];
    const targetNum = num==='B' ? 'B' : num;
    if(!validNums.includes(targetNum)){ /* off-cricket-number hit: just record as miss-equivalent */
      state.session.currentTurnDarts.push({label:'No Score', num:null, marksHit:0, pointsScored:0});
      if(state.session.currentTurnDarts.length>=3 || s.complete){
        cricketEndTurn(s);
        if(s.complete){ finishCricketGame(s); }
      }
      render(); return;
    }
    const marksHit = segType==='bull' ? 2 : segType==='double' ? 2 : segType==='triple' ? 3 : 1;
    const realMarks = (targetNum==='B') ? (segType==='bull'?2:1) : marksHit;
    const res = cricketApplyDart(s, targetNum, realMarks);
    if(res.turnOver){
      cricketEndTurn(s);
      if(s.complete){ finishCricketGame(s); }
    }
  } else if(s.kind==='custom'){
    const res = customApplyDart(s, num, segType);
    if(res.turnOver){
      customEndTurn(s);
      if(s.complete){ finishCustomGame(s); }
    }
  } else if(s.kind==='atc'){
    const res = atcApplyDart(s, num, segType);
    if(res.turnOver){ atcEndTurn(s); if(s.complete) finishAtcGame(s); }
  } else if(s.kind==='shanghai'){
    const res = shanghaiApplyDart(s, num, segType);
    if(res.turnOver){ shanghaiEndTurn(s); if(s.complete) finishShanghaiGame(s); }
  } else if(s.kind==='baseball'){
    const res = baseballApplyDart(s, num, segType);
    if(res.turnOver){ baseballEndTurn(s); if(s.complete) finishBaseballGame(s); }
  } else if(s.kind==='halveit'){
    const res = halveItApplyDart(s, num, segType);
    if(res.turnOver){ halveItEndTurn(s); if(s.complete) finishHalveItGame(s); }
  } else if(s.kind==='killer'){
    const res = killerApplyDart(s, num, segType);
    if(res.turnOver){ killerEndTurn(s); if(s.complete) finishKillerGame(s); }
  } else if(s.kind==='personalbest'){
    const res = personalBestApplyDart(s, num, segType);
    if(res.turnOver){ personalBestEndTurn(s); if(s.complete) finishPersonalBestGame(s); }
  }
  if(s.currentTurnDarts.length>0){
    const last = s.currentTurnDarts[s.currentTurnDarts.length-1];
    last._num = num; last._segType = segType;
  }
  render();
}
function recordMiss(){
  if(state.screen==='proRoutine'){ proRoutineRecordDart(0,'miss',null); return; }
  const s = state.session;
  if(!s) return;
  const pid = currentSessionPlayerId(s);
  const targets = accuracyTargetsFor(s);
  recordMissCore();
  if(pid && targets.length) recordAccuracyDart(pid, targets, null);
}
function recordMissCore(){
  const s = state.session;
  state.returnedToPreviousPlayer = false;
  if(!s.turnHitPoints || s.currentTurnDarts.length===0) s.turnHitPoints = [];
  const thisMissPoint = state.pendingHitPoint || null;
  state.pendingHitPoint = null;
  if(thisMissPoint) s.turnHitPoints.push(thisMissPoint);
  if(s.kind==='x01'){
    if(s.currentTurnDarts.length===0) s.scoreBeforeTurn = x01Current(s).score;
    s.currentTurnDarts.push({label:'Miss', value:0});
    x01Current(s).stats.darts++;
    if(s.currentTurnDarts.length>=3){ x01EndTurn(s); if(s.complete) finishX01Game(s); }
  } else if(s.kind==='cricket'){
    s.currentTurnDarts.push({label:'Miss', num:null, marksHit:0, pointsScored:0});
    if(s.currentTurnDarts.length>=3){ cricketEndTurn(s); if(s.complete) finishCricketGame(s); }
  } else if(s.kind==='custom'){
    const res = customApplyDart(s, 0, 'miss');
    if(res.turnOver){ customEndTurn(s); if(s.complete) finishCustomGame(s); }
  } else if(s.kind==='atc'){
    const res = atcApplyDart(s, 0, 'miss');
    if(res.turnOver){ atcEndTurn(s); if(s.complete) finishAtcGame(s); }
  } else if(s.kind==='shanghai'){
    const res = shanghaiApplyDart(s, 0, 'miss');
    if(res.turnOver){ shanghaiEndTurn(s); if(s.complete) finishShanghaiGame(s); }
  } else if(s.kind==='baseball'){
    const res = baseballApplyDart(s, 0, 'miss');
    if(res.turnOver){ baseballEndTurn(s); if(s.complete) finishBaseballGame(s); }
  } else if(s.kind==='halveit'){
    const res = halveItApplyDart(s, 0, 'miss');
    if(res.turnOver){ halveItEndTurn(s); if(s.complete) finishHalveItGame(s); }
  } else if(s.kind==='killer'){
    const res = killerApplyDart(s, 0, 'miss');
    if(res.turnOver){ killerEndTurn(s); if(s.complete) finishKillerGame(s); }
  } else if(s.kind==='callshot'){
    // Same reasoning as commitBoardThrow above — a genuine off-the-board
    // miss (whether a real board click or a camera-detected miss) needs to
    // reach the callshot state machine too, not just real hits.
    callShotRegisterDart(null);
    return;
  } else if(s.kind==='personalbest'){
    const res = personalBestApplyDart(s, 0, 'miss');
    if(res.turnOver){ personalBestEndTurn(s); if(s.complete) finishPersonalBestGame(s); }
  }
  if(s.currentTurnDarts.length>0){
    const last = s.currentTurnDarts[s.currentTurnDarts.length-1];
    last._num = null; last._segType = 'miss';
  }
  render();
}
function finalizeBustThenAdvance(s){
  // score already reverted in x01ApplyDart (not applied), just end turn now
  const p = x01Current(s);
  const name = playerName(p.playerId);
  const bustDart = s.currentTurnDarts[s.currentTurnDarts.length-1];
  s.lastTurnSummary = `<b>${name} busted!</b><br>${bustDart ? bustDart.label+' — ' : ''}turn reverts to ${s.scoreBeforeTurn}.`;
  x01EndTurn(s);
}

/* ========================= BOT OPPONENT ENGINE (X01) =========================
   A bot "player" is just a regular player object with isBot:true + botRating (1-10).
   This simulates a real dart landing near an intended target, with spread that
   tightens as rating goes up, then feeds the result through the same
   dispatchThrow()/recordMiss() pipeline a human throw uses — no separate scoring path. */
const BOT_RATING_STDDEV_MM = { min:6, max:65 }; // rating 10 -> 6mm groups (pro), rating 1 -> 65mm (newbie, often off-target entirely)
function randomDelayMs(minSec, maxSec){ return (minSec + Math.random()*(maxSec-minSec)) * 1000; }
// Bot pacing, tuned to feel like watching a real opponent rather than an instant score update.
const BOT_TIMING = {
  lineUp: [4, 6],      // pause before the first dart of a turn/attempt, as if lining up the shot
  betweenDarts: [1.5, 3], // gap between darts within the same turn
  handoff: [3, 5],     // pause after a bot's turn ends before the next action is checked
};
// Converts a real click/tap event on an SVG board into exact SVG-space coordinates, so hit
// markers can be placed exactly where a dart landed rather than just "somewhere in this wedge."
function handleMissRingClick(evt, handlerExpr){
  evt.stopPropagation();
  state.pendingHitPoint = svgPointFromEvent(evt);
  (new Function(handlerExpr))();
}
function svgPointFromEvent(evt){
  const target = evt.target;
  const svg = (target.ownerSVGElement) || (target.closest ? target.closest('svg') : null);
  if(!svg || !svg.createSVGPoint) return null;
  try{
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const ctm = svg.getScreenCTM();
    if(!ctm) return null;
    const svgP = pt.matrixTransform(ctm.inverse());
    return {x: svgP.x, y: svgP.y};
  } catch(e){ return null; }
}
function botStddevPx(rating){
  const r = Math.max(1, Math.min(10, rating||5));
  const mm = BOT_RATING_STDDEV_MM.max - (r-1) * (BOT_RATING_STDDEV_MM.max-BOT_RATING_STDDEV_MM.min)/9;
  const pxPerMM = R_DOUBLE_OUT/170; // R_DOUBLE_OUT normalized to a regulation 170mm doubles-wire radius
  return mm * pxPerMM;
}
function boardPointForTarget(num, segType){
  if(num==='B'){
    if(segType==='bull') return {x:BOARD_CX, y:BOARD_CY};
    const r = (R_BULL_INNER+R_BULL_OUTER)/2;
    return {x:BOARD_CX, y:BOARD_CY - r};
  }
  const idx = BOARD_ORDER.indexOf(num);
  const angle = idx*18 + WEDGE_ROTATION;
  let r;
  if(segType==='triple') r = (R_TRIPLE_IN+R_TRIPLE_OUT)/2;
  else if(segType==='double') r = (R_DOUBLE_IN+R_DOUBLE_OUT)/2;
  else r = (R_TRIPLE_OUT+R_DOUBLE_IN)/2; // single: aim at the wider outer single band
  const [x,y] = polar(BOARD_CX,BOARD_CY,r,angle);
  return {x:parseFloat(x), y:parseFloat(y)};
}
function gaussianRandom(){
  let u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function simulateBotDart(num, segType, rating){
  const target = boardPointForTarget(num, segType);
  const stddev = botStddevPx(rating);
  const actualX = target.x + gaussianRandom()*stddev;
  const actualY = target.y + gaussianRandom()*stddev;
  return {...scoreForPoint(actualX, actualY), x: actualX, y: actualY};
}
function resolveBotDartResult(result){
  if(result.ring==='totalMiss' || result.ring==='over'){ recordMiss(); return; }
  let num, seg;
  if(result.ring==='bullInner'){ num='B'; seg='bull'; }
  else if(result.ring==='bullOuter'){ num='B'; seg='single'; }
  else if(result.ring==='triple'){ num=result.number; seg='triple'; }
  else if(result.ring==='double'){ num=result.number; seg='double'; }
  else { num=result.number; seg='single'; } // 'inner' or 'outer' single band
  dispatchThrow(num, seg);
}
function parseThrowLabel(label){
  if(label==='DB') return {num:'B', seg:'bull'};
  if(label==='SB') return {num:'B', seg:'single'};
  const seg = label[0]==='T' ? 'triple' : label[0]==='D' ? 'double' : 'single';
  return {num: parseInt(label.slice(1),10), seg};
}
function botChooseX01Target(s){
  const p = x01Current(s);
  const dartsLeft = 3 - s.currentTurnDarts.length;
  const route = findCheckout(p.score, dartsLeft, s.outRule);
  if(route && route.length) return parseThrowLabel(route[0]);
  return {num:20, seg:'triple'};
}
// Picks a target for any bot-playable game kind except Call Your Shot (which has its own engine
// below, since its target system is fundamentally different — zones, not num+multiplier).
function botChooseGenericTarget(s){
  if(s.kind==='x01') return botChooseX01Target(s);
  const highlighted = getCurrentGameTargetHighlightRaw(s);
  if(highlighted) return highlighted;
  if(s.kind==='killer'){
    // Already a killer with no single obvious target (getCurrentGameTargetHighlight only
    // suggests a target before becoming a killer) — go hunt a random living rival.
    const me = killerCurrent(s);
    const rivals = s.participants.filter(p=>p!==me && !p.eliminated);
    if(rivals.length){
      const victim = rivals[Math.floor(Math.random()*rivals.length)];
      return {num: victim.number, seg:'single'}; // any multiplier removes a life in this game, so aim for the reliable single band
    }
  }
  return {num:20, seg:'triple'}; // sensible generic fallback (e.g. custom games with no single fixed target)
}
function isBotPlayerId(playerId){
  const p = state.players.find(x=>x.id===playerId);
  return !!(p && p.isBot);
}
function maybeRunBotTurn(){
  const s = state.session;
  if(!s || s.kind==='callshot' || s.complete || s.botTurnScheduled) return;
  const pid = s.participants[s.currentIdx].playerId;
  if(!isBotPlayerId(pid)) return;
  s.botTurnScheduled = true;
  scheduleBotDart(s.currentTurnDarts.length===0);
}
function scheduleBotDart(isFirstDart){
  const delay = isFirstDart ? randomDelayMs(...BOT_TIMING.lineUp) : randomDelayMs(...BOT_TIMING.betweenDarts);
  setTimeout(()=>{
    const s = state.session;
    if(!s || s.kind==='callshot' || s.complete){ if(s) s.botTurnScheduled=false; return; }
    const pid = s.participants[s.currentIdx].playerId;
    if(!isBotPlayerId(pid)){ s.botTurnScheduled = false; render(); return; }
    const beforeIdx = s.currentIdx;
    const beforeDarts = s.currentTurnDarts.length;
    const player = state.players.find(x=>x.id===pid);
    const target = botChooseGenericTarget(s);
    const result = simulateBotDart(target.num, target.seg, player ? player.botRating : 5);
    state.pendingHitPoint = {x: result.x, y: result.y};
    resolveBotDartResult(result);
    const s2 = state.session;
    if(!s2 || s2.complete){ if(s2) s2.botTurnScheduled=false; return; }
    if(s2.currentIdx===beforeIdx && s2.currentTurnDarts.length>beforeDarts && s2.currentTurnDarts.length<3){
      scheduleBotDart(false);
    } else {
      setTimeout(()=>{
        s2.botTurnScheduled = false;
        maybeRunBotTurn();
      }, randomDelayMs(...BOT_TIMING.handoff));
    }
  }, delay);
}

/* ========================= BOT OPPONENT ENGINE (CALL YOUR SHOT) =========================
   Different target system than X01 (zone ids like "20-triple" or "bull-inner" instead of
   num+multiplier), so this gets its own aim/landing logic, but reuses the same underlying
   throw-simulation physics (botStddevPx, gaussianRandom) and feeds results through the exact
   same callShotSelectTarget()/callShotRegisterDart() functions a human's board taps use. */
function callShotZoneIdForPoint(px, py){
  const {radius, angleDeg} = boardPointToPolar(px, py);
  const ring = ringForRadius(radius);
  if(ring==='bullInner') return 'bull-inner';
  if(ring==='bullOuter') return 'bull-outer';
  if(ring==='over' || ring==='totalMiss') return null;
  const number = numberForAngle(angleDeg);
  return number+'-'+ring; // ring here is 'inner'|'triple'|'outer'|'double'
}
function callShotAimPointForZone(zoneId){
  if(zoneId.endsWith('-single')){
    const num = zoneId.slice(0, zoneId.lastIndexOf('-'));
    const z = sectionZoneById(num+'-outer') || sectionZoneById(num+'-inner');
    return {x:z.x, y:z.y};
  }
  const z = sectionZoneById(zoneId);
  return {x:z.x, y:z.y};
}
function simulateCallShotDart(targetZoneId, rating){
  const point = callShotAimPointForZone(targetZoneId);
  const stddev = botStddevPx(rating);
  const actualX = point.x + gaussianRandom()*stddev;
  const actualY = point.y + gaussianRandom()*stddev;
  return {zoneId: callShotZoneIdForPoint(actualX, actualY), x: actualX, y: actualY};
}
function botPickCallShotCallTargets(s, rating){
  let pool;
  if(rating<=3) pool = SECTION_TARGET_ZONES.filter(z=> z.band==='inner'||z.band==='outer'||z.band==='bull-outer');
  else if(rating<=7) pool = SECTION_TARGET_ZONES.filter(z=> z.band!=='triple' && z.band!=='bull-inner');
  else pool = SECTION_TARGET_ZONES;
  if(!pool.length) pool = SECTION_TARGET_ZONES;
  const chosen = [];
  let guard = 0;
  while(chosen.length < s.numTargets && guard < 50){
    guard++;
    const z = pool[Math.floor(Math.random()*pool.length)];
    const canonical = callShotCanonicalZone(z.id);
    if(!chosen.includes(canonical) && !s.calledTargets.includes(canonical)) chosen.push(canonical);
  }
  return chosen;
}
function maybeRunCallShotBotTurn(){
  const s = state.session;
  if(!s || s.kind!=='callshot' || s.complete || s.botTurnScheduled) return;
  const pid = s.participants[s.currentIdx].playerId;
  if(!isBotPlayerId(pid)) return;
  s.botTurnScheduled = true;
  const isFirstAction = s.stage==='callselect' ? s.calledTargets.length===0 : s.dartsUsedThisAttempt===0;
  scheduleCallShotBotAction(isFirstAction);
}
function scheduleCallShotBotAction(isFirstAction){
  const delay = isFirstAction ? randomDelayMs(...BOT_TIMING.lineUp) : randomDelayMs(...BOT_TIMING.betweenDarts);
  setTimeout(()=>{
    const s = state.session;
    if(!s || s.kind!=='callshot' || s.complete){ if(s) s.botTurnScheduled=false; return; }
    const pid = s.participants[s.currentIdx].playerId;
    if(!isBotPlayerId(pid)){ s.botTurnScheduled=false; render(); return; }
    const player = state.players.find(x=>x.id===pid);
    const rating = player ? player.botRating : 5;

    if(s.stage==='callselect'){
      const targets = botPickCallShotCallTargets(s, rating);
      let i = 0;
      const callNext = ()=>{
        const s2 = state.session;
        if(!s2 || s2.kind!=='callshot' || s2.complete || s2.stage!=='callselect'){
          if(s2) s2.botTurnScheduled=false;
          render();
          setTimeout(maybeRunCallShotBotTurn, randomDelayMs(...BOT_TIMING.handoff));
          return;
        }
        if(i>=targets.length){ s2.botTurnScheduled=false; render(); maybeRunCallShotBotTurn(); return; }
        callShotSelectTarget(targets[i]);
        i++;
        setTimeout(callNext, randomDelayMs(...BOT_TIMING.betweenDarts));
      };
      callNext();
      return;
    }

    const beforeIdx = s.currentIdx, beforeStage = s.stage, beforeRound = s.round;
    let targetId;
    if(s.mode==='natural' && s.calledTargets.length===0){
      targetId = '20-triple'; // nothing called yet — bot just throws at its go-to spot to establish the shot
    } else {
      targetId = s.orderMatters ? s.calledTargets[s.targetIndex] : s.calledTargets.find((tid,i)=>!s.hitTargets.includes(i));
    }
    const throwResult = simulateCallShotDart(targetId, rating);
    state.pendingHitPoint = {x: throwResult.x, y: throwResult.y};
    callShotRegisterDart(throwResult.zoneId);

    const s2 = state.session;
    if(!s2 || s2.complete){ if(s2) s2.botTurnScheduled=false; return; }
    const stillSameActor = (s2.currentIdx===beforeIdx && s2.stage===beforeStage && s2.round===beforeRound);
    if(stillSameActor){
      scheduleCallShotBotAction(false);
    } else {
      setTimeout(()=>{
        s2.botTurnScheduled = false;
        maybeRunCallShotBotTurn();
      }, randomDelayMs(...BOT_TIMING.handoff));
    }
  }, delay);
}

function removeDartFromCurrentTurn(index){
  const s = state.session;
  if(!s || index<0 || index>=s.currentTurnDarts.length) return;
  const toReplay = s.currentTurnDarts.filter((d,i)=>i!==index).map(d=>({num:d._num, segType:d._segType}));
  while(s.currentTurnDarts.length>0){
    if(s.kind==='x01') x01Undo(s);
    else if(s.kind==='cricket') cricketUndo(s);

function numRange(start,end,step,decimals,suffix){
  const arr=[];
  const steps = Math.round((end-start)/step);
  for(let i=0;i<=steps;i++){
    const v = start + i*step;
    arr.push(v.toFixed(decimals)+suffix);
  }
  return arr;
}

// Fallback catch-alls always stay pinned at the end, in this order, regardless of how the rest sorts.
const DART_OPTION_SENTINELS = ['Other','Unknown'];
function sortDartOptionList(arr){
  const sentinels = [], rest = [];
  arr.forEach(v=>{ (DART_OPTION_SENTINELS.includes(v) ? sentinels : rest).push(v); });
  const numericRe = /^-?\d+(\.\d+)?/;
  const allNumeric = rest.length>0 && rest.every(v=>numericRe.test(String(v).trim()));
  if(allNumeric){
    rest.sort((a,b)=> parseFloat(a) - parseFloat(b));
  } else {
    rest.sort((a,b)=> a.localeCompare(b, undefined, {sensitivity:'base', numeric:true}));
  }
  sentinels.sort((a,b)=> DART_OPTION_SENTINELS.indexOf(a) - DART_OPTION_SENTINELS.indexOf(b));
  return [...rest, ...sentinels];
}

function handleDartPhotoUpload(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      state.dartBuilder.photo = canvas.toDataURL('image/jpeg', 0.82);
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function confidenceForThrows(n){
  if(n<15) return 'Not rated';
  if(n<60) return 'Early estimate';
  if(n<200) return 'Developing';

}
function computeGamePerformanceScore(gameType, s, playerId, extra){
  if(!s) return null;
  try{
    if(gameType==='section'){
      return extra && extra.sectionSummary ? extra.sectionSummary.avgScore : null;
    }
    if(gameType==='precisionNew'){
      if(!extra || !extra.precisionSummary) return null;
      const mm = extra.precisionSummary.avgDistanceMm;
      // 0mm -> 100, 100mm+ (a full board-radius miss) -> 0, roughly linear between
      return Math.max(0, Math.min(100, Math.round(100 - mm)));
    }
    if(gameType==='practice'){
      // s here is either a practice session (has totalDarts/successfulHits) or checkout practice (attemptsTotal/successes)
      if(s.attemptsTotal!==undefined){
        return s.attemptsTotal ? Math.round((s.successes/s.attemptsTotal)*100) : null;
      }
      return s.totalDarts ? Math.round((s.successfulHits/s.totalDarts)*100) : null;
    }
    const p = s.participants.find(x=>x.playerId===playerId);
    if(!p) return null;
    if(gameType==='301'||gameType==='501'){
      const darts = p.stats ? p.stats.darts : 0;
      if(!darts) return null;
      const scored = s.startScore - p.score;
      const perDart = scored/darts;
      return Math.max(0, Math.min(100, Math.round((perDart/60)*100)));
    }
    if(gameType==='cricket'){
      const darts = participantThrowCounts(s)[playerId] || 0;
      if(!darts) return null;
      const totalMarks = Object.values(p.marks).reduce((a,v)=>a+Math.min(v,3),0);
      return Math.max(0, Math.min(100, Math.round((totalMarks/(darts*3))*100)));
    }
    if(gameType==='atc'){
      return Math.round((p.idx/s.sequence.length)*100);
    }
    if(gameType==='killer'){
      return Math.round((p.lives/(s.startingLives||5))*100);
    }
    if(gameType==='custom' || gameType==='highscore' || gameType==='countup'){
      const darts = participantThrowCounts(s)[playerId] || 0;
      if(!darts) return null;
      const hits = Object.values(p.hits||{}).reduce((a,v)=>a+v,0);
      return Math.max(0, Math.min(100, Math.round((hits/darts)*100)));
    }
    // fallback for shanghai/baseball/halveit and anything else: relative to top scorer
    const scores = s.participants.map(x=>x.score||0);
    const top = Math.max(...scores, 1);
    return Math.round(((p.score||0)/top)*100);
  } catch(e){ return null; }
}
function updateDartPerformance(playerId, dartSetupId, gameType, gameScore, throwCount){
  if(gameScore===null || gameScore===undefined) return;
  const key = playerId+'|'+dartSetupId;
  let rec = state.playerDartPerformance[key];
  if(!rec){
    rec = {playerId, dartSetupId, totalThrows:0, savedGames:0, overallRating:0, confidenceLevel:'Not rated', ratingsByGame:{}, lastUsedAt:null};
    state.playerDartPerformance[key] = rec;
  }
  rec.savedGames++;
  rec.totalThrows += (throwCount||0);
  rec.lastUsedAt = Date.now();
  const gr = rec.ratingsByGame[gameType] || {rating:gameScore, count:0};
  gr.count++;
  gr.rating = Math.round(((gr.rating*(gr.count-1)) + gameScore)/gr.count);
  rec.ratingsByGame[gameType] = gr;
  const gameRatings = Object.values(rec.ratingsByGame).map(g=>g.rating);
  rec.overallRating = Math.round(gameRatings.reduce((a,b)=>a+b,0)/gameRatings.length);
  rec.confidenceLevel = confidenceForThrows(rec.totalThrows);
  updateAttributePerformance(playerId, dartSetupId, gameScore, throwCount);
}
function updateAttributePerformance(playerId, dartSetupId, gameScore, throwCount){
  const setup = state.dartSetups.find(d=>d.id===dartSetupId);
  if(!setup) return;
  if(!state.playerAttributePerformance[playerId]) state.playerAttributePerformance[playerId] = {};
  const store = state.playerAttributePerformance[playerId];
  allDartSelectFields().forEach(f=>{
    const val = setup[f.key];
    if(!val || val==='Unknown') return;
    if(!store[f.key]) store[f.key] = {};
    const bucket = store[f.key][val] || {rating:gameScore, count:0, totalThrows:0};
    bucket.count++;
    bucket.totalThrows += (throwCount||0);
    bucket.rating = Math.round(((bucket.rating*(bucket.count-1)) + gameScore)/bucket.count);
    store[f.key][val] = bucket;
  });
}

function participantThrowCounts(s){
  const counts = {};
  s.participants.forEach((p,idx)=>{
    let n = 0;
    (s.turnHistory||[]).forEach(t=>{
      const ti = t.participantIdx!==undefined ? t.participantIdx : t.currentIdx;
      if(ti===idx) n += t.darts.length;
    });
    if(idx===s.currentIdx) n += s.currentTurnDarts.length;
    counts[p.playerId] = n;
  });
  return counts;
}

function personalBestUndo(s){
  if(s.currentTurnDarts.length>0){
    s.currentTurnDarts.pop();
    return;
  }
  if(s.turnHistory.length===0) return;
  const last = s.turnHistory.pop();
  const p = s.participants.find(x=>x.playerId===last.playerId);
  if(!p) return;
  p.roundScores.pop();
  if(p.roundScores.length===0){ p.currentGameBest = null; }
  else if(s.mode==='high'){ p.currentGameBest = Math.max(...p.roundScores); }
  else { p.currentGameBest = personalBestAverage(p); }
  p.newGameRecord = false; p.newAllTimeRecord = false;
  s.currentIdx = s.participants.indexOf(p);
  s.round = last.round;
  s.complete = false; s.winnerId = null;
}
const ENGINE_HOOKS = {
  atc:{undo:atcUndo, endTurn:atcEndTurn, finish:finishAtcGame},
  shanghai:{undo:shanghaiUndo, endTurn:shanghaiEndTurn, finish:finishShanghaiGame},
  baseball:{undo:baseballUndo, endTurn:baseballEndTurn, finish:finishBaseballGame},
  halveit:{undo:halveItUndo, endTurn:halveItEndTurn, finish:finishHalveItGame},
  killer:{undo:killerUndo, endTurn:killerEndTurn, finish:finishKillerGame},
  custom:{undo:customUndo, endTurn:customEndTurn, finish:finishCustomGame},
  personalbest:{undo:personalBestUndo, endTurn:personalBestEndTurn, finish:finishPersonalBestGame},
};
function doUndo(){
  const s = state.session;
  if(!s) return;
  if(s.kind==='x01') x01Undo(s);
  else if(s.kind==='cricket') cricketUndo(s);
  else if(ENGINE_HOOKS[s.kind]) ENGINE_HOOKS[s.kind].undo(s);
  if(s.turnHitPoints) s.turnHitPoints = s.turnHitPoints.slice(0, s.currentTurnDarts.length);
  state.screen = 'active';
  render();
}
function doClearTurn(){
  const s = state.session;
  if(!s) return;
  if(s.kind==='x01'){
    x01Current(s).score = s.scoreBeforeTurn;
    s.currentTurnDarts = [];
  } else if(s.kind==='cricket'){
    while(s.currentTurnDarts.length>0){ cricketUndo(s); }
  } else if(ENGINE_HOOKS[s.kind]){
    while(s.currentTurnDarts.length>0){ ENGINE_HOOKS[s.kind].undo(s); }
  }
  s.turnHitPoints = [];
  render();
}
// "Return to Previous Player" only ever goes back exactly one player, and
// only once per use — confirmed the underlying mechanism already exists:
// every game's own undo function, once the current turn is already empty,
// naturally pops turn history and reverts to the previous player. This
// just clears the current turn first (if needed), then triggers that one
// more time, and tracks that it's been used so the button greys out
// afterward rather than allowing a second, deeper rewind.
function returnToPreviousPlayer(){
  const s = state.session;
  if(!s || state.returnedToPreviousPlayer) return;
  if(!s.turnHistory || s.turnHistory.length===0) return;
  if(s.currentTurnDarts.length>0){ doClearTurn(); }
  doUndo();
  state.returnedToPreviousPlayer = true;
  render();
}
function doEndTurnManually(){
  const s = state.session;
  if(!s || s.currentTurnDarts.length===0) return;
  if(s.kind==='x01'){ x01EndTurn(s); if(s.complete) finishX01Game(s); }
  else if(s.kind==='cricket'){ cricketEndTurn(s); if(s.complete) finishCricketGame(s); }
  else if(ENGINE_HOOKS[s.kind]){
    const hooks = ENGINE_HOOKS[s.kind];
    hooks.endTurn(s);
    if(s.complete) hooks.finish(s);
  }
  render();
}

// The Fullscreen API only fires when a page explicitly requests it — it
// never fires for a browser launched with a kiosk command-line flag
// (`firefox --kiosk ...`), even though the window genuinely is fullscreen
// at the OS level. Confirmed the hard way: this is exactly why the device
// box was sitting inset with padding and rounded corners on the real TV,
// even in "full screen." Detect that case directly by checking whether
// the window's own outer dimensions match the physical screen.
function detectKioskFullscreen(){
  if(document.fullscreenElement) return; // already handled by the real API
  const looksFullscreen = window.outerWidth>=screen.width-2 && window.outerHeight>=screen.height-2;
  if(looksFullscreen !== state.isFullscreen){
    state.isFullscreen = looksFullscreen;
    const shell = document.getElementById('appShell');
    if(shell) shell.classList.toggle('fullscreen-mode', looksFullscreen);
    render();
  }
}

// Generic pointer-based drag-to-reorder, reused by both Player Management
// (reorders your saved roster) and Who's Playing (reorders turn order).
// listGetter/listSetter let each screen supply its own array without this
// function needing to know which one it's touching.
function beginPlayerRowDrag(evt, id, listGetter, listSetter){
  evt.preventDefault();
  const container = evt.target.closest('.player-list');
  if(!container) return;
  const startY = evt.clientY;
  const rows = Array.from(container.querySelectorAll('.player-row-unified'));
  if(rows.length<2) return;
  const rowHeight = rows[0].offsetHeight + 6;
  const list = listGetter();
  const startIndex = list.indexOf(id);
  if(startIndex===-1) return;
  function onMove(e){
    const dy = e.clientY - startY;
    const shift = Math.round(dy / rowHeight);
    const newIndex = Math.max(0, Math.min(list.length-1, startIndex + shift));
    const current = listGetter();
    if(current.indexOf(id)!==newIndex){
      const next = current.slice();
      next.splice(next.indexOf(id),1);
      next.splice(newIndex,0,id);
      listSetter(next);
      render();
    }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function playerStatsFor(id){
  const allEntries = state.history.filter(h=>h.participantIds && h.participantIds.includes(id));
  const gameEntries = allEntries.filter(h=>!isPracticeHistoryType(h.type));
  const practiceEntries = allEntries.filter(h=>isPracticeHistoryType(h.type));
  const player = state.players.find(x=>x.id===id);
  function favoriteOf(entries){
    const counts = {};
    entries.forEach(h=>{ counts[h.type]=(counts[h.type]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    return top ? top[0] : null;
  }
  const gamesPlayed = gameEntries.length;
  const wins = gameEntries.filter(h=>player && h.winner===player.name).length;
  const winPct = gamesPlayed ? Math.round((wins/gamesPlayed)*100) : 0;
  let streak = 0;
  for(const h of gameEntries){
    if(player && h.winner===player.name) streak++;
    else break;
  }
  const dartRecords = Object.values(state.playerDartPerformance).filter(r=>r.playerId===id);
  return {
    gamesPlayed, wins, winPct, streak, entries: gameEntries, favoriteGame: favoriteOf(gameEntries),
    games: {played: gamesPlayed, wins, winPct, streak, entries: gameEntries, favorite: favoriteOf(gameEntries)},
    practice: {played: practiceEntries.length, entries: practiceEntries, favorite: favoriteOf(practiceEntries)},
    dartRecords,
  };
}

// Outside of Practice, an "inner single" and "outer single" are the same shot — both just Single N.
// This collapses the two distance-based single zones into one canonical id so calling/matching treats them as equal.
function callShotZoneIdFromNumSeg(num, seg){
  if(num==='B') return seg==='bullinner' ? 'bull-inner' : 'bull-outer';
  return `${num}-${seg}`;
}
function callShotHighlightFromZoneId(zoneId){
  if(!zoneId) return null;
  if(zoneId==='bull-inner') return {num:'B', seg:'bull'};
  if(zoneId==='bull-outer') return {num:'B', seg:'single'};
  const idx = zoneId.lastIndexOf('-');
  return {num: parseInt(zoneId.slice(0,idx),10), seg: zoneId.slice(idx+1)};

function callShotDartboardClickForCall(evt){

  const zoneId = callShotZoneIdFromNumSeg(t.getAttribute('data-num'), t.getAttribute('data-seg'));
  callShotSelectTarget(zoneId);
}
function callShotDartboardClickForAttempt(evt){
  const t = evt.target;
  if(!t.classList || !t.classList.contains('board-seg')) return;
  const zoneId = callShotZoneIdFromNumSeg(t.getAttribute('data-num'), t.getAttribute('data-seg'));
  state.pendingHitPoint = svgPointFromEvent(evt) || null;
  callShotRegisterDart(zoneId);
}
function callShotCanonicalZone(zoneId){
  if(!zoneId || zoneId==='totalmiss' || zoneId==='bull-outer' || zoneId==='bull-inner') return zoneId;
  if(zoneId.endsWith('-inner') || zoneId.endsWith('-outer')){
    return zoneId.slice(0, zoneId.lastIndexOf('-'))+'-single';
  }
  return zoneId;
}
function callShotSnapshot(s){
  const clone = JSON.parse(JSON.stringify(s));
  delete clone.history;
  return clone;
}
function callShotPushHistory(s){
  if(!s.history) s.history = [];
  s.history.push(callShotSnapshot(s));
  if(s.history.length>100) s.history.shift();
}
function callShotBoardClickForCall(evt){
  const t = evt.target;
  if(!t.classList || !t.classList.contains('section-zone')) return;
  const zoneId = t.getAttribute('data-zone');
  const zone = sectionZoneById(zoneId);
  if(!zone || !zone.isTarget) return;
  callShotSelectTarget(callShotCanonicalZone(zoneId));
}
function callShotSelectTarget(zoneId){
  const s = state.session;
  if(!s || s.kind!=='callshot') return;
  if(s.calledTargets.includes(zoneId)) return;
  callShotPushHistory(s);
  s.calledTargets.push(zoneId);
  if(s.calledTargets.length >= s.numTargets){
    s.stage = 'callattempt';
    s.dartsUsedThisAttempt = 0;
    s.targetIndex = 0;
    s.hitTargets = [];
  }
  render();
}
function callShotBoardClickForAttempt(evt){
  const t = evt.target;
  const hitZoneId = (t.classList && t.classList.contains('section-zone')) ? t.getAttribute('data-zone') : null;
  const point = svgPointFromEvent(evt);
  state.pendingHitPoint = point || null;
  callShotRegisterDart(hitZoneId);
}
function callShotRegisterDart(hitZoneId){
  const s = state.session;
  if(!s || s.kind!=='callshot') return;
  callShotPushHistory(s);
  if(!s.turnHitPoints || s.currentTurnDarts.length===0) s.turnHitPoints = [];
  const thisPoint = state.pendingHitPoint || null;
  state.pendingHitPoint = null;
  if(thisPoint) s.turnHitPoints.push(thisPoint);
  // The leader's establishing dart defines the target on the spot. In "Lead &
  // Lock" that single dart also completes their round automatically; in
  // "Prove It" it only sets the target — they still have to hit it themselves
  // on a following dart, same as everyone else, or take a letter.
  if(s.mode==='natural' && s.stage==='callattempt' && s.calledTargets.length===0){
    if(hitZoneId){
      s.calledTargets = [callShotCanonicalZone(hitZoneId)];
      if(s.leaderMustProve){
        s.dartsUsedThisAttempt = 0;
        render();
        return;
      }
      callShotResolveAttempt(s, true);
    } else {
      callShotResolveAttempt(s, false);
    }
    return;
  }
  const canonicalHit = callShotCanonicalZone(hitZoneId);
  const sequential = s.orderMatters || s.calledTargets.length<=1;
  const hit = sequential
    ? (canonicalHit === s.calledTargets[s.targetIndex])
    : s.calledTargets.some((tid,i)=> tid===canonicalHit && !s.hitTargets.includes(i));
  s.dartsUsedThisAttempt++;
  s.currentTurnDarts.push({label: hit?'Hit':'Miss'});
  if(hit){
    if(sequential){ s.targetIndex++; }
    else { const idx = s.calledTargets.findIndex((tid,i)=>tid===canonicalHit && !s.hitTargets.includes(i)); s.hitTargets.push(idx); }
    const allDone = sequential ? s.targetIndex>=s.calledTargets.length : s.hitTargets.length>=s.calledTargets.length;
    if(allDone){ callShotResolveAttempt(s, true); return; }
    s.dartsUsedThisAttempt = 0;
    render();
    return;
  }
  if(s.dartsUsedThisAttempt >= s.maxDarts){
    callShotResolveAttempt(s, false);
  } else {
    render();
  }
}
function callShotAttemptThrow(hit){
  const s = state.session;
  if(!s || s.kind!=='callshot') return;
  if(hit){
    if(s.mode==='natural' && s.calledTargets.length===0){ callShotRegisterDart(SECTION_TARGET_ZONES[0].id); return; }
    const sequential = s.orderMatters || s.calledTargets.length<=1;
    const expected = sequential ? s.calledTargets[s.targetIndex] : s.calledTargets.find((tid,i)=>!s.hitTargets.includes(i));
    callShotRegisterDart(expected);
  } else {
    callShotRegisterDart(null);
  }
}
function callShotResolveAttempt(s, success){
  // Captured before any state resets below, since s.calledTargets/targetIndex
  // describe the attempt that's *just finishing* right now.
  const targetIdForSummary = s.orderMatters ? s.calledTargets[s.targetIndex] : s.calledTargets.find((tid,i)=>!s.hitTargets.includes(i));
  const targetLabelForSummary = targetIdForSummary ? sectionZoneLabel(targetIdForSummary) : 'the target';
  s.currentTurnDarts = [];
  s.turnHitPoints = [];
  if(s.stage==='callattempt'){
    const callerName = playerName(s.participants[s.callerIdx].playerId);
    if(success){
      s.lastTurnSummary = s.leaderMustProve
        ? `<b>${callerName} proved it: ${targetLabelForSummary}!</b>`
        : `<b>${callerName} set the target: ${targetLabelForSummary}.</b>`;
      s.attemptOrder = s.participants.map((p,i)=>i).filter(i=>i!==s.callerIdx && !s.participants[i].eliminated);
      s.attemptPos = 0;
      s.dartsUsedThisAttempt = 0;
      s.targetIndex = 0;
      s.hitTargets = [];
      if(s.attemptOrder.length===0){ callShotNextRound(s); render(); return; }
      s.stage = 'follow';
      s.currentIdx = s.attemptOrder[0];
    } else {
      const caller = s.participants[s.callerIdx];
      caller.letters++;
      const newLetter = s.word[caller.letters-1] || '';
      s.lastTurnSummary = `<b>${callerName} missed ${targetLabelForSummary}${newLetter?` and receives ${newLetter}`:''}.</b>`;
      if(caller.letters >= s.word.length){ caller.eliminated = true; }
      callShotNextRound(s);
    }
  } else if(s.stage==='follow'){
    const followerName = playerName(s.participants[s.currentIdx].playerId);
    if(!success){
      const p = s.participants[s.currentIdx];
      p.letters++;
      const newLetter = s.word[p.letters-1] || '';
      s.lastTurnSummary = `<b>${followerName} missed ${targetLabelForSummary}${newLetter?` and receives ${newLetter}`:''}.</b>`;
      if(p.letters >= s.word.length){ p.eliminated = true; }
    } else {
      s.lastTurnSummary = `<b>${followerName} matched ${targetLabelForSummary}!</b>`;
    }
    s.attemptPos++;
    s.dartsUsedThisAttempt = 0;
    s.targetIndex = 0;
    s.hitTargets = [];
    if(s.attemptPos >= s.attemptOrder.length){
      callShotNextRound(s);
    } else {
      s.currentIdx = s.attemptOrder[s.attemptPos];
    }
  }
  callShotCheckWin(s);
  if(s.complete) finishCallShotGame(s);
  render();
}
function callShotNextRound(s){
  const alive = s.participants.filter(p=>!p.eliminated);
  if(alive.length<=1){ callShotCheckWin(s); if(s.complete) finishCallShotGame(s); return; }
  let next = (s.callerIdx+1) % s.participants.length, tries=0;
  while(s.participants[next].eliminated && tries<=s.participants.length){ next=(next+1)%s.participants.length; tries++; }
  s.callerIdx = next;
  s.currentIdx = next;
  s.calledTargets = [];
  s.hitTargets = [];
  s.targetIndex = 0;
  s.stage = s.mode==='natural' ? 'callattempt' : 'callselect';
  s.dartsUsedThisAttempt = 0;
  s.round++;
  callShotCheckWin(s);
  if(s.complete){ finishCallShotGame(s); return; }
  // Fold "who's up now" into whatever "what just happened" summary was set
  // moments ago — without this, the instruction box correctly highlights the
  // new active player but keeps describing the *previous* player's result
  // until they actually throw, which is exactly backwards (confirmed by
  // real play: the highlight updated, the text didn't).
  const newLeaderName = playerName(s.participants[next].playerId);
  const nowInstruction = `<b>${newLeaderName} is the new leader</b><br>Throw one dart to establish the next target.`;
  s.lastTurnSummary = s.lastTurnSummary ? `${s.lastTurnSummary}<br><br>${nowInstruction}` : nowInstruction;
}
function callShotCheckWin(s){
  const alive = s.participants.filter(p=>!p.eliminated);
  if(alive.length<=1 && s.participants.length>1){
    s.complete = true;
    if(alive.length===1) s.winnerId = alive[0].playerId;
  }
}
function callShotUndo(){
  const s = state.session;
  if(!s || s.kind!=='callshot') return;
  if(!s.history || s.history.length===0) return;
  const history = s.history;
  const prev = history.pop();
  Object.keys(s).forEach(k=>{ if(k!=='history') delete s[k]; });
  Object.assign(s, prev);
  s.history = history;
  render();
}
function finishCallShotGame(s){

function startPracticeFlow(practId){
  const def0 = PRACTICES.find(p=>p.id===practId) || state.customPractices.find(p=>p.id===practId);
  if(!def0) return;
  if(def0.status==='soon') return;
  ensurePracticePlayerDefault();
  const playerId = state.practicePlayerId;
  if(!playerId){ state.screen='practicePlayerNeeded'; render(); return; }

    state.checkoutPractice = startCheckoutPractice();
    state.checkoutPracticePlayerId = playerId;
    state.pendingSelection = null;
    state.screen = 'checkoutPracticeActive';
    render();
    return;
  }
  let def;
  const nums20 = Array.from({length:20},(_,i)=>i+1);
  const shuffled = arr=>{ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const mode = state.practiceRandomMode || 'sequence';
  const applyMode = (baseDef)=>{
    if(mode==='shuffle'){ baseDef.targets = shuffled(baseDef.targets); baseDef.order = 'random'; }
    else if(mode==='perTurn' || mode==='perDart'){ baseDef.randomMode = mode; }
    return baseDef;
  };
  if(practId==='threeofeach'){
    def = applyMode({name:'Three of Each', targets:nums20, order:'numerical', requiredHits:3, multiplierRule:'simple'});
  } else if(practId==='atb-singles'){
    def = applyMode({name:'Around the Board Singles', targets:nums20, order:'numerical', requiredHits:1, multiplierRule:'exact', requiredMultiplier:'single'});
  } else if(practId==='atb-doubles'){
    def = applyMode({name:'Around the Board Doubles', targets:nums20, order:'numerical', requiredHits:1, multiplierRule:'exact', requiredMultiplier:'double'});
  } else if(practId==='atb-triples'){
    def = applyMode({name:'Around the Board Triples', targets:nums20, order:'numerical', requiredHits:1, multiplierRule:'exact', requiredMultiplier:'triple'});
  } else if(practId==='cricket-trainer'){
    def = {name:'Cricket Trainer', targets:[20,19,18,17,16,15,'B'], order:'numerical', requiredHits:3, multiplierRule:'simple'};
  } else if(practId==='twenty-scoring'){
    def = {name:'20 Scoring', targets:Array(25).fill(20), order:'numerical', requiredHits:1, multiplierRule:'exact'};
  } else if(practId==='doubles-practice'){
    def = applyMode({name:'Doubles Practice', targets:nums20, order:'numerical', requiredHits:1, multiplierRule:'exact', requiredMultiplier:'double'});
  } else if(practId==='random-target'){
    const pool = [...nums20,'B'];
    const targets = Array.from({length:15},()=>pool[Math.floor(Math.random()*pool.length)]);
    def = {name:'Random Target', targets, order:'random', requiredHits:1, multiplierRule:'exact'};
  } else if(practId==='accuracy-test'){
    def = {name:'Accuracy Test', targets:Array(15).fill('B'), order:'numerical', requiredHits:1, multiplierRule:'exact'};
  } else {
    def = def0;
  }
  state.practiceSession = startPracticeSession(def, playerId);
  state.pendingSelection = null;
  state.screen = 'practiceActive';
  render();
}

function setSetting(key, val){ state.settings[key]=val; render(); }
