function handleBoardClick(evt){
  const t = evt.target;
  if(!t.classList || !t.classList.contains('board-seg')) return;
  const num = t.getAttribute('data-num');
  const seg = t.getAttribute('data-seg');
  const point = svgPointFromEvent(evt);
  let label;
  if(seg==='bullouter'){ label='Outer Bull (25)'; }
  else if(seg==='bullinner'){ label='Bull (50)'; }
  else { label = (seg==='single'?'Single ':seg==='double'?'Double ':'Triple ')+num; }
  const candidate = {num, seg, label, point};
  if(!state.settings.boardConfirm){
    commitBoardThrow(candidate);
    return;
  }
  if(state.pendingBoard && state.pendingBoard.num===num && state.pendingBoard.seg===seg){
    commitBoardThrow(candidate);
  } else {
    state.pendingBoard = candidate;
    render();
  }
}
function commitBoardThrow(c){
  state.pendingBoard = null;
  state.pendingHitPoint = c.point || null;
  if(state.practiceSession && c.point) state.practiceSession.lastHitPoint = c.point;
  if(state.checkoutPractice && c.point) state.checkoutPractice.lastHitPoint = c.point;
  let num, mult;
  if(c.seg==='bullinner'){ num='B'; mult='bull'; }
  else if(c.seg==='bullouter'){ num='B'; mult='single'; }
  else { num=parseInt(c.num,10); mult=c.seg; }
  if(state.screen==='practiceActive'){
    const ps = state.practiceSession;
    const aimedAt = practiceCurrentTarget(ps);
    const aimSeg = (ps.def.requiredMultiplier && ps.def.requiredMultiplier!=='any') ? ps.def.requiredMultiplier : 'single';
    const isHit = practiceApplyDart(ps, num, mult);
    if(c.point && aimedAt!==undefined){
      if(!ps.hitPoints) ps.hitPoints = [];
      const ideal = boardPointForTarget(aimedAt, aimSeg);
      const distPx = Math.sqrt((c.point.x-ideal.x)**2 + (c.point.y-ideal.y)**2);
      const distMM = distPx / (R_DOUBLE_OUT/170);
      ps.hitPoints.push({x:c.point.x, y:c.point.y, hit:!!isHit, distMM});
    }
    checkPracticeDone();
    render();
  } else if(state.screen==='checkoutPracticeActive'){
    checkoutPracticeApplyDart(state.checkoutPractice, num, mult);
    checkCheckoutPracticeDone();
    render();
  } else if(state.screen==='blackoutActive'){
    const bs = state.blackoutSession;
    const wasComplete = bs.complete;
    blackoutApplyDart(bs, num, mult, c.point);
    if(bs.complete && !wasComplete) finishBlackoutSession();
    render();
  } else if(state.session){
    dispatchThrow(num, mult);
  }
}

/* ========================= THROW DISPATCH ========================= */
function dispatchThrow(num, segType){
  const s = state.session;
  if(!s) return;
  const pid = currentSessionPlayerId(s);
  const targets = accuracyTargetsFor(s);
  dispatchThrowCore(num, segType);
  if(pid && targets.length) recordAccuracyDart(pid, targets, num);
}
function dispatchThrowCore(num, segType){
  const s = state.session;
  if(!s) return;
  if(!s.turnHitPoints || s.currentTurnDarts.length===0) s.turnHitPoints = [];
  const thisPoint = state.pendingHitPoint || null;
  state.pendingHitPoint = null;
  if(thisPoint) s.turnHitPoints.push(thisPoint);
  if(s.kind==='x01'){
    let throwObj;
    if(num==='B' && segType==='bull') throwObj = {label:'DB',value:50,type:'bull'};
    else if(num==='B' && segType==='single') throwObj = {label:'SB',value:25,type:'bull'};
    else {
      const n = num;
      if(segType==='single') throwObj = {label:'S'+n,value:n,type:'single',n};
      else if(segType==='double') throwObj = {label:'D'+n,value:n*2,type:'double',n};
      else throwObj = {label:'T'+n,value:n*3,type:'triple',n};
    }
    const res = x01ApplyDart(s, throwObj);
    if(res.turnOver){
      if(res.bust){ finalizeBustThenAdvance(s); }
      else { x01EndTurn(s); if(s.complete) finishX01Game(s); }
    }
  } else if(s.kind==='cricket'){
    const validNums = [20,19,18,17,16,15,'B'];
    const targetNum = num==='B' ? 'B' : num;
    if(!validNums.includes(targetNum)){ /* off-cricket-number hit: just record as miss-equivalent */ 
      state.session.currentTurnDarts.push({label:'No Score', num:null, marksHit:0, pointsScored:0});
      if(state.session.currentTurnDarts.length>=3){ cricketEndTurn(s); }
      render(); return;
    }
    const marksHit = segType==='bull' ? 2 : segType==='double' ? 2 : segType==='triple' ? 3 : 1;
    const realMarks = (targetNum==='B') ? (segType==='bull'?2:1) : marksHit;
    const res = cricketApplyDart(s, targetNum, realMarks);
    if(res.turnOver){
      cricketEndTurn(s);
      if(s.complete){ finishCricketGame(s); }
    }
  } else if(s.kind==='custom'){
    const res = customApplyDart(s, num, segType);
    if(res.turnOver){
      customEndTurn(s);
      if(s.complete){ finishCustomGame(s); }
    }
  } else if(s.kind==='atc'){
    const res = atcApplyDart(s, num, segType);
    if(res.turnOver){ atcEndTurn(s); if(s.complete) finishAtcGame(s); }
  } else if(s.kind==='shanghai'){
    const res = shanghaiApplyDart(s, num, segType);
    if(res.turnOver){ shanghaiEndTurn(s); if(s.complete) finishShanghaiGame(s); }
  } else if(s.kind==='baseball'){
    const res = baseballApplyDart(s, num, segType);
    if(res.turnOver){ baseballEndTurn(s); if(s.complete) finishBaseballGame(s); }
  } else if(s.kind==='halveit'){
    const res = halveItApplyDart(s, num, segType);
    if(res.turnOver){ halveItEndTurn(s); if(s.complete) finishHalveItGame(s); }
  } else if(s.kind==='killer'){
    const res = killerApplyDart(s, num, segType);
    if(res.turnOver){ killerEndTurn(s); if(s.complete) finishKillerGame(s); }
  }
  if(s.currentTurnDarts.length>0){
    const last = s.currentTurnDarts[s.currentTurnDarts.length-1];
    last._num = num; last._segType = segType;
  }
  render();
}
function recordMiss(){
  const s = state.session;
  if(!s) return;
  const pid = currentSessionPlayerId(s);
  const targets = accuracyTargetsFor(s);
  recordMissCore();
  if(pid && targets.length) recordAccuracyDart(pid, targets, null);
}
function recordMissCore(){
  const s = state.session;
  if(!s.turnHitPoints || s.currentTurnDarts.length===0) s.turnHitPoints = [];
  const thisMissPoint = state.pendingHitPoint || null;
  state.pendingHitPoint = null;
  if(thisMissPoint) s.turnHitPoints.push(thisMissPoint);
  if(s.kind==='x01'){
    if(s.currentTurnDarts.length===0) s.scoreBeforeTurn = x01Current(s).score;
    s.currentTurnDarts.push({label:'Miss', value:0});
    x01Current(s).stats.darts++;
    if(s.currentTurnDarts.length>=3){ x01EndTurn(s); if(s.complete) finishX01Game(s); }
  } else if(s.kind==='cricket'){
    s.currentTurnDarts.push({label:'Miss', num:null, marksHit:0, pointsScored:0});
    if(s.currentTurnDarts.length>=3){ cricketEndTurn(s); if(s.complete) finishCricketGame(s); }
  } else if(s.kind==='custom'){
    const res = customApplyDart(s, 0, 'miss');
    if(res.turnOver){ customEndTurn(s); if(s.complete) finishCustomGame(s); }
  } else if(s.kind==='atc'){
    const res = atcApplyDart(s, 0, 'miss');
    if(res.turnOver){ atcEndTurn(s); if(s.complete) finishAtcGame(s); }
  } else if(s.kind==='shanghai'){
    const res = shanghaiApplyDart(s, 0, 'miss');
    if(res.turnOver){ shanghaiEndTurn(s); if(s.complete) finishShanghaiGame(s); }
  } else if(s.kind==='baseball'){
    const res = baseballApplyDart(s, 0, 'miss');
    if(res.turnOver){ baseballEndTurn(s); if(s.complete) finishBaseballGame(s); }
  } else if(s.kind==='halveit'){
    const res = halveItApplyDart(s, 0, 'miss');
    if(res.turnOver){ halveItEndTurn(s); if(s.complete) finishHalveItGame(s); }
  } else if(s.kind==='killer'){
    const res = killerApplyDart(s, 0, 'miss');
    if(res.turnOver){ killerEndTurn(s); if(s.complete) finishKillerGame(s); }
  }
  if(s.currentTurnDarts.length>0){
    const last = s.currentTurnDarts[s.currentTurnDarts.length-1];
    last._num = null; last._segType = 'miss';
  }
  render();
}
function finalizeBustThenAdvance(s){
  // score already reverted in x01ApplyDart (not applied), just end turn now
  x01EndTurn(s);
}

/* ========================= BOT OPPONENT ENGINE (X01) =========================
   A bot "player" is just a regular player object with isBot:true + botRating (1-10).
   This simulates a real dart landing near an intended target, with spread that
   tightens as rating goes up, then feeds the result through the same
   dispatchThrow()/recordMiss() pipeline a human throw uses — no separate scoring path. */
const BOT_RATING_STDDEV_MM = { min:6, max:65 }; // rating 10 -> 6mm groups (pro), rating 1 -> 65mm (newbie, often off-target entirely)
function randomDelayMs(minSec, maxSec){ return (minSec + Math.random()*(maxSec-minSec)) * 1000; }
// Bot pacing, tuned to feel like watching a real opponent rather than an instant score update.
const BOT_TIMING = {
  lineUp: [4, 6],      // pause before the first dart of a turn/attempt, as if lining up the shot
  betweenDarts: [1.5, 3], // gap between darts within the same turn
  handoff: [3, 5],     // pause after a bot's turn ends before the next action is checked
};
// Converts a real click/tap event on an SVG board into exact SVG-space coordinates, so hit
// markers can be placed exactly where a dart landed rather than just "somewhere in this wedge."
function handleMissRingClick(evt, handlerExpr){
  evt.stopPropagation();
  state.pendingHitPoint = svgPointFromEvent(evt);
  (new Function(handlerExpr))();
}
function svgPointFromEvent(evt){
  const target = evt.target;
  const svg = (target.ownerSVGElement) || (target.closest ? target.closest('svg') : null);
  if(!svg || !svg.createSVGPoint) return null;
  try{
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const ctm = svg.getScreenCTM();
    if(!ctm) return null;
    const svgP = pt.matrixTransform(ctm.inverse());
    return {x: svgP.x, y: svgP.y};
  } catch(e){ return null; }
}
function botStddevPx(rating){
  const r = Math.max(1, Math.min(10, rating||5));
  const mm = BOT_RATING_STDDEV_MM.max - (r-1) * (BOT_RATING_STDDEV_MM.max-BOT_RATING_STDDEV_MM.min)/9;
  const pxPerMM = R_DOUBLE_OUT/170; // R_DOUBLE_OUT normalized to a regulation 170mm doubles-wire radius
  return mm * pxPerMM;
}
function boardPointForTarget(num, segType){
  if(num==='B'){
    if(segType==='bull') return {x:BOARD_CX, y:BOARD_CY};
    const r = (R_BULL_INNER+R_BULL_OUTER)/2;
    return {x:BOARD_CX, y:BOARD_CY - r};
  }
  const idx = BOARD_ORDER.indexOf(num);
  const angle = idx*18 + WEDGE_ROTATION;
  let r;
  if(segType==='triple') r = (R_TRIPLE_IN+R_TRIPLE_OUT)/2;
  else if(segType==='double') r = (R_DOUBLE_IN+R_DOUBLE_OUT)/2;
  else r = (R_TRIPLE_OUT+R_DOUBLE_IN)/2; // single: aim at the wider outer single band
  const [x,y] = polar(BOARD_CX,BOARD_CY,r,angle);
  return {x:parseFloat(x), y:parseFloat(y)};
}
function gaussianRandom(){
  let u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function simulateBotDart(num, segType, rating){
  const target = boardPointForTarget(num, segType);
  const stddev = botStddevPx(rating);
  const actualX = target.x + gaussianRandom()*stddev;
  const actualY = target.y + gaussianRandom()*stddev;
  return {...scoreForPoint(actualX, actualY), x: actualX, y: actualY};
}
function resolveBotDartResult(result){
  if(result.ring==='totalMiss' || result.ring==='over'){ recordMiss(); return; }
  let num, seg;
  if(result.ring==='bullInner'){ num='B'; seg='bull'; }
  else if(result.ring==='bullOuter'){ num='B'; seg='single'; }
  else if(result.ring==='triple'){ num=result.number; seg='triple'; }
  else if(result.ring==='double'){ num=result.number; seg='double'; }
  else { num=result.number; seg='single'; } // 'inner' or 'outer' single band
  dispatchThrow(num, seg);
}
function parseThrowLabel(label){
  if(label==='DB') return {num:'B', seg:'bull'};
  if(label==='SB') return {num:'B', seg:'single'};
  const seg = label[0]==='T' ? 'triple' : label[0]==='D' ? 'double' : 'single';
  return {num: parseInt(label.slice(1),10), seg};
}
function botChooseX01Target(s){
  const p = x01Current(s);
  const dartsLeft = 3 - s.currentTurnDarts.length;
  const route = findCheckout(p.score, dartsLeft, s.outRule);
  if(route && route.length) return parseThrowLabel(route[0]);
  return {num:20, seg:'triple'};
}
// Picks a target for any bot-playable game kind except Call Your Shot (which has its own engine
// below, since its target system is fundamentally different — zones, not num+multiplier).
function botChooseGenericTarget(s){
  if(s.kind==='x01') return botChooseX01Target(s);
  const highlighted = getCurrentGameTargetHighlightRaw(s);
  if(highlighted) return highlighted;
  if(s.kind==='killer'){
    // Already a killer with no single obvious target (getCurrentGameTargetHighlight only
    // suggests a target before becoming a killer) — go hunt a random living rival.
    const me = killerCurrent(s);
    const rivals = s.participants.filter(p=>p!==me && !p.eliminated);
    if(rivals.length){
      const victim = rivals[Math.floor(Math.random()*rivals.length)];
      return {num: victim.number, seg:'single'}; // any multiplier removes a life in this game, so aim for the reliable single band
    }
  }
  return {num:20, seg:'triple'}; // sensible generic fallback (e.g. custom games with no single fixed target)
}
function isBotPlayerId(playerId){
  const p = state.players.find(x=>x.id===playerId);
  return !!(p && p.isBot);
}
function maybeRunBotTurn(){
  const s = state.session;
  if(!s || s.kind==='callshot' || s.complete || s.botTurnScheduled) return;
  const pid = s.participants[s.currentIdx].playerId;
  if(!isBotPlayerId(pid)) return;
  s.botTurnScheduled = true;
  scheduleBotDart(s.currentTurnDarts.length===0);
}
function scheduleBotDart(isFirstDart){
  const delay = isFirstDart ? randomDelayMs(...BOT_TIMING.lineUp) : randomDelayMs(...BOT_TIMING.betweenDarts);
  setTimeout(()=>{
    const s = state.session;
    if(!s || s.kind==='callshot' || s.complete){ if(s) s.botTurnScheduled=false; return; }
    const pid = s.participants[s.currentIdx].playerId;
    if(!isBotPlayerId(pid)){ s.botTurnScheduled = false; render(); return; }
    const beforeIdx = s.currentIdx;
    const beforeDarts = s.currentTurnDarts.length;
    const player = state.players.find(x=>x.id===pid);
    const target = botChooseGenericTarget(s);
    const result = simulateBotDart(target.num, target.seg, player ? player.botRating : 5);
    state.pendingHitPoint = {x: result.x, y: result.y};
    resolveBotDartResult(result);
    const s2 = state.session;
    if(!s2 || s2.complete){ if(s2) s2.botTurnScheduled=false; return; }
    if(s2.currentIdx===beforeIdx && s2.currentTurnDarts.length>beforeDarts && s2.currentTurnDarts.length<3){
      scheduleBotDart(false);
    } else {
      setTimeout(()=>{
        s2.botTurnScheduled = false;
        maybeRunBotTurn();
      }, randomDelayMs(...BOT_TIMING.handoff));
    }
  }, delay);
}

/* ========================= BOT OPPONENT ENGINE (CALL YOUR SHOT) =========================
   Different target system than X01 (zone ids like "20-triple" or "bull-inner" instead of
   num+multiplier), so this gets its own aim/landing logic, but reuses the same underlying
   throw-simulation physics (botStddevPx, gaussianRandom) and feeds results through the exact
   same callShotSelectTarget()/callShotRegisterDart() functions a human's board taps use. */
function callShotZoneIdForPoint(px, py){
  const {radius, angleDeg} = boardPointToPolar(px, py);
  const ring = ringForRadius(radius);
  if(ring==='bullInner') return 'bull-inner';
  if(ring==='bullOuter') return 'bull-outer';
  if(ring==='over' || ring==='totalMiss') return null;
  const number = numberForAngle(angleDeg);
  return number+'-'+ring; // ring here is 'inner'|'triple'|'outer'|'double'
}
function callShotAimPointForZone(zoneId){
  if(zoneId.endsWith('-single')){
    const num = zoneId.slice(0, zoneId.lastIndexOf('-'));
    const z = sectionZoneById(num+'-outer') || sectionZoneById(num+'-inner');
    return {x:z.x, y:z.y};
  }
  const z = sectionZoneById(zoneId);
  return {x:z.x, y:z.y};
}
function simulateCallShotDart(targetZoneId, rating){
  const point = callShotAimPointForZone(targetZoneId);
  const stddev = botStddevPx(rating);
  const actualX = point.x + gaussianRandom()*stddev;
  const actualY = point.y + gaussianRandom()*stddev;
  return {zoneId: callShotZoneIdForPoint(actualX, actualY), x: actualX, y: actualY};
}
function botPickCallShotCallTargets(s, rating){
  let pool;
  if(rating<=3) pool = SECTION_TARGET_ZONES.filter(z=> z.band==='inner'||z.band==='outer'||z.band==='bull-outer');
  else if(rating<=7) pool = SECTION_TARGET_ZONES.filter(z=> z.band!=='triple' && z.band!=='bull-inner');
  else pool = SECTION_TARGET_ZONES;
  if(!pool.length) pool = SECTION_TARGET_ZONES;
  const chosen = [];
  let guard = 0;
  while(chosen.length < s.numTargets && guard < 50){
    guard++;
    const z = pool[Math.floor(Math.random()*pool.length)];
    const canonical = callShotCanonicalZone(z.id);
    if(!chosen.includes(canonical) && !s.calledTargets.includes(canonical)) chosen.push(canonical);
  }
  return chosen;
}
function maybeRunCallShotBotTurn(){
  const s = state.session;
  if(!s || s.kind!=='callshot' || s.complete || s.botTurnScheduled) return;
  const pid = s.participants[s.currentIdx].playerId;
  if(!isBotPlayerId(pid)) return;
  s.botTurnScheduled = true;
  const isFirstAction = s.stage==='callselect' ? s.calledTargets.length===0 : s.dartsUsedThisAttempt===0;
  scheduleCallShotBotAction(isFirstAction);
}
function scheduleCallShotBotAction(isFirstAction){
  const delay = isFirstAction ? randomDelayMs(...BOT_TIMING.lineUp) : randomDelayMs(...BOT_TIMING.betweenDarts);
  setTimeout(()=>{
    const s = state.session;
    if(!s || s.kind!=='callshot' || s.complete){ if(s) s.botTurnScheduled=false; return; }
    const pid = s.participants[s.currentIdx].playerId;
    if(!isBotPlayerId(pid)){ s.botTurnScheduled=false; render(); return; }
    const player = state.players.find(x=>x.id===pid);
    const rating = player ? player.botRating : 5;

    if(s.stage==='callselect'){
      const targets = botPickCallShotCallTargets(s, rating);
      let i = 0;
      const callNext = ()=>{
        const s2 = state.session;
        if(!s2 || s2.kind!=='callshot' || s2.complete || s2.stage!=='callselect'){
          if(s2) s2.botTurnScheduled=false;
          render();
          setTimeout(maybeRunCallShotBotTurn, randomDelayMs(...BOT_TIMING.handoff));
          return;
        }
        if(i>=targets.length){ s2.botTurnScheduled=false; render(); maybeRunCallShotBotTurn(); return; }
        callShotSelectTarget(targets[i]);
        i++;
        setTimeout(callNext, randomDelayMs(...BOT_TIMING.betweenDarts));
      };
      callNext();
      return;
    }

    const beforeIdx = s.currentIdx, beforeStage = s.stage, beforeRound = s.round;
    let targetId;
    if(s.mode==='natural' && s.calledTargets.length===0){
      targetId = '20-triple'; // nothing called yet — bot just throws at its go-to spot to establish the shot
    } else {
      targetId = s.orderMatters ? s.calledTargets[s.targetIndex] : s.calledTargets.find((tid,i)=>!s.hitTargets.includes(i));
    }
    const throwResult = simulateCallShotDart(targetId, rating);
    state.pendingHitPoint = {x: throwResult.x, y: throwResult.y};
    callShotRegisterDart(throwResult.zoneId);

    const s2 = state.session;
    if(!s2 || s2.complete){ if(s2) s2.botTurnScheduled=false; return; }
    const stillSameActor = (s2.currentIdx===beforeIdx && s2.stage===beforeStage && s2.round===beforeRound);
    if(stillSameActor){
      scheduleCallShotBotAction(false);
    } else {
      setTimeout(()=>{
        s2.botTurnScheduled = false;
        maybeRunCallShotBotTurn();
      }, randomDelayMs(...BOT_TIMING.handoff));
    }
  }, delay);
}

function removeDartFromCurrentTurn(index){
  const s = state.session;
  if(!s || index<0 || index>=s.currentTurnDarts.length) return;
  const toReplay = s.currentTurnDarts.filter((d,i)=>i!==index).map(d=>({num:d._num, segType:d._segType}));
  while(s.currentTurnDarts.length>0){
    if(s.kind==='x01') x01Undo(s);
    else if(s.kind==='cricket') cricketUndo(s);
    else if(ENGINE_HOOKS[s.kind]) ENGINE_HOOKS[s.kind].undo(s);
  }
  toReplay.forEach(d=>{
    if(d.segType===undefined) return; // untracked edge case (e.g. an off-number cricket "No Score") — nothing to replay
    if(d.segType==='miss' || d.num===null) recordMiss();
    else dispatchThrow(d.num, d.segType);
  });
  if(s.turnHitPoints) s.turnHitPoints = s.turnHitPoints.slice(0, s.currentTurnDarts.length);
  render();
}
/* ========================= DART FIELD SCHEMA (pulldown taxonomy) ========================= */
function numRange(start,end,step,decimals,suffix){
  const arr=[];
  const steps = Math.round((end-start)/step);
  for(let i=0;i<=steps;i++){
    const v = start + i*step;
    arr.push(v.toFixed(decimals)+suffix);
  }
  return arr;
}
const BRAND_OPTIONS = ['Red Dragon','Target','Winmau','Harrows','Unicorn','Mission','Shot','Bottelsen','Viper','One80','Designa','Cuesoul','L Style','Condor','Other','Unknown'];

function initDartFieldOptions(){

// Fallback catch-alls always stay pinned at the end, in this order, regardless of how the rest sorts.
const DART_OPTION_SENTINELS = ['Other','Unknown'];
function sortDartOptionList(arr){
  const sentinels = [], rest = [];
  arr.forEach(v=>{ (DART_OPTION_SENTINELS.includes(v) ? sentinels : rest).push(v); });
  const numericRe = /^-?\d+(\.\d+)?/;
  const allNumeric = rest.length>0 && rest.every(v=>numericRe.test(String(v).trim()));
  if(allNumeric){
    rest.sort((a,b)=> parseFloat(a) - parseFloat(b));
  } else {
    rest.sort((a,b)=> a.localeCompare(b, undefined, {sensitivity:'base', numeric:true}));
  }
  sentinels.sort((a,b)=> DART_OPTION_SENTINELS.indexOf(a) - DART_OPTION_SENTINELS.indexOf(b));
  return [...rest, ...sentinels];
}

function handleDartPhotoUpload(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      state.dartBuilder.photo = canvas.toDataURL('image/jpeg', 0.82);
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function confidenceForThrows(n){
  if(n<15) return 'Not rated';
  if(n<60) return 'Early estimate';
  if(n<200) return 'Developing';

}
function computeGamePerformanceScore(gameType, s, playerId, extra){
  if(!s) return null;
  try{
    if(gameType==='section'){
      return extra && extra.sectionSummary ? extra.sectionSummary.avgScore : null;
    }
    if(gameType==='precisionNew'){
      if(!extra || !extra.precisionSummary) return null;
      const mm = extra.precisionSummary.avgDistanceMm;
      // 0mm -> 100, 100mm+ (a full board-radius miss) -> 0, roughly linear between
      return Math.max(0, Math.min(100, Math.round(100 - mm)));
    }
    if(gameType==='practice'){
      // s here is either a practice session (has totalDarts/successfulHits) or checkout practice (attemptsTotal/successes)
      if(s.attemptsTotal!==undefined){
        return s.attemptsTotal ? Math.round((s.successes/s.attemptsTotal)*100) : null;
      }
      return s.totalDarts ? Math.round((s.successfulHits/s.totalDarts)*100) : null;
    }
    const p = s.participants.find(x=>x.playerId===playerId);
    if(!p) return null;
    if(gameType==='301'||gameType==='501'){
      const darts = p.stats ? p.stats.darts : 0;
      if(!darts) return null;
      const scored = s.startScore - p.score;
      const perDart = scored/darts;
      return Math.max(0, Math.min(100, Math.round((perDart/60)*100)));
    }
    if(gameType==='cricket'){
      const darts = participantThrowCounts(s)[playerId] || 0;
      if(!darts) return null;
      const totalMarks = Object.values(p.marks).reduce((a,v)=>a+Math.min(v,3),0);
      return Math.max(0, Math.min(100, Math.round((totalMarks/(darts*3))*100)));
    }
    if(gameType==='atc'){
      return Math.round((p.idx/s.sequence.length)*100);
    }
    if(gameType==='killer'){
      return Math.round((p.lives/(s.startingLives||5))*100);
    }
    if(gameType==='custom' || gameType==='highscore' || gameType==='countup'){
      const darts = participantThrowCounts(s)[playerId] || 0;
      if(!darts) return null;
      const hits = Object.values(p.hits||{}).reduce((a,v)=>a+v,0);
      return Math.max(0, Math.min(100, Math.round((hits/darts)*100)));
    }
    // fallback for shanghai/baseball/halveit and anything else: relative to top scorer
    const scores = s.participants.map(x=>x.score||0);
    const top = Math.max(...scores, 1);
    return Math.round(((p.score||0)/top)*100);
  } catch(e){ return null; }
}
function updateDartPerformance(playerId, dartSetupId, gameType, gameScore, throwCount){
  if(gameScore===null || gameScore===undefined) return;
  const key = playerId+'|'+dartSetupId;
  let rec = state.playerDartPerformance[key];
  if(!rec){
    rec = {playerId, dartSetupId, totalThrows:0, savedGames:0, overallRating:0, confidenceLevel:'Not rated', ratingsByGame:{}, lastUsedAt:null};
    state.playerDartPerformance[key] = rec;
  }
  rec.savedGames++;
  rec.totalThrows += (throwCount||0);
  rec.lastUsedAt = Date.now();
  const gr = rec.ratingsByGame[gameType] || {rating:gameScore, count:0};
  gr.count++;
  gr.rating = Math.round(((gr.rating*(gr.count-1)) + gameScore)/gr.count);
  rec.ratingsByGame[gameType] = gr;
  const gameRatings = Object.values(rec.ratingsByGame).map(g=>g.rating);
  rec.overallRating = Math.round(gameRatings.reduce((a,b)=>a+b,0)/gameRatings.length);
  rec.confidenceLevel = confidenceForThrows(rec.totalThrows);
  updateAttributePerformance(playerId, dartSetupId, gameScore, throwCount);
}
function updateAttributePerformance(playerId, dartSetupId, gameScore, throwCount){
  const setup = state.dartSetups.find(d=>d.id===dartSetupId);
  if(!setup) return;
  if(!state.playerAttributePerformance[playerId]) state.playerAttributePerformance[playerId] = {};
  const store = state.playerAttributePerformance[playerId];
  allDartSelectFields().forEach(f=>{
    const val = setup[f.key];
    if(!val || val==='Unknown') return;
    if(!store[f.key]) store[f.key] = {};
    const bucket = store[f.key][val] || {rating:gameScore, count:0, totalThrows:0};
    bucket.count++;
    bucket.totalThrows += (throwCount||0);
    bucket.rating = Math.round(((bucket.rating*(bucket.count-1)) + gameScore)/bucket.count);
    store[f.key][val] = bucket;
  });
}

function participantThrowCounts(s){
  const counts = {};
  s.participants.forEach((p,idx)=>{
    let n = 0;
    (s.turnHistory||[]).forEach(t=>{
      const ti = t.participantIdx!==undefined ? t.participantIdx : t.currentIdx;
      if(ti===idx) n += t.darts.length;
    });
    if(idx===s.currentIdx) n += s.currentTurnDarts.length;
    counts[p.playerId] = n;
  });
  return counts;
}

  if(s.kind==='x01') x01Undo(s);
  else if(s.kind==='cricket') cricketUndo(s);
  else if(ENGINE_HOOKS[s.kind]) ENGINE_HOOKS[s.kind].undo(s);
  if(s.turnHitPoints) s.turnHitPoints = s.turnHitPoints.slice(0, s.currentTurnDarts.length);
  state.screen = 'active';
  render();
}
function doClearTurn(){
  const s = state.session;
  if(!s) return;
  if(s.kind==='x01'){
    x01Current(s).score = s.scoreBeforeTurn;
    s.currentTurnDarts = [];
  } else if(s.kind==='cricket'){
    while(s.currentTurnDarts.length>0){ cricketUndo(s); }
  } else if(ENGINE_HOOKS[s.kind]){
    while(s.currentTurnDarts.length>0){ ENGINE_HOOKS[s.kind].undo(s); }
  }
  s.turnHitPoints = [];
  render();
}
function doEndTurnManually(){
  const s = state.session;
  if(!s || s.currentTurnDarts.length===0) return;
  if(s.kind==='x01'){ x01EndTurn(s); if(s.complete) finishX01Game(s); }
  else if(s.kind==='cricket'){ cricketEndTurn(s); if(s.complete) finishCricketGame(s); }
  else if(ENGINE_HOOKS[s.kind]){
    const hooks = ENGINE_HOOKS[s.kind];
    hooks.endTurn(s);
    if(s.complete) hooks.finish(s);
  }
  render();
}

function playerStatsFor(id){

    return top ? top[0] : null;

  const gamesPlayed = gameEntries.length;
  const wins = gameEntries.filter(h=>player && h.winner===player.name).length;
  const winPct = gamesPlayed ? Math.round((wins/gamesPlayed)*100) : 0;
  let streak = 0;

    else break;

  const dartRecords = Object.values(state.playerDartPerformance).filter(r=>r.playerId===id);
  return {
    gamesPlayed, wins, winPct, streak, entries: gameEntries, favoriteGame: favoriteOf(gameEntries),
    games: {played: gamesPlayed, wins, winPct, streak, entries: gameEntries, favorite: favoriteOf(gameEntries)},

function startCallShotSession(playerIds, opts){
  const mode = opts.callShotMode || 'single';
  return {

    participants: playerIds.map(pid=>({playerId:pid, letters:0, eliminated:false})),
    currentIdx:0, callerIdx:0,
    stage: mode==='natural' ? 'callattempt' : 'callselect',
    calledTargets:[], hitTargets:[], targetIndex:0, dartsUsedThisAttempt:0,
    attemptOrder:[], attemptPos:0, round:1,
    currentTurnDarts:[], turnHistory:[], complete:false, winnerId:null,
    history:[],
  };
}
// Outside of Practice, an "inner single" and "outer single" are the same shot — both just Single N.
// This collapses the two distance-based single zones into one canonical id so calling/matching treats them as equal.
function callShotCanonicalZone(zoneId){
  if(!zoneId || zoneId==='totalmiss' || zoneId==='bull-outer' || zoneId==='bull-inner') return zoneId;
  if(zoneId.endsWith('-inner') || zoneId.endsWith('-outer')){
    return zoneId.slice(0, zoneId.lastIndexOf('-'))+'-single';
  }
  return zoneId;
}
function callShotSnapshot(s){
  const clone = JSON.parse(JSON.stringify(s));
  delete clone.history;
  return clone;
}
function callShotPushHistory(s){
  if(!s.history) s.history = [];
  s.history.push(callShotSnapshot(s));
  if(s.history.length>100) s.history.shift();
}
function callShotBoardClickForCall(evt){
  const t = evt.target;
  if(!t.classList || !t.classList.contains('section-zone')) return;
  const zoneId = t.getAttribute('data-zone');
  const zone = sectionZoneById(zoneId);
  if(!zone || !zone.isTarget) return;
  callShotSelectTarget(callShotCanonicalZone(zoneId));
}
function callShotSelectTarget(zoneId){
  const s = state.session;
  if(!s || s.kind!=='callshot') return;
  if(s.calledTargets.includes(zoneId)) return;
  callShotPushHistory(s);
  s.calledTargets.push(zoneId);
  if(s.calledTargets.length >= s.numTargets){
    s.stage = 'callattempt';
    s.dartsUsedThisAttempt = 0;
    s.targetIndex = 0;
    s.hitTargets = [];
  }
  render();
}
function callShotBoardClickForAttempt(evt){
  const t = evt.target;
  const hitZoneId = (t.classList && t.classList.contains('section-zone')) ? t.getAttribute('data-zone') : null;
  const point = svgPointFromEvent(evt);
  state.pendingHitPoint = point || null;
  callShotRegisterDart(hitZoneId);
}
function callShotRegisterDart(hitZoneId){
  const s = state.session;
  if(!s || s.kind!=='callshot') return;
  callShotPushHistory(s);
  if(!s.turnHitPoints || s.currentTurnDarts.length===0) s.turnHitPoints = [];
  const thisPoint = state.pendingHitPoint || null;
  state.pendingHitPoint = null;
  if(thisPoint) s.turnHitPoints.push(thisPoint);
  // Natural Call mode: the caller's single establishing dart defines the target on the spot.
  if(s.mode==='natural' && s.stage==='callattempt' && s.calledTargets.length===0){
    const zone = hitZoneId ? sectionZoneById(hitZoneId) : null;
    if(zone && zone.isTarget){
      s.calledTargets = [callShotCanonicalZone(hitZoneId)];
      callShotResolveAttempt(s, true);
    } else {
      callShotResolveAttempt(s, false);
    }
    return;
  }
  const canonicalHit = callShotCanonicalZone(hitZoneId);
  const sequential = s.orderMatters || s.calledTargets.length<=1;
  const hit = sequential
    ? (canonicalHit === s.calledTargets[s.targetIndex])
    : s.calledTargets.some((tid,i)=> tid===canonicalHit && !s.hitTargets.includes(i));
  s.dartsUsedThisAttempt++;
  s.currentTurnDarts.push({label: hit?'Hit':'Miss'});
  if(hit){
    if(sequential){ s.targetIndex++; }
    else { const idx = s.calledTargets.findIndex((tid,i)=>tid===canonicalHit && !s.hitTargets.includes(i)); s.hitTargets.push(idx); }
    const allDone = sequential ? s.targetIndex>=s.calledTargets.length : s.hitTargets.length>=s.calledTargets.length;
    if(allDone){ callShotResolveAttempt(s, true); return; }
    s.dartsUsedThisAttempt = 0;
    render();
    return;
  }
  if(s.dartsUsedThisAttempt >= s.maxDarts){
    callShotResolveAttempt(s, false);
  } else {
    render();
  }
}
function callShotAttemptThrow(hit){
  const s = state.session;
  if(!s || s.kind!=='callshot') return;
  if(hit){
    if(s.mode==='natural' && s.calledTargets.length===0){ callShotRegisterDart(SECTION_TARGET_ZONES[0].id); return; }
    const sequential = s.orderMatters || s.calledTargets.length<=1;
    const expected = sequential ? s.calledTargets[s.targetIndex] : s.calledTargets.find((tid,i)=>!s.hitTargets.includes(i));
    callShotRegisterDart(expected);
  } else {
    callShotRegisterDart(null);
  }
}
function callShotResolveAttempt(s, success){
  s.currentTurnDarts = [];
  if(s.stage==='callattempt'){
    if(success){
      s.attemptOrder = s.participants.map((p,i)=>i).filter(i=>i!==s.callerIdx && !s.participants[i].eliminated);
      s.attemptPos = 0;
      s.dartsUsedThisAttempt = 0;
      s.targetIndex = 0;
      s.hitTargets = [];
      if(s.attemptOrder.length===0){ callShotNextRound(s); render(); return; }
      s.stage = 'follow';
      s.currentIdx = s.attemptOrder[0];
    } else {
      const caller = s.participants[s.callerIdx];
      caller.letters++;
      if(caller.letters >= s.word.length){ caller.eliminated = true; }
      callShotNextRound(s);
    }
  } else if(s.stage==='follow'){
    if(!success){
      const p = s.participants[s.currentIdx];
      p.letters++;
      if(p.letters >= s.word.length){ p.eliminated = true; }
    }
    s.attemptPos++;
    s.dartsUsedThisAttempt = 0;
    s.targetIndex = 0;
    s.hitTargets = [];
    if(s.attemptPos >= s.attemptOrder.length){
      callShotNextRound(s);
    } else {
      s.currentIdx = s.attemptOrder[s.attemptPos];
    }
  }
  callShotCheckWin(s);
  if(s.complete) finishCallShotGame(s);
  render();
}
function callShotNextRound(s){
  const alive = s.participants.filter(p=>!p.eliminated);
  if(alive.length<=1){ callShotCheckWin(s); if(s.complete) finishCallShotGame(s); return; }
  let next = (s.callerIdx+1) % s.participants.length, tries=0;
  while(s.participants[next].eliminated && tries<=s.participants.length){ next=(next+1)%s.participants.length; tries++; }
  s.callerIdx = next;
  s.currentIdx = next;
  s.calledTargets = [];
  s.hitTargets = [];
  s.targetIndex = 0;
  s.stage = s.mode==='natural' ? 'callattempt' : 'callselect';
  s.dartsUsedThisAttempt = 0;
  s.round++;
  callShotCheckWin(s);
  if(s.complete) finishCallShotGame(s);
}
function callShotCheckWin(s){
  const alive = s.participants.filter(p=>!p.eliminated);
  if(alive.length<=1 && s.participants.length>1){
    s.complete = true;
    if(alive.length===1) s.winnerId = alive[0].playerId;
  }
}
function callShotUndo(){
  const s = state.session;
  if(!s || s.kind!=='callshot') return;
  if(!s.history || s.history.length===0) return;
  const history = s.history;
  const prev = history.pop();
  Object.keys(s).forEach(k=>{ if(k!=='history') delete s[k]; });
  Object.assign(s, prev);
  s.history = history;
  render();
}
function finishCallShotGame(s){
  const winner = state.players.find(p=>p.id===s.winnerId);
  buildAndShowReview({

    winnerId: s.winnerId, winnerName: winner?winner.name:'Unknown', detail:'Spelled "'+s.word+'" and you\'re out — last one standing wins.',
    participantIds: s.participants.map(p=>p.playerId),

  });
}

function startPracticeFlow(practId){
  const def0 = PRACTICES.find(p=>p.id===practId) || state.customPractices.find(p=>p.id===practId);
  if(!def0) return;
  if(def0.status==='soon') return;

    state.checkoutPracticePlayerId = playerId;
    state.pendingSelection = null;
    state.screen = 'checkoutPracticeActive';
    render();
    return;
  }
  let def;
  const nums20 = Array.from({length:20},(_,i)=>i+1);
  const shuffled = arr=>{ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const mode = state.practiceRandomMode || 'sequence';
  const applyMode = (baseDef)=>{
    if(mode==='shuffle'){ baseDef.targets = shuffled(baseDef.targets); baseDef.order = 'random'; }
    else if(mode==='perTurn' || mode==='perDart'){ baseDef.randomMode = mode; }
    return baseDef;
  };
  if(practId==='threeofeach'){
    def = applyMode({name:'Three of Each', targets:nums20, order:'numerical', requiredHits:3, multiplierRule:'simple'});
  } else if(practId==='atb-singles'){
    def = applyMode({name:'Around the Board Singles', targets:nums20, order:'numerical', requiredHits:1, multiplierRule:'exact', requiredMultiplier:'single'});
  } else if(practId==='atb-doubles'){
    def = applyMode({name:'Around the Board Doubles', targets:nums20, order:'numerical', requiredHits:1, multiplierRule:'exact', requiredMultiplier:'double'});
  } else if(practId==='atb-triples'){
    def = applyMode({name:'Around the Board Triples', targets:nums20, order:'numerical', requiredHits:1, multiplierRule:'exact', requiredMultiplier:'triple'});
  } else if(practId==='cricket-trainer'){

function setSetting(key, val){ state.settings[key]=val; render(); }

function startResizeDrag(evt, settingsKey, cssVarName, minScale, maxScale){
  evt.preventDefault();
  evt.stopPropagation();
  const root = document.documentElement;
  const startScale = state.settings[settingsKey] || 1;
  const startX = evt.clientX, startY = evt.clientY;
  let liveScale = startScale;
  function onMove(e){
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const delta = (dx + dy) / 2;
    liveScale = Math.max(minScale, Math.min(maxScale, startScale + delta/150));
    root.style.setProperty(cssVarName, liveScale);
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    state.settings[settingsKey] = Math.round(liveScale*100)/100;
    render();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}
function renderResizeHandle(settingsKey, cssVarName, minScale, maxScale){
  return `<div class="resize-handle" onpointerdown="startResizeDrag(event, '${settingsKey}', '${cssVarName}', ${minScale}, ${maxScale})" title="Drag to resize">&#8690;</div>`;
}
function startMoveDrag(evt, settingsKey, elementId){
  evt.preventDefault();
  evt.stopPropagation();
  const el = document.getElementById(elementId);
  const device = el ? el.closest('.device') : null;
  if(!el || !device) return;
  const deviceRect = device.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const offsetX = evt.clientX - elRect.left, offsetY = evt.clientY - elRect.top;
  el.style.position = 'absolute';
  el.style.margin = '0';
  let liveLeft = elRect.left - deviceRect.left, liveTop = elRect.top - deviceRect.top;
  function onMove(e){
    liveLeft = e.clientX - deviceRect.left - offsetX;
    liveTop = e.clientY - deviceRect.top - offsetY;
    liveLeft = Math.max(0, Math.min(liveLeft, deviceRect.width - elRect.width));
    liveTop = Math.max(0, Math.min(liveTop, deviceRect.height - elRect.height));
    el.style.left = liveLeft+'px';
    el.style.top = liveTop+'px';
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    state.settings[settingsKey] = {left:Math.round(liveLeft), top:Math.round(liveTop)};
    render();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}
function renderMoveHandle(settingsKey, elementId){
  return `<div class="move-handle" onpointerdown="startMoveDrag(event, '${settingsKey}', '${elementId}')" title="Drag to move">&#10021;</div>`;
}
function floatingStyle(pos){
  return pos ? `position:absolute; left:${pos.left}px; top:${pos.top}px; margin:0;` : '';
}
function startPanelResizeDrag(evt){
  evt.preventDefault();
  evt.stopPropagation();
  const handle = evt.target;
  handle.classList.add('dragging');
  const root = document.documentElement;
  const startWidth = state.settings.panelWidth || 230;
  const startX = evt.clientX;
  let liveWidth = startWidth;
  function onMove(e){
    const dx = startX - e.clientX;
    liveWidth = Math.max(180, Math.min(420, startWidth + dx));
    root.style.setProperty('--panel-width', liveWidth+'px');
    root.style.setProperty('--panel-scale', (liveWidth/230));
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    handle.classList.remove('dragging');
    state.settings.panelWidth = Math.round(liveWidth);
    render();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function isHistoryEntryVisible(h){
  if(!h.participantIds) return true; // legacy entries without tracking, always show
  const anyGuestInvolved = h.participantIds.some(pid=>{
    const p = state.players.find(x=>x.id===pid);
    return p ? p.isGuest : false;
  });
  if(!anyGuestInvolved) return true;
  const ageHours = (Date.now() - (h.createdAt||0)) / 3600000;
  return ageHours < state.playerSettings.guestRetentionHours;
}
function renderStatsHub(){
  const visible = state.history.filter(isHistoryEntryVisible);
  const gameEntries = visible.filter(h=>!isPracticeHistoryType(h.type));
  const practiceEntries = visible.filter(h=>isPracticeHistoryType(h.type));
  const wins = {};
  gameEntries.forEach(h=>{ wins[h.winner]=(wins[h.winner]||0)+1; });
  const topPlayer = Object.entries(wins).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="section-label">Overview</div>

  function chip(label, key, val){
    return `<span class="chip ${o[key]===val?'selected':''}" onclick="setOption('${key}','${val}')">${label}</span>`;
  }
  function numChip(label, key, val){
    return `<span class="chip ${o[key]===val?'selected':''}" onclick="setOption('${key}',${val})">${label}</span>`;
  }
  function boolChip(label, key, val){
    return `<span class="chip ${o[key]===val?'selected':''}" onclick="setOption('${key}',${val})">${label}</span>`;
  }
  const title = isX01 ? o.startScore+' Options' : g.name+' Options';
  let body = '';
  if(isX01){
    body = `
    <div>
      <span class="field-label">Entering In</span>
      <div class="chip-wrap">${chip('Straight In','inRule','straight')}${chip('Double In','inRule','double')}</div>
      <div class="option-legend">
        <div class="leg-item ${o.inRule==='straight'?'active-leg':''}"><b>Straight In</b> — every dart counts from your very first throw.</div>
        <div class="leg-item ${o.inRule==='double'?'active-leg':''}"><b>Double In</b> — nothing scores until you hit a double. Once you do, every dart after that counts normally.</div>
      </div>
    </div>
    <div>
      <span class="field-label">Finishing Out</span>
      <div class="chip-wrap">${chip('Straight Out','outRule','straight')}${chip('Double Out','outRule','double')}${chip('Master Out','outRule','master')}</div>
      <div class="option-legend">
        <div class="leg-item ${o.outRule==='straight'?'active-leg':''}"><b>Straight Out</b> — hit exactly zero with any dart and you're done.</div>
        <div class="leg-item ${o.outRule==='double'?'active-leg':''}"><b>Double Out</b> — the traditional way to finish. Your last dart must land in a double (or the bull, which counts as one). Reaching zero any other way is a bust.</div>
        <div class="leg-item ${o.outRule==='master'?'active-leg':''}"><b>Master Out</b> — a middle ground. Your last dart must land in a double or a triple.</div>
      </div>
    </div>
    <div>
      <span class="field-label">${o.startScore} Guidance</span>
      <div class="chip-wrap">${chip('None','guidance','none')}${chip('Basic','guidance','basic')}${chip('Beginner','guidance','beginner')}${chip('Standard Checkout','guidance','standard')}</div>
      <div class="option-legend">
        <div class="leg-item ${o.guidance==='none'?'active-leg':''}"><b>None</b> — just the remaining score, no suggestions.</div>
        <div class="leg-item ${o.guidance==='basic'?'active-leg':''}"><b>Basic</b> — remaining score plus a simple "aim here" target.</div>
        <div class="leg-item ${o.guidance==='beginner'?'active-leg':''}"><b>Beginner</b> — favors easy routes and common doubles (40, 32, 24, 16, 8) instead of assuming you'll hit hard triples.</div>
        <div class="leg-item ${o.guidance==='standard'?'active-leg':''}"><b>Standard Checkout</b> — the conventional finishing route, looked up live from a full checkout table as your score changes.</div>
      </div>
      <p style="margin-top:8px;"><a class="linklike" onclick="openCheckoutTable('gameOptions', state.gameOptions.outRule)">Preview the checkout table &#9656;</a></p>
    </div>`;
  } else if(id==='cricket'){
    body = `
    <div>
      <span class="field-label">Cricket Variant</span>
      <div class="chip-wrap">${chip('Standard','variant','standard')}${chip('No Score','variant','noscore')}${chip('Cut Throat','variant','cutthroat')}</div>
      <div class="option-legend">
        <div class="leg-item ${o.variant==='standard'?'active-leg':''}"><b>Standard</b> — once you've closed a number, extra hits on it score points, as long as at least one opponent still has it open.</div>
        <div class="leg-item ${o.variant==='noscore'?'active-leg':''}"><b>No Score</b> — points never come into it. Purely a race to close every number first.</div>
        <div class="leg-item ${o.variant==='cutthroat'?'active-leg':''}"><b>Cut Throat</b> — extra hits work against your opponents instead of for you. Points get added to every rival who still has that number open, so closing early protects you.</div>
      </div>
    </div>`;
  } else if(id==='atc'){
    body = `
    <div>
      <span class="field-label">Include Bull Finish</span>
      <div class="chip-wrap">${boolChip('No — Stop at 20','includeBull',false)}${boolChip('Yes — Finish on Bull','includeBull',true)}</div>
    </div>
    <div>
      <span class="field-label">Advance Rule</span>
      <div class="chip-wrap">${chip('Standard','advanceMode','standard')}${chip('Doubles Only','advanceMode','doublesOnly')}${chip('Triples Only','advanceMode','triplesOnly')}</div>
      <div class="option-legend">
        <div class="leg-item ${o.advanceMode==='standard'?'active-leg':''}"><b>Standard</b> — a single advances you one number, a double advances two, a triple advances three.</div>
        <div class="leg-item ${o.advanceMode==='doublesOnly'?'active-leg':''}"><b>Doubles Only</b> — you must hit the double of your current target to advance.</div>
        <div class="leg-item ${o.advanceMode==='triplesOnly'?'active-leg':''}"><b>Triples Only</b> — you must hit the triple of your current target to advance.</div>
      </div>
    </div>`;
  } else if(id==='shanghai'){
    body = `
    <div>
      <span class="field-label">Number of Rounds</span>
      <div class="chip-wrap">${[5,10,15,20].map(v=>numChip(v,'rounds',v)).join('')}</div>
      <p class="info-note">Each round targets the number matching the round (round 1 = number 1, and so on). Hit a single, double, and triple of that round's number in one turn for an instant Shanghai win.</p>
    </div>`;
  } else if(id==='baseball'){
    body = `<p class="info-note">Nine innings, each tied to a number 1 through 9. Singles score 1 run, doubles 2, triples 3 — only on that inning's number. Most runs after nine innings wins.</p>`;
  } else if(id==='highscore' || id==='countup'){
    body = `
    <div>
      <span class="field-label">Number of Rounds</span>
      <div class="chip-wrap">${[5,8,10,15].map(v=>numChip(v,'rounds',v)).join('')}</div>
      <p class="info-note">${id==='highscore' ? 'Every dart scores normally. Highest total after the rounds wins.' : 'Track your scoring and three-dart average over a fixed number of turns.'}</p>
    </div>`;
  } else if(id==='halveit'){
    const nums20 = Array.from({length:20},(_,i)=>i+1);
    const selectedTargets = o.halveitTargets || [];
    body = `
    <div>
      <span class="field-label">Sequence</span>
      <div class="chip-wrap">
        ${chip('Classic (20&ndash;15 + Bull)','halveitPreset','classic')}
        ${chip('Full Board (20&ndash;1 + Bull)','halveitPreset','full')}
        ${chip('Custom','halveitPreset','custom')}
      </div>
    </div>
    ${o.halveitPreset==='custom' ? `<div>
      <span class="field-label">Targets (tap to select)</span>
      <div class="numgrid" style="grid-template-columns:repeat(5,1fr);">
        ${nums20.map(n=>`<div class="num-btn ${selectedTargets.includes(n)?'recommended':''}" onclick="toggleHalveitTarget(${n})">${n}</div>`).join('')}
        <div class="num-btn wide" style="grid-column:span 5; ${selectedTargets.includes('B')?'border-color:var(--brass); color:var(--brass);':''}" onclick="toggleHalveitTarget('B')">Bull</div>
      </div>
      <p class="info-note">${selectedTargets.length} target${selectedTargets.length!==1?'s':''} selected. They'll be played from 20 down to 1, with Bull last, unless you turn on random order below.</p>
    </div>` : ''}
    <div>
      <span class="field-label">Order</span>
      <div class="chip-wrap">${chip('In Order','halveitOrder','sequence')}${chip('Random Order','halveitOrder','random')}</div>
      <p class="info-note">${o.halveitOrder==='random' ? 'The target order is shuffled once at the start of the game.' : 'Targets go from 20 down to 1, with Bull last.'}</p>
    </div>
    <div>
      <span class="field-label">Score Booster</span>
      <div class="chip-wrap">${chip('Off','halveitBooster','off')}${chip('After Close','halveitBooster','sequential')}${chip('Any Order','halveitBooster','anyorder')}</div>
      <div class="option-legend">
        <div class="leg-item ${(!o.halveitBooster||o.halveitBooster==='off')?'active-leg':''}"><b>Off</b> — only darts that hit the round's exact target score. Everything else is a dead throw, even if it lands somewhere else on the board.</div>
        <div class="leg-item ${o.halveitBooster==='sequential'?'active-leg':''}"><b>After Close</b> — once you hit the target, any darts you throw <i>after</i> that also score at face value. Example: target is 18, you throw 20, 18, 4 in that order — the 20 came before you closed it and doesn't count, so you'd score 18+4 = 22.</div>
        <div class="leg-item ${o.halveitBooster==='anyorder'?'active-leg':''}"><b>Any Order</b> — as long as you hit the target at some point in the turn, every dart that turn scores at face value, regardless of order. Same example (20, 18, 4) scores 20+18+4 = 42.</div>
      </div>
      <p class="info-note">This keeps the game from going flat once you're down to small targets like 3, 2, 1 — a good turn can still add real points instead of the extra darts going to waste.</p>
    </div>
    <p class="info-note">Hit the round's target at least once to keep your points — miss it entirely across all 3 darts and your running score is cut in half.</p>`;
  } else if(id==='killer'){
    body = `
    <div>
      <span class="field-label">Starting Lives</span>
      <div class="chip-wrap">${[3,5,6].map(v=>numChip(v,'startingLives',v)).join('')}</div>
      <p class="info-note">Each player is randomly assigned a number. Hit your own double to become a killer, then hit opponents' numbers to remove their lives. Hitting your own number after becoming a killer costs you a life. Last player standing wins.</p>
    </div>`;
  } else if(id==='callshot'){
    body = `
    <div>
      <span class="field-label">Challenge Style</span>
      <div class="chip-wrap">${chip('Single Call','callShotMode','single')}${chip('Multi Call','callShotMode','multi')}${chip('Follow the Leader','callShotMode','natural')}</div>
      <div class="option-legend">
        <div class="leg-item ${o.callShotMode==='single'?'active-leg':''}"><b>Single Call</b> — the caller picks one exact spot on the board before throwing, then has their tries to hit it.</div>
        <div class="leg-item ${o.callShotMode==='multi'?'active-leg':''}"><b>Multi Call</b> — the caller picks 2 or 3 spots before throwing and must hit all of them this turn. Tougher, for stronger players.</div>
        <div class="leg-item ${o.callShotMode==='natural'?'active-leg':''}"><b>Follow the Leader</b> — no calling ahead of time. The caller just throws, and wherever it lands becomes the shot everyone else has to match. The easiest, most beginner-friendly version.</div>
      </div>
    </div>
    ${o.callShotMode==='multi' ? `
    <div>
      <span class="field-label">Targets Per Turn</span>
      <div class="chip-wrap">${numChip('2 Targets','callShotNumTargets',2)}${numChip('3 Targets','callShotNumTargets',3)}</div>
    </div>
    <div>
      <span class="field-label">Order</span>
      <div class="chip-wrap">${boolChip('Order Required','callShotOrderMatters',true)}${boolChip('Any Order','callShotOrderMatters',false)}</div>
      <p class="info-note">${o.callShotOrderMatters ? 'Targets must be hit in the exact order they were called.' : 'Targets can be hit in any order, as long as all of them are hit by the end of the turn.'}</p>
    </div>
    ` : ''}
    <div>
      <span class="field-label">${o.callShotMode==='natural' ? 'Tries to Match' : 'Tries Per Target'}</span>
      <div class="chip-wrap">${[1,2,3].map(v=>numChip(v+' dart'+(v!==1?'s':''),'callShotMaxDarts',v)).join('')}</div>
      <p class="info-note">${o.callShotMode==='natural' ? "Everyone else gets this many darts to match wherever the caller's dart landed." : "Everyone gets this many darts per target to hit whatever's been called — the caller included. Whether it's one target or several, missing means one letter, not one per target."}</p>
    </div>
    <div>
      <span class="field-label">Word to Spell</span>
      <input class="input" id="callShotWordInput" placeholder="HORSE" value="${o.callShotWord||''}" oninput="state.gameOptions.callShotWord=this.value.toUpperCase()">
      <p class="info-note">Spell this whole word in missed letters and you're eliminated. Leave it blank for the classic HORSE.</p>
    </div>
    <p class="info-note">One player calls a target (or, in Follow the Leader, just throws) and gets their tries to hit it. Miss it completely, and the caller takes a letter, just like anyone else would. Hit it, and everyone else takes a turn trying to match it; anyone who fails picks up a letter (only one letter per turn, even in Multi Call with several targets to hit). Then the call passes to the next player and it starts again — last one standing wins.</p>`;
  }
  return `<div class="topbar">
    <div class="iconbtn" onclick="state.screen='playerSetup'; render();">&#8592;</div>
    <h1 style="color:var(--brass); font-size:19px;">${title}</h1>
    <div style="width:38px;"></div>
  </div>
  <div class="content">
    ${body}
    <button class="btn btn-primary btn-full" onclick="launchGame()">Start Game</button>
  </div>`;
}

/* ========================= RENDER: ACTIVE GAME ========================= */
function playerName(id){ const p = state.players.find(x=>x.id===id); return p? (p.emoji?p.emoji+' ':'')+p.name : '???'; }
function participantDisplayDarts(s, idx){
  if(idx === s.currentIdx) return s.currentTurnDarts.map(d=>d.label);
  return s.participants[idx].lastTurnDarts || [];
}
function miniDartChips(labels, centered, editable){
  const cells = [0,1,2].map(i=> labels[i]
    ? `<span class="mini-dart-chip${editable?' editable':''}" ${editable?`onclick="removeDartFromCurrentTurn(${i})" title="Tap to clear this dart"`:''}>${labels[i]}</span>`
    : `<span class="mini-dart-chip empty">&middot;</span>`);
  return `<div class="mini-dart-row${centered?' centered':''}">${cells.join('')}</div>`;
}
const CURRENT_FNS = {
  x01:x01Current, cricket:cricketCurrent, custom:customCurrent,
  atc:atcCurrent, shanghai:shanghaiCurrent, baseball:baseballCurrent, halveit:halveItCurrent, killer:killerCurrent,
};
function currentParticipant(s){
  return CURRENT_FNS[s.kind](s);
}
function playerBoxData(s, p){
  if(s.kind==='x01') return {stat: p.score, dim:false};
  if(s.kind==='cricket') return {stat: p.points, dim:false};
  if(s.kind==='custom'){
    const cfg = s.cfg;
    if(cfg.winCondition==='fewestDarts'){
      return {stat: p.darts||0, dim:false, line2: p.finished ? 'Finished!' : 'darts so far'};
    }
    const scoreVal = cfg.mode==='teams' ? customTeamScore(s,p.team) : p.score;
    return {stat: scoreVal, dim: !!p.eliminated};
  }
  if(s.kind==='atc') return {stat: s.sequence[p.idx]===undefined ? '\u{1F3C6}' : (s.sequence[p.idx]==='B'?'Bull':s.sequence[p.idx]), dim:false};
  if(s.kind==='shanghai'){
    const target = s.round==='B' ? 'Bull' : s.round;
    return {stat: p.score, dim:false, line2: 'Target is '+target};
  }
  if(s.kind==='halveit'){
    const t = s.sequence[s.round-1];
    const target = t==='B' ? 'Bull' : t;
    return {stat: p.score, dim:false, line2: 'Target is '+target};
  }
  if(s.kind==='killer'){
    const line2 = p.isKiller ? 'Killer &middot; hunting' : 'Kill# is '+p.number;
    return {stat: p.eliminated ? '\u{1F480}' : p.lives, dim: !!p.eliminated, line2};
  }
  return {stat:'', dim:false};
}
function renderPlayerBoxes(s){
  return `<div class="panel-zone-players">
    <div class="pi-label" style="margin-bottom:6px; color:var(--cream-dim); font-size:10px; letter-spacing:0.04em;">PLAYERS</div>
    <div class="panel-players-grid">${s.participants.map((p,i)=>{
      const d = playerBoxData(s,p);
      const isCurrent = i===s.currentIdx;
      return `<div class="panel-player-card ${isCurrent?'active':''}" style="${d.dim?'opacity:0.5;':''}">
        <div class="pp-name">${isCurrent?'&#9679; ':''}${playerName(p.playerId).toUpperCase()}</div>
        <div class="pp-stat">${d.stat}</div>
      </div>`;
    }).join('')}</div>
  </div>`;
}
function renderInstructionBox(s){
  const hint = renderTurnHint(s);
  return `<div class="panel-zone-instruction">
    <div class="panel-instruction-box">
      <div class="pi-label">&#9679; NOW</div>
      <div class="pi-text">${hint}</div>
    </div>
  </div>`;
}
function renderRoundInfo(s){
  let total = null;
  if(s.kind==='shanghai') total = s.rounds;
  else if(s.kind==='baseball') total = s.innings;
  else if(s.kind==='halveit') total = s.sequence.length;
  else if(s.kind==='custom' && (s.cfg.winCondition==='highScore'||s.cfg.winCondition==='lowScore')) total = s.cfg.rounds||8;
  const label = s.kind==='baseball' ? 'INNING' : 'ROUND';
  return `<div><div class="round-label">${label}</div><div class="round-value">${s.round}${total?' of '+total:''}</div></div>`;
}
function renderTipsSection(s){
  let objective='', top='';
  if(s.kind==='x01'){
    const p = x01Current(s);
    const dartsLeft = 3 - s.currentTurnDarts.length;
    let guideBig='', guideSmall='';
    if(s.guidance!=='none'){
      if(s.guidance==='basic'){
        guideBig = 'Aim at 20';
        guideSmall = p.score+' remaining — keep scoring on the biggest number you can hit.';
      } else if(s.guidance==='beginner'){
        const b = beginnerSuggestion(p.score, s.outRule);
        guideBig = b.big;
        guideSmall = p.score+' remaining — '+b.small;
      } else if(s.guidance==='standard'){
        const route = findCheckout(p.score, dartsLeft, s.outRule);
        if(route){
          guideBig = route.join('  &middot;  ');
          guideSmall = p.score+' remaining — traditional checkout route.';
        } else {
          guideBig = 'Aim at 20';
          guideSmall = p.score+' remaining — no exact finish from here yet. Keep scoring big to set one up.';
        }
      }
    } else {
      guideBig = p.score+' remaining'; guideSmall='';
    }
    objective = `<div class="objective-banner"><div class="big">${guideBig}</div>${guideSmall?`<div class="small">${guideSmall}</div>`:''}
      <div style="margin-top:10px;"><a class="linklike" onclick="openCheckoutTable('active','${s.outRule}')">View full checkout table &#9656;</a></div>
    </div>`;
    if(isBotPlayerId(p.playerId)){
      objective = `<div class="objective-banner"><div class="big">&#129302; ${playerName(p.playerId)} is throwing&hellip;</div><div class="small">${p.score} remaining — sit back, the bot's got this turn.</div></div>`;
    }
  } else if(s.kind==='cricket'){
    const p = cricketCurrent(s);
    const open = CRICKET_NUMS.filter(n=>!cricketNumClosed(p,n));
    const nextTarget = open[0];
    let big, small;
    if(nextTarget!==undefined){
      big = 'Close '+(nextTarget==='B'?'Bull':nextTarget);
      small = open.length+' number'+(open.length!==1?'s':'')+' still open';
    } else {
      const others = s.participants.filter(o=>o!==p);
      const stillNeed = s.variant==='cutthroat'
        ? others.filter(o=>o.points < p.points).map(o=>playerName(o.playerId))
        : others.filter(o=>o.points > p.points).map(o=>playerName(o.playerId));
      big = 'All numbers closed!';
      small = stillNeed.length
        ? (s.variant==='cutthroat' ? 'But you need fewer points than ' : 'But you need more points than ')+stillNeed.join(', ')+' to win — keep scoring.'
        : 'You have the lead — one more scoring dart on an open number should seal it.';
    }
    objective = `<div class="objective-banner"><div class="big">${big}</div><div class="small">${small}</div></div>`;
  } else if(s.kind==='custom'){
    const cfg = s.cfg;
    const p = customCurrent(s);
    let big='', small='';
    if(cfg.winCondition==='allTargets'){
      const remaining = cfg.targets.filter(t=>(p.hits[t]||0) < (cfg.requiredHitsPerTarget||1));
      big = remaining.length ? 'Hit '+(remaining[0]==='B'?'Bull':remaining[0]) : 'All targets hit!';
      small = remaining.length+' target'+(remaining.length!==1?'s':'')+' left to complete.';
    } else if(cfg.winCondition==='reachScore'){
      const cur = cfg.mode==='teams' ? customTeamScore(s,p.team) : p.score;
      big = (cfg.targetScore-cur)+' to go';
      small = 'Reach '+cfg.targetScore+' points to win'+(cfg.mode==='teams'?' for Team '+p.team:'')+'.';
    } else if(cfg.winCondition==='lastStanding'){
      big = p.lives+' '+(p.lives===1?'life':'lives')+' left';
      small = s.participants.filter(x=>!x.eliminated).length+' player(s) still standing.';
    } else if(cfg.winCondition==='highScore'||cfg.winCondition==='lowScore'){
      big = (cfg.mode==='teams'?customTeamScore(s,p.team):p.score)+' points';
      small = 'Round '+s.round+' of '+(cfg.rounds||8)+' — '+(cfg.winCondition==='highScore'?'highest':'lowest')+' score wins.';
    } else {
      big = (cfg.mode==='teams'?customTeamScore(s,p.team):p.score)+' points';
      small = 'Manual ending — host ends the game when ready.';
    }
    objective = `<div class="objective-banner"><div class="big">${big}</div><div class="small">${small}</div></div>`;
  } else if(s.kind==='atc'){
    const p = atcCurrent(s);
    const target = s.sequence[p.idx];

function blackoutZonesForNumber(zoneShape){
  if(zoneShape==='whole') return ['whole'];
  if(zoneShape==='traditional') return ['single','double','triple'];
  return ['innerSingle','triple','outerSingle','double'];
}
function blackoutZonesForBull(zoneShape){
  if(zoneShape==='whole') return ['whole'];
  return ['inner','outer'];
}
function blackoutMarkValue(zoneId, seg){
  if(zoneId==='whole'){
    if(seg==='triple') return 3;
    if(seg==='double') return 2;
    if(seg==='bull') return 2;
    return 1;
  }
  if(zoneId==='double') return 2;
  if(zoneId==='triple') return 3;
  if(zoneId==='inner') return 2;
  return 1;
}
function startBlackoutSession(playerId, def){
  const zones = {};
  def.targets.forEach(t=>{
    const zoneIds = t==='B' ? blackoutZonesForBull(def.zoneShape) : blackoutZonesForNumber(def.zoneShape);
    zones[t] = {};
    zoneIds.forEach(zid=>{ zones[t][zid] = {count:0, done:false}; });
  });
  return {
    kind:'blackout', def, zones, playerId, pools:{},
    totalDarts:0, totalHits:0, startTime:Date.now(), complete:false, completionTime:null,
  };
}
function blackoutResolveZone(s, num, seg, point){
  const shape = s.def.zoneShape;
  if(num==='B'){
    if(shape==='whole') return 'whole';
    return seg==='bull' ? 'inner' : 'outer';
  }
  if(shape==='whole') return 'whole';
  if(shape==='traditional') return seg;
  if(seg==='double') return 'double';
  if(seg==='triple') return 'triple';
  if(seg==='single'){
    if(point){
      const polar = boardPointToPolar(point.x, point.y);
      return polar.radius < R_TRIPLE_IN ? 'innerSingle' : 'outerSingle';
    }
    return 'outerSingle';
  }
  return null;
}
function blackoutAllZonesDone(s, target){
  return Object.values(s.zones[target]).every(z=>z.done);
}
function blackoutApplyDart(s, num, seg, point){
  s.totalDarts++;
  const target = String(num);
  if(!s.zones[target]) return {matched:false};
  const zoneId = blackoutResolveZone(s, num, seg, point);
  if(!zoneId || !s.zones[target][zoneId]) return {matched:false};
  const zone = s.zones[target][zoneId];
  if(zone.done) return {matched:false, alreadyDone:true};
  s.totalHits++;
  let justClosedNumber = false;
  if(s.def.completionRule==='strict'){
    zone.count++;
    if(zone.count>=3){
      zone.done = true;
      if(blackoutAllZonesDone(s, target)) justClosedNumber = true;
    }
  } else {
    const markValue = blackoutMarkValue(zoneId, seg);
    s.pools[target] = (s.pools[target]||0) + markValue;
    if(s.pools[target] >= 3 && !blackoutAllZonesDone(s, target)){
      Object.values(s.zones[target]).forEach(z=>{ z.done = true; });
      justClosedNumber = true;
    }
  }
  const allDone = Object.keys(s.zones).every(t=>blackoutAllZonesDone(s,t));
  if(allDone && !s.complete){
    s.complete = true;
    s.completionTime = Math.round((Date.now()-s.startTime)/1000);
  }
  return {matched:true, zoneId, justClosedNumber};
}

    if(onTarget && String(hitNum)===t) rec.byTarget[t].hits++;
  });
  const key = dayKey(Date.now());
  if(!rec.byDay[key]) rec.byDay[key] = {attempts:0, hits:0};
  rec.byDay[key].attempts++;
  if(onTarget) rec.byDay[key].hits++;
}
function getCurrentGameTargetHighlight(s){
  const result = getCurrentGameTargetHighlightRaw(s);
  if(Array.isArray(result) && result.length > 8) return null;
  return result;
}
function getCurrentGameTargetHighlightRaw(s){
  if(s.kind==='x01'){
    if(s.guidance==='none') return null;
    const p = x01Current(s);
    const dartsLeft = 3 - s.currentTurnDarts.length;
    const route = findCheckout(p.score, dartsLeft, s.outRule);
    if(route && route.length) return parseThrowLabel(route[0]);
    return {num:20, seg:'triple'};
  }
  if(s.kind==='cricket'){
    const p = cricketCurrent(s);
    const open = CRICKET_NUMS.filter(n=>!cricketNumClosed(p,n));
    const next = open[0];
    if(next===undefined) return null;
    return next==='B' ? {num:'B', seg:'any'} : {num:next, seg:'any'};
  }
  if(s.kind==='atc'){
    const p = atcCurrent(s);
    const target = s.sequence[p.idx];
    if(target===undefined) return null;
    return target==='B' ? {num:'B', seg:'any'} : {num:target, seg:'any'};
  }
  if(s.kind==='shanghai'){
    if(!s.round || s.round<1 || s.round>20) return null;
    return {num:s.round, seg:'any'};
  }
  if(s.kind==='baseball'){
    if(!s.round || s.round<1 || s.round>20) return null;
    return {num:s.round, seg:'any'};
  }
  if(s.kind==='halveit'){
    const target = s.sequence[s.round-1];
    if(target===undefined) return null;
    const p = halveItCurrent(s);
    if(s.halveitBooster==='sequential' && p && p.hitThisRound){
      return {num:20, seg:'any', style:'booster'};
    }
    return target==='B' ? {num:'B', seg:'any'} : {num:target, seg:'any'};
  }
  if(s.kind==='killer'){
    const p = killerCurrent(s);
    if(!p.isKiller) return {num:p.number, seg:'double'};
    const rivals = s.participants.filter(o=>o!==p && !o.eliminated);
    if(!rivals.length) return null;
    return rivals.map(o=>({num:o.number, seg:'any'}));
  }
  if(s.kind==='custom'){
    const cfg = s.cfg;
    const segFor = (t)=> cfg.randomMultiplier ? ((s.targetMultipliers && s.targetMultipliers[t]) || 'any') : ((cfg.multiplierReq && cfg.multiplierReq!=='any') ? cfg.multiplierReq : 'any');
    if(cfg.winCondition==='allTargets' || cfg.winCondition==='fewestDarts'){
      const p = customCurrent(s);
      const remaining = cfg.targets.filter(t=>(p.hits[t]||0) < (cfg.requiredHitsPerTarget||1));
      if(!remaining.length) return null;
      return remaining.map(t=>({num:t, seg:segFor(t)}));
    }
    if(!cfg.targets.length) return null;
    return cfg.targets.map(t=>({num:t, seg:segFor(t)}));
  }
  return null;
}
function killerOwnerLabels(s){
  const me = killerCurrent(s);
  return s.participants.map((p,idx)=>{
    const pl = state.players.find(x=>x.id===p.playerId);
    const text = pl ? pl.name : '???';
    const color = p.eliminated ? 'rgba(242,236,220,0.35)' : (p===me ? '#CC9A3D' : KILLER_COLORS[idx % KILLER_COLORS.length]);
    return { num: p.number, text, color };
  });
}

        const styleAttr = color ? `style="border-left:7px solid ${color}; background:color-mix(in srgb, ${color} 22%, var(--felt-light));"` : '';
        return `<div class="num-btn-split ${isMine?'recommended':''} ${ownerEliminated?'closed':''}" ${styleAttr}>

function practiceMissColor(distMM){
  const t = Math.max(0, Math.min(1, distMM/110));
  const stops = t<0.5 ? [[74,158,92],[224,201,58],t/0.5] : [[224,201,58],[201,86,58],(t-0.5)/0.5];
  const [a,b,f] = stops;
  const r = Math.round(a[0]+(b[0]-a[0])*f), g = Math.round(a[1]+(b[1]-a[1])*f), bl = Math.round(a[2]+(b[2]-a[2])*f);
  return `rgb(${r},${g},${bl})`;
}
function renderPracticeHeatmap(ps, compact){
  const points = ps.hitPoints || [];
  if(points.length < 3) return '';
  const size = compact ? 160 : 240;
  const scale = size / BOARD_CANVAS;
  const cx = BOARD_CX*scale, cy = BOARD_CY*scale;
  const rB = R_BEZEL*scale, rDO=R_DOUBLE_OUT*scale, rDI=R_DOUBLE_IN*scale, rTO=R_TRIPLE_OUT*scale, rTI=R_TRIPLE_IN*scale, rBO=R_BULL_OUTER*scale, rBI=R_BULL_INNER*scale;
  let rings = `<circle cx="${cx}" cy="${cy}" r="${rB}" fill="#1c1c1c" stroke="#4a4a4a" stroke-width="1"/>
    <circle cx="${cx}" cy="${cy}" r="${rDO}" fill="none" stroke="#4a4a4a" stroke-width="0.6"/>
    <circle cx="${cx}" cy="${cy}" r="${rDI}" fill="none" stroke="#4a4a4a" stroke-width="0.6"/>
    <circle cx="${cx}" cy="${cy}" r="${rTO}" fill="none" stroke="#4a4a4a" stroke-width="0.6"/>
    <circle cx="${cx}" cy="${cy}" r="${rTI}" fill="none" stroke="#4a4a4a" stroke-width="0.6"/>
    <circle cx="${cx}" cy="${cy}" r="${rBO}" fill="none" stroke="#4a4a4a" stroke-width="0.6"/>
    <circle cx="${cx}" cy="${cy}" r="${rBI}" fill="none" stroke="#4a4a4a" stroke-width="0.6"/>`;
  for(let i=0;i<20;i++){
    const a = -9 + i*18 + WEDGE_ROTATION;
    const p1 = polar(cx,cy,rBO,a), p2 = polar(cx,cy,rB,a);
    rings += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#4a4a4a" stroke-width="0.5"/>`;
  }
  const dotR = compact ? 4 : 5.5;
  const dots = points.map(pt=>{
    const x = pt.x*scale, y = pt.y*scale;
    const color = practiceMissColor(pt.distMM||0);
    return `<circle cx="${x}" cy="${y}" r="${dotR}" fill="${color}" style="filter:drop-shadow(0 0 3px ${color});"/>`;
  }).join('');
  const label = compact ? '' : `<span class="field-label">Where Your Darts Actually Landed</span>`;
  return `<div style="padding:0 18px 8px 18px;">
    ${label}
    <div style="display:flex; justify-content:center;">
      <div id="heatmapWrap" style="position:relative; transform:scale(var(--heatmap-scale, 1)); transform-origin:top center; ${floatingStyle(state.settings.heatmapPos)}">
        <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${rings}${dots}</svg>
        ${renderResizeHandle('heatmapScale','--heatmap-scale',0.6,1.8)}
        ${renderMoveHandle('heatmapPos','heatmapWrap')}
      </div>
    </div>
  </div>`;
}

function practiceBestWorst(ps){
  const entries = Object.entries(ps.dartsPerTarget);
  if(entries.length < 4) return null;
  const sorted = entries.slice().sort((a,b)=>a[1]-b[1]);
  const labelOf = (t)=> t==='B' ? 'Bull' : t;
  const best = sorted.slice(0,3).map(([t,d])=>({label:labelOf(t), darts:d}));
  const worst = sorted.slice(-3).reverse().map(([t,d])=>({label:labelOf(t), darts:d}));
  return {best, worst};
}

/* ========================= RENDER: SECTION TRAINER ========================= */
function annulusPath(cx,cy,rIn,rOut){
  return `M ${cx-rOut},${cy} a ${rOut},${rOut} 0 1,0 ${rOut*2},0 a ${rOut},${rOut} 0 1,0 -${rOut*2},0 Z `+
         `M ${cx-rIn},${cy} a ${rIn},${rIn} 0 1,0 ${rIn*2},0 a ${rIn},${rIn} 0 1,0 -${rIn*2},0 Z`;
}
function renderSectionBoardSVG(targetZoneId, clickHandler, hitPoint, missHandler){
  clickHandler = clickHandler || 'handleSectionBoardClick';
  const cx=BOARD_CX, cy=BOARD_CY, canvas=BOARD_CANVAS;
  // A merged single target (e.g. "20-single") should light up both the inner and outer single bands for that number.
  const singleTargetNum = (targetZoneId && targetZoneId.endsWith('-single')) ? targetZoneId.slice(0, targetZoneId.lastIndexOf('-')) : null;
  let wedges = '';
  let labels = '';
  let highlight = '';
  for(let i=0;i<20;i++){
    const num = BOARD_ORDER[i];
    const aStart = -9+i*18+WEDGE_ROTATION, aEnd = aStart+18;
    const even = i%2===0;
    const singleFill = even? '#E8E1D0' : '#232D28';
    const dtFill = even? '#4A8A66' : '#A84545';
    const overFill = '#2A2A26';
    const bandDefs = [
      {band:'inner', rIn:R_BULL_OUTER, rOut:R_TRIPLE_IN, fill:singleFill},
      {band:'triple', rIn:R_TRIPLE_IN, rOut:R_TRIPLE_OUT, fill:dtFill},
      {band:'outer', rIn:R_TRIPLE_OUT, rOut:R_DOUBLE_IN, fill:singleFill},
      {band:'double', rIn:R_DOUBLE_IN, rOut:R_DOUBLE_OUT, fill:dtFill},
      {band:'over', rIn:R_DOUBLE_OUT, rOut:R_OVER_OUT, fill:overFill},
    ];
    bandDefs.forEach(b=>{
      const zoneId = num+'-'+b.band;
      const d = wedgePath(cx,cy,b.rIn,b.rOut,aStart,aEnd);
      wedges += `<path d="${d}" fill="${b.fill}" stroke="var(--ink)" stroke-width="1" class="section-zone" data-zone="${zoneId}" style="cursor:pointer;"/>`;
      const bandMatchesMergedSingle = singleTargetNum!==null && String(num)===String(singleTargetNum) && (b.band==='inner'||b.band==='outer');
      if(zoneId===targetZoneId || bandMatchesMergedSingle){
        highlight += `<path d="${d}" fill="#FFD23F" fill-opacity="0.6" stroke="#FFD23F" stroke-width="5" style="pointer-events:none;">
          <animate attributeName="fill-opacity" values="0.35;0.75;0.35" dur="1s" repeatCount="indefinite"/>
        </path>`;
      }
    });
    const lp = polar(cx,cy,R_NUMBER_LABEL,(aStart+aEnd)/2);
    labels += `<text x="${lp[0]}" y="${lp[1]}" fill="var(--cream)" font-family="Oswald,sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none;">${num}</text>`;
  }
  wedges += `<circle cx="${cx}" cy="${cy}" r="${R_BULL_OUTER}" fill="#4A8A66" stroke="var(--ink)" stroke-width="1" class="section-zone" data-zone="bull-outer" style="cursor:pointer;"/>`;
  wedges += `<circle cx="${cx}" cy="${cy}" r="${R_BULL_INNER}" fill="#A84545" stroke="var(--ink)" stroke-width="1" class="section-zone" data-zone="bull-inner" style="cursor:pointer;"/>`;
  if(targetZoneId==='bull-outer'){
    highlight = `<path d="${annulusPath(cx,cy,R_BULL_INNER,R_BULL_OUTER)}" fill="#FFD23F" fill-opacity="0.65" fill-rule="evenodd" stroke="#FFD23F" stroke-width="4" style="pointer-events:none;">
      <animate attributeName="fill-opacity" values="0.4;0.8;0.4" dur="1s" repeatCount="indefinite"/>
    </path>`;
  } else if(targetZoneId==='bull-inner'){
    highlight = `<circle cx="${cx}" cy="${cy}" r="${R_BULL_INNER}" fill="#FFD23F" fill-opacity="0.7" stroke="#FFD23F" stroke-width="4" style="pointer-events:none;">
      <animate attributeName="fill-opacity" values="0.45;0.85;0.45" dur="1s" repeatCount="indefinite"/>
    </circle>`;
  }
  const hitPointsArr2 = hitPoint ? (Array.isArray(hitPoint) ? hitPoint : [hitPoint]) : [];
  const hitMarker = hitPointsArr2.map(pt=>`<circle cx="${pt.x}" cy="${pt.y}" r="7" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2" style="pointer-events:none;"/><circle cx="${pt.x}" cy="${pt.y}" r="2.5" fill="#1a1a1a" style="pointer-events:none;"/>`).join('');
  const missOuterEdge2 = (R_OVER_OUT+19) + 22;
  const cropMargin2 = missHandler ? (canvas - missOuterEdge2*2)/2 - 10 : (canvas - (R_OVER_OUT+19)*2)/2 - 16;
  const viewSize2 = canvas - cropMargin2*2;
  const missLabel2 = missHandler ? (()=>{
    const pos = polar(cx, cy, missOuterEdge2-8, 180);
    return `<text x="${pos[0]}" y="${pos[1]}" fill="rgba(200,206,216,0.35)" font-family="Oswald,sans-serif" font-size="11" font-weight="600" letter-spacing="1" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none;">MISS</text>`;
  })() : '';
  const missRing2 = missHandler ? `<circle class="miss-ring-band" cx="${cx}" cy="${cy}" r="${missOuterEdge2}" fill="var(--ink)" onclick="handleMissRingClick(event, ${JSON.stringify(missHandler).replace(/"/g,'&quot;')})"/>` : `<circle cx="${cx}" cy="${cy}" r="${R_OVER_OUT+19}" fill="var(--ink)"/>`;
  return `<svg viewBox="${cropMargin2} ${cropMargin2} ${viewSize2} ${viewSize2}" class="dartboard-svg" onclick="${clickHandler}(event)">
    <rect x="0" y="0" width="${canvas}" height="${canvas}" fill="transparent"/>
    ${missRing2}
    ${wedges}${labels}${highlight}${hitMarker}${missLabel2}
  </svg>`;
}
function renderSectionSetup(){
  const opts = [10,20,30,50];
  const mode = state.sectionSetupMode;
  const focusZone = state.sectionSetupFocusZone;

function renderSectionTurnChart(turnScores){
  const w=340, h=120, pad=20;
  const n = turnScores.length;
  if(n===0) return '';
  const barW = (w-2*pad)/n;
  const bars = turnScores.map((score,i)=>{
    const barH = Math.max(2,(score/100)*(h-2*pad));
    const x = pad + i*barW;
    const y = h-pad-barH;
    const color = score>=80?'var(--green)':score>=50?'var(--brass)':'var(--red)';
    return `<rect x="${(x+1).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,barW-2).toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="2"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--felt-lighter)" stroke-width="1"/>

function renderSectionLineChart(sessions){
