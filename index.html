<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oche — Darts Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt-dark:#122019;
  --felt:#1B2E27;
  --felt-light:#26402F;
  --felt-lighter:#2F4C3A;
  --cream:#F2ECDC;
  --cream-dim:#AEBCAF;
  --brass:#CC9A3D;
  --brass-dark:#A97C28;
  --red:#B23A3A;
  --green:#3C7A56;
  --wire:#5C6C60;
  --ink:#0C1512;
  --radius:14px;
  --shadow: 0 6px 18px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: radial-gradient(ellipse at top, #1a2b23 0%, #0c1512 75%);
  font-family:'Inter',sans-serif;
  color:var(--cream);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:24px 12px;
}
.device{
  width:420px;
  max-width:100%;
  background: linear-gradient(180deg,var(--felt) 0%, var(--felt-dark) 100%);
  border-radius:32px;
  border:1px solid #33473a;
  box-shadow: var(--shadow), inset 0 0 60px rgba(0,0,0,0.25);
  overflow:hidden;
  min-height:820px;
  display:flex;
  flex-direction:column;
  position:relative;
}
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  padding-bottom:8px;
}
h1,h2,h3,h4{font-family:'Oswald',sans-serif; margin:0; letter-spacing:0.02em; font-weight:600;}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 18px 12px 18px;
}
.brand{
  display:flex;align-items:center;gap:10px;
}
.brand .dot{
  width:14px;height:14px;border-radius:50%;
  background: radial-gradient(circle at 35% 30%, #dd5b5b, var(--red) 60%, #6e1f1f 100%);
  box-shadow:0 0 0 3px rgba(204,154,61,0.25);
}
.brand h1{font-size:22px;color:var(--brass); text-transform:uppercase;}
.iconbtn{
  background:var(--felt-light); border:1px solid #3a5442; color:var(--cream);
  width:38px;height:38px;border-radius:10px; display:flex;align-items:center;justify-content:center;
  cursor:pointer; font-size:16px;
}
.iconbtn:active{transform:scale(0.94);}
.subtitle{color:var(--cream-dim); font-size:13px; padding:0 18px 14px 18px;}
.section-label{
  font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em;
  color:var(--brass); text-transform:uppercase; padding:16px 18px 8px 18px;
}
.content{padding:0 18px 18px 18px; display:flex; flex-direction:column; gap:12px;}

.card{
  background:var(--felt-light);
  border:1px solid #3a5442;
  border-radius:var(--radius);
  padding:14px 16px;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute; left:0; top:0; bottom:0; width:4px;
  background:linear-gradient(180deg,var(--brass),var(--red));
}
.card-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.card h3{font-size:19px;}
.card p.desc{color:var(--cream-dim); font-size:13px; margin:4px 0 10px 0; line-height:1.4;}
.badge{
  font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 8px; border-radius:20px;
  text-transform:uppercase; letter-spacing:0.06em; white-space:nowrap;
}
.badge.live{background:rgba(60,122,86,0.25); color:#7FDB9F; border:1px solid #3C7A56;}
.badge.soon{background:rgba(174,188,175,0.12); color:var(--cream-dim); border:1px solid #3a5442;}
.meta-row{display:flex; gap:14px; font-size:11px; color:var(--cream-dim); font-family:'JetBrains Mono',monospace; margin-bottom:12px; flex-wrap:wrap;}
.meta-row span{display:flex; align-items:center; gap:4px;}
.btn-row{display:flex; gap:8px;}
.btn{
  border:none; border-radius:10px; padding:10px 14px; font-family:'Inter',sans-serif;
  font-weight:600; font-size:13px; cursor:pointer; flex:1; text-align:center;
  transition:transform 0.08s ease;
}
.btn:active{transform:scale(0.96);}
.btn-primary{background:linear-gradient(180deg,var(--brass),var(--brass-dark)); color:#241a06;}
.btn-secondary{background:transparent; color:var(--cream); border:1px solid #4a6552;}
.btn-ghost{background:transparent; color:var(--cream-dim); border:none; text-decoration:underline; flex:none;}
.btn-danger{background:transparent; color:#e08787; border:1px solid #6e3535;}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.btn-full{width:100%;}

.bottomnav{
  display:flex; border-top:1px solid #33473a; background:var(--felt-dark);
}
.navbtn{
  flex:1; padding:12px 4px 10px 4px; text-align:center; color:var(--cream-dim);
  font-size:11px; font-family:'JetBrains Mono',monospace; cursor:pointer; letter-spacing:0.04em;
  border-top:2px solid transparent;
}
.navbtn .navicon{font-size:18px; display:block; margin-bottom:2px;}
.navbtn.active{color:var(--brass); border-top:2px solid var(--brass);}

.rule-block{background:var(--felt-light); border:1px solid #3a5442; border-radius:var(--radius); padding:14px 16px;}
.rule-block h4{color:var(--brass); font-size:13px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px;}
.rule-block p{margin:0; font-size:14px; line-height:1.5; color:var(--cream);}

.input, select{
  width:100%; background:var(--felt-dark); border:1px solid #3a5442; color:var(--cream);
  border-radius:10px; padding:10px 12px; font-family:'Inter',sans-serif; font-size:14px;
}
.field-label{font-size:12px; color:var(--cream-dim); margin-bottom:6px; display:block; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.06em;}
.chip{
  display:inline-flex; align-items:center; padding:7px 12px; border-radius:20px;
  border:1px solid #3a5442; background:var(--felt-dark); color:var(--cream-dim); font-size:13px; cursor:pointer;
  margin:3px 4px 3px 0;
}
.chip.selected{background:rgba(204,154,61,0.18); border-color:var(--brass); color:var(--brass);}
.chip-wrap{display:flex; flex-wrap:wrap;}

.player-row{
  display:flex; align-items:center; justify-content:space-between; padding:10px 12px;
  background:var(--felt-dark); border:1px solid #3a5442; border-radius:10px; margin-bottom:8px;
}
.player-avatar{
  width:30px;height:30px;border-radius:50%; display:flex;align-items:center;justify-content:center;
  font-weight:700; font-size:13px; color:#1a1206;
}

.active-top{padding:16px 18px 8px 18px;}
.active-top .game-title{font-size:12px; color:var(--cream-dim); font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.1em;}
.objective-banner{
  background:linear-gradient(90deg, rgba(204,154,61,0.16), rgba(204,154,61,0.04));
  border:1px solid rgba(204,154,61,0.4); border-radius:12px; padding:12px 14px; margin:8px 0 12px 0;
}
.objective-banner .big{font-family:'Oswald',sans-serif; font-size:20px; color:var(--brass);}
.objective-banner .small{font-size:12px; color:var(--cream-dim); margin-top:2px;}

.score-strip{display:flex; gap:8px; padding:0 18px 10px 18px; overflow-x:auto;}
.score-card{
  min-width:110px; background:var(--felt-light); border:1px solid #3a5442; border-radius:12px;
  padding:10px 12px; position:relative;
}
.score-card.active{border-color:var(--brass); box-shadow:0 0 0 1px var(--brass);}
.score-card .pname{font-size:12px; color:var(--cream-dim); display:flex; align-items:center; gap:5px;}
.score-card .pscore{font-family:'Oswald',sans-serif; font-size:28px; color:var(--cream); line-height:1.1;}
.score-card .pmarks{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--cream-dim); margin-top:3px;}
.dartpip{color:var(--brass); font-size:10px;}

.turn-area{padding:0 18px 10px 18px;}
.turn-darts{display:flex; gap:8px; align-items:center; min-height:38px;}
.dart-chip{
  font-family:'JetBrains Mono',monospace; background:var(--ink); border:1px solid var(--brass);
  color:var(--cream); padding:6px 10px; border-radius:8px; font-size:14px; font-weight:700;
}
.dart-chip.empty{border:1px dashed #46584c; color:#46584c; background:transparent;}
.turn-total{margin-left:auto; font-family:'JetBrains Mono',monospace; color:var(--cream-dim); font-size:13px;}

.entry-toggle{display:flex; gap:6px; padding:0 18px 10px 18px;}
.entry-toggle button{flex:1;}

.quicktargets{padding:0 18px 8px 18px;}
.quicktargets .qlabel{font-size:11px; color:var(--cream-dim); font-family:'JetBrains Mono',monospace; text-transform:uppercase; margin-bottom:6px;}
.qt-row{display:flex; gap:8px; flex-wrap:wrap;}
.qt-btn{
  background:linear-gradient(180deg, rgba(204,154,61,0.22), rgba(204,154,61,0.06));
  border:1px solid var(--brass); color:var(--brass); border-radius:10px; padding:8px 14px;
  font-family:'Oswald',sans-serif; font-size:16px; cursor:pointer;
}

.numgrid{
  display:grid; grid-template-columns:repeat(5,1fr); gap:7px; padding:6px 18px 8px 18px;
}
.num-btn{
  aspect-ratio:1; border-radius:10px; border:1px solid #3a5442; background:var(--felt-light);
  color:var(--cream); font-family:'Oswald',sans-serif; font-size:17px; cursor:pointer; position:relative;
  display:flex; align-items:center; justify-content:center;
}
.num-btn.recommended{border-color:var(--brass); box-shadow:0 0 0 1px var(--brass); color:var(--brass);}
.num-btn.closed{background:repeating-linear-gradient(135deg, var(--felt-light), var(--felt-light) 4px, rgba(178,58,58,0.35) 4px, rgba(178,58,58,0.35) 8px); color:#e08787;}
.num-btn .marks{position:absolute; bottom:3px; font-size:9px; letter-spacing:2px; color:var(--brass);}
.num-btn.wide{grid-column:span 2; aspect-ratio:auto; height:44px; font-size:13px; font-family:'Inter',sans-serif; font-weight:600;}

.multibar{
  margin:0 18px 10px 18px; background:var(--felt-dark); border:1px solid var(--brass); border-radius:12px;
  padding:10px 12px;
}
.multibar .msg{font-size:12px; color:var(--cream-dim); margin-bottom:8px; font-family:'JetBrains Mono',monospace;}
.multi-row{display:flex; gap:8px;}
.multi-row button{flex:1; padding:12px 0; border-radius:10px; font-family:'Oswald',sans-serif; font-size:15px; border:1px solid #3a5442; background:var(--felt-light); color:var(--cream); cursor:pointer;}
.multi-row button.cancel{color:#e08787; border-color:#6e3535;}

.bottom-controls{
  display:flex; gap:6px; padding:10px 18px 16px 18px; border-top:1px solid #26402f; margin-top:auto;
}
.bottom-controls button{
  flex:1; background:var(--felt-light); border:1px solid #3a5442; color:var(--cream-dim);
  border-radius:10px; padding:10px 4px; font-size:11px; font-family:'JetBrains Mono',monospace;
  text-transform:uppercase; cursor:pointer;
}
.bottom-controls button.warn{color:#e08787;}

.board-wrap{display:flex; justify-content:center; padding:8px 18px;}
.confirm-banner{margin:0 18px 8px 18px; text-align:center; background:var(--felt-dark); border:1px solid var(--brass); border-radius:10px; padding:8px; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--brass);}

.modal-overlay{
  position:absolute; inset:0; background:rgba(6,10,8,0.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px;
}
.modal{
  background:var(--felt); border:1px solid var(--brass); border-radius:16px; padding:22px; width:100%; max-width:340px;
}
.modal h3{color:var(--brass); margin-bottom:10px;}
.modal-actions{display:flex; gap:8px; margin-top:16px;}

.empty-state{padding:40px 20px; text-align:center; color:var(--cream-dim);}
.empty-state .glyph{font-size:34px; margin-bottom:10px;}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.stat-box{background:var(--felt-light); border:1px solid #3a5442; border-radius:10px; padding:10px 12px;}
.stat-box .val{font-family:'Oswald',sans-serif; font-size:22px; color:var(--brass);}
.stat-box .lab{font-size:11px; color:var(--cream-dim); font-family:'JetBrains Mono',monospace; text-transform:uppercase;}

.checkbox-row{display:flex; align-items:center; gap:8px; padding:8px 0; font-size:13px; color:var(--cream);}
.checkbox-row input{width:16px;height:16px;}

.theme-row{display:flex; gap:10px; flex-wrap:wrap;}
.theme-swatch{display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; width:72px;}
.theme-swatch .circle{width:44px; height:44px; border-radius:50%; border:2px solid #3a5442; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);}
.theme-swatch.selected .circle{border-color:var(--brass); box-shadow:0 0 0 2px var(--brass);}
.theme-swatch .tlabel{font-size:10px; color:var(--cream-dim); text-align:center; line-height:1.2;}
.info-note{font-size:12px; color:var(--cream-dim); line-height:1.5; margin-top:6px;}
.co-row{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid #26402f; font-family:'JetBrains Mono',monospace; font-size:13px;}
.co-row .co-score{color:var(--brass); font-family:'Oswald',sans-serif; font-size:17px; width:44px;}
.co-row .co-route{color:var(--cream);}
.co-row .co-none{color:var(--cream-dim); font-style:italic;}
.co-row.highlight{background:rgba(204,154,61,0.14); border-radius:8px;}
.co-tabs{display:flex; gap:6px; padding:0 18px 10px 18px;}
.option-legend{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
.option-legend .leg-item{font-size:12px; color:var(--cream-dim); line-height:1.4; padding-left:2px; border-left:2px solid #3a5442; padding-left:8px;}
.option-legend .leg-item b{color:var(--cream);}
.option-legend .leg-item.active-leg{border-left-color:var(--brass);}
.option-legend .leg-item.active-leg b{color:var(--brass);}
a.linklike{color:var(--brass); cursor:pointer; text-decoration:underline; font-size:13px;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#3a5442; border-radius:3px;}
</style>
</head>

const THEMES = [
  { id:'felt', name:'Felt Green', swatch:'#1B2E27',

/* ========================= X01 ENGINE ========================= */
const ALL_THROWS = (() => {
  const t = [];
  for(let n=1;n<=20;n++){ t.push({label:'T'+n, value:n*3, type:'triple', n}); }
  t.push({label:'DB', value:50, type:'bull'});
  t.push({label:'SB', value:25, type:'bull'});
  for(let n=1;n<=20;n++){ t.push({label:'D'+n, value:n*2, type:'double', n}); }
  for(let n=1;n<=20;n++){ t.push({label:'S'+n, value:n, type:'single', n}); }
  t.sort((a,b)=>b.value-a.value);
  return t;
})();
function finishSetFor(outRule){
  if(outRule==='straight') return ALL_THROWS;
  if(outRule==='master') return ALL_THROWS.filter(t=>t.type==='double'||t.type==='triple'||t.label==='DB');
  return ALL_THROWS.filter(t=>t.type==='double'||t.label==='DB'); // double out (DB counts as double)
}
function findCheckout(remaining, dartsLeft, outRule){
  if(remaining<=0 || dartsLeft<1) return null;
  const finishSet = finishSetFor(outRule);
  for(const t of finishSet){ if(t.value===remaining) return [t.label]; }
  if(dartsLeft===1) return null;
  for(const t of ALL_THROWS){
    if(t.value>=remaining) continue;
    const rest = findCheckout(remaining-t.value, dartsLeft-1, outRule);
    if(rest) return [t.label, ...rest];
  }
  return null;
}
function beginnerSuggestion(remaining, outRule){
  if(outRule!=='double' && outRule!=='master'){
    return {big:'Aim at 20', small:'Keep chipping away — no finishing rule to worry about yet.'};
  }
  if(remaining<=40 && remaining%2===0 && remaining>0){
    return {big:'Aim for Double '+(remaining/2), small:'Straight at the double — that\'s your finish.'};
  }
  if(remaining===50){
    return {big:'Aim at Bull', small:'A hit on the bull finishes it outright.'};
  }
  const friendly = [40,32,24,16,8];
  return {big:'Aim at 20', small:'Try to leave an even number like 40, 32, 24, 16 or 8 for an easy double.'};
}
function buildCheckoutTable(outRule){
  const rows = [];
  for(let score=170; score>=2; score--){
    const route = findCheckout(score, 3, outRule);
    rows.push({score, route});
  }
  return rows;
}
function startX01Session(playerIds, opts){
  return {
    kind:'x01',
    startScore: opts.startScore,
    inRule: opts.inRule,
    outRule: opts.outRule,
    guidance: opts.guidance,
    participants: playerIds.map(pid => ({
      playerId: pid, score: opts.startScore, opened: opts.inRule!=='double', finished:false,
      stats:{darts:0, best:0, scores:[]}
    })),
    currentIdx: 0,
    round: 1,
    currentTurnDarts: [],
    turnHistory: [],
    scoreBeforeTurn: opts.startScore,
    finishedOrder: [],
    winnerId: null,
    complete:false,
  };
}
function x01Current(s){ return s.participants[s.currentIdx]; }
function x01ApplyDart(s, throwObj){
  const p = x01Current(s);
  if(s.currentTurnDarts.length===0) s.scoreBeforeTurn = p.score;
  let value = throwObj.value;
  let counts = true;
  if(s.inRule==='double' && !p.opened){
    if(throwObj.type==='double' || throwObj.label==='DB'){ p.opened = true; }
    else { value = 0; counts = false; }
  }
  const newScore = p.score - value;
  let bust = false, win = false;
  if(newScore < 0) bust = true;
  else if(newScore === 0){
    if(s.outRule==='double' && !(throwObj.type==='double'||throwObj.label==='DB')) bust = true;
    else if(s.outRule==='master' && !(throwObj.type==='double'||throwObj.type==='triple'||throwObj.label==='DB')) bust = true;
    else win = true;
  } else if(newScore === 1 && (s.outRule==='double'||s.outRule==='master')){
    // still playable in theory only if more darts could recover... but leaving 1 is effectively dead this turn only if it's final dart standing at 1 - not an automatic bust, just unfinishable this turn.
  }
  s.currentTurnDarts.push({label:throwObj.label, value, bust, win});
  if(!bust){ p.score = newScore; }
  p.stats.darts++;
  if(win){
    p.finished = true; p.score = 0;
    s.finishedOrder.push(p.playerId);
    if(!s.winnerId) s.winnerId = p.playerId;
  }
  const turnOver = bust || win || s.currentTurnDarts.length>=3;
  return {bust, win, turnOver};
}
function x01EndTurn(s){
  const p = x01Current(s);
  s.turnHistory.push({participantIdx:s.currentIdx, darts:s.currentTurnDarts, scoreBefore:s.scoreBeforeTurn, scoreAfter:p.score});
  s.currentTurnDarts = [];
  if(p.finished || s.participants.filter(x=>!x.finished).length<=0){
    // advance to next unfinished
  }
  // advance to next unfinished participant
  let tries=0, idx=s.currentIdx;
  do{
    idx = (idx+1) % s.participants.length;
    tries++;
  } while(s.participants[idx].finished && tries<=s.participants.length);
  if(idx <= s.currentIdx) s.round++;
  s.currentIdx = idx;
  const remaining = s.participants.filter(x=>!x.finished);
  if(remaining.length<=1 && s.participants.length>1 && s.finishedOrder.length>=s.participants.length-1){
    s.complete = true;
  } else if(s.participants.length===1 && s.participants[0].finished){
    s.complete = true;
  }
}
function x01Undo(s){
  if(s.currentTurnDarts.length>0){
    s.currentTurnDarts.pop();
    const p = x01Current(s);
    // recompute score by replaying remaining darts in this turn from scoreBeforeTurn
    p.finished = false;
    if(s.finishedOrder[s.finishedOrder.length-1]===p.playerId) s.finishedOrder.pop();
    if(s.winnerId===p.playerId && s.finishedOrder.indexOf(p.playerId)===-1) s.winnerId=null;
    let sc = s.scoreBeforeTurn;
    let opened = s.inRule!=='double' ? true : null;
    s.currentTurnDarts.forEach(d=>{ sc -= d.value; });
    p.score = sc;
  } else if(s.turnHistory.length>0){
    const last = s.turnHistory.pop();
    const p = s.participants[last.participantIdx];
    p.score = last.scoreBefore;
    p.finished = false;
    const fi = s.finishedOrder.indexOf(p.playerId);
    if(fi!==-1) s.finishedOrder.splice(fi,1);
    if(s.winnerId===p.playerId) s.winnerId = s.finishedOrder[0] || null;
    s.currentIdx = last.participantIdx;
    s.complete = false;
  }
}

/* ========================= CRICKET ENGINE ========================= */
const CRICKET_NUMS = [20,19,18,17,16,15,'B'];
function startCricketSession(playerIds, opts){
  return {
    kind:'cricket',
    variant: opts.variant || 'standard',
    participants: playerIds.map(pid => ({
      playerId: pid, marks:{20:0,19:0,18:0,17:0,16:0,15:0,B:0}, points:0, finished:false
    })),
    currentIdx:0, round:1,
    currentTurnDarts:[], turnHistory:[],
    complete:false, winnerId:null,
  };
}
function cricketCurrent(s){ return s.participants[s.currentIdx]; }
function cricketNumClosed(p, num){ return p.marks[num] >= 3; }
function cricketAllClosed(p){ return CRICKET_NUMS.every(n=>cricketNumClosed(p,n)); }
function cricketApplyDart(s, num, marksHit){
  const p = cricketCurrent(s);
  const before = p.marks[num];
  let applied = marksHit;
  let overflow = 0;
  if(before + applied > 3){ overflow = before+applied-3; applied = 3-before; }
  p.marks[num] = before + applied;
  let pointsScored = 0;
  if(overflow>0 && p.marks[num]>=3){
    const othersOpen = s.participants.some(o=>o!==p && !cricketNumClosed(o,num));
    if(s.variant!=='noscore' && othersOpen){
      const val = num==='B'?25:num;
      pointsScored = val*overflow;
      if(s.variant==='cutthroat'){
        s.participants.forEach(o=>{ if(o!==p && !cricketNumClosed(o,num)) o.points += pointsScored; });
      } else {
        p.points += pointsScored;
      }
    }
  }
  s.currentTurnDarts.push({label:(num==='B'?'Bull':num)+' x'+marksHit, num, marksHit, pointsScored});
  // check win
  if(cricketAllClosed(p)){
    const highest = Math.max(...s.participants.map(o=>o.points));
    if(p.points >= highest){
      p.finished = true; s.complete = true; s.winnerId = p.playerId;
    }
  }
  return {turnOver: s.currentTurnDarts.length>=3 || s.complete};
}
function cricketEndTurn(s){
  s.turnHistory.push({participantIdx:s.currentIdx, darts:s.currentTurnDarts, snapshot:JSON.parse(JSON.stringify(cricketCurrent(s)))});
  s.currentTurnDarts = [];
  if(!s.complete){
    s.currentIdx = (s.currentIdx+1) % s.participants.length;
    if(s.currentIdx===0) s.round++;
  }
}
function cricketUndo(s){
  if(s.currentTurnDarts.length>0){
    const d = s.currentTurnDarts.pop();
    const p = cricketCurrent(s);
    p.marks[d.num] -= d.marksHit;
    if(p.marks[d.num]<0) p.marks[d.num]=0;
    if(d.pointsScored){
      if(s.variant==='cutthroat'){
        s.participants.forEach(o=>{ if(o!==p) o.points -= d.pointsScored; });
      } else {
        p.points -= d.pointsScored;
      }
    }
    p.finished = false; s.complete=false; s.winnerId=null;
  } else if(s.turnHistory.length>0){
    const last = s.turnHistory.pop();
    s.participants[last.participantIdx] = last.snapshot;
    s.currentIdx = last.participantIdx;
    s.complete=false; s.winnerId=null;
  }
}

function startPracticeSession(def, playerId){
  return {
    def, playerId,
    sequence: def.targets.slice(),
    order: def.order,
    idx: 0,
    hitsOnCurrent: 0,
    requiredHits: def.requiredHits,
    totalDarts: 0,
    successfulHits: 0,
    misses: 0,
    perTarget: {},
    startTime: Date.now(),
    complete:false,
  };
}
function practiceCurrentTarget(ps){ return ps.sequence[ps.idx]; }
function practiceApplyDart(ps, hitTarget, multiplier){
  ps.totalDarts++;
  const target = practiceCurrentTarget(ps);
  const isHit = hitTarget === target;
  let hitValue = 0;
  if(isHit){
    hitValue = ps.def.multiplierRule==='exact' ? 1 : (multiplier==='triple'?3:multiplier==='double'?2:1);
    if(ps.def.multiplierRule==='simple') hitValue = 1;
    ps.hitsOnCurrent += hitValue;
    ps.successfulHits++;
    ps.perTarget[target] = (ps.perTarget[target]||0)+1;
  } else {
    ps.misses++;
  }
  if(ps.hitsOnCurrent >= ps.requiredHits){
    ps.idx++;
    ps.hitsOnCurrent = 0;
    if(ps.idx >= ps.sequence.length){
      ps.complete = true;
      ps.completionTime = Math.round((Date.now()-ps.startTime)/1000);
    }
  }
  return isHit;
}

/* ========================= DARTBOARD SVG ========================= */
const BOARD_ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
function polar(cx,cy,r,angleDeg){
  const rad = angleDeg*Math.PI/180;
  return [ (cx + r*Math.sin(rad)).toFixed(2), (cy - r*Math.cos(rad)).toFixed(2) ];
}
function wedgePath(cx,cy,rIn,rOut,aStart,aEnd){
  const p1 = polar(cx,cy,rOut,aStart);
  const p2 = polar(cx,cy,rOut,aEnd);
  const p3 = polar(cx,cy,rIn,aEnd);
  const p4 = polar(cx,cy,rIn,aStart);
  return `M ${p1} A ${rOut} ${rOut} 0 0 1 ${p2} L ${p3} A ${rIn} ${rIn} 0 0 0 ${p4} Z`;
}
function renderDartboardSVG(pending){
  const cx=200, cy=200;
  const rDoubleOut=195, rDoubleIn=178, rTripleOut=122, rTripleIn=106, rBullOuter=24, rBullInner=11;
  let wedges = '';
  let labels = '';
  for(let i=0;i<20;i++){
    const num = BOARD_ORDER[i];
    const aStart = -9 + i*18, aEnd = aStart+18;
    const even = i%2===0;
    const singleFill = even? '#EDE6D6' : '#1B2A22';
    const dtFill = even? '#3C7A56' : '#A23B3B';
    const isSel = (seg)=> pending && String(pending.num)===String(num) && pending.seg===seg;
    wedges += `<path d="${wedgePath(cx,cy,rTripleOut,rDoubleIn,aStart,aEnd)}" fill="${singleFill}" stroke="#0C1512" stroke-width="1" class="board-seg" data-num="${num}" data-seg="single" style="cursor:pointer;${isSel('single')?'filter:brightness(1.4);':''}"/>`;
    wedges += `<path d="${wedgePath(cx,cy,rDoubleIn,rDoubleOut,aStart,aEnd)}" fill="${dtFill}" stroke="#0C1512" stroke-width="1" class="board-seg" data-num="${num}" data-seg="double" style="cursor:pointer;${isSel('double')?'filter:brightness(1.5);':''}"/>`;
    wedges += `<path d="${wedgePath(cx,cy,rBullOuter,rTripleIn,aStart,aEnd)}" fill="${singleFill}" stroke="#0C1512" stroke-width="1" class="board-seg" data-num="${num}" data-seg="single" style="cursor:pointer;${isSel('single')?'filter:brightness(1.4);':''}"/>`;
    wedges += `<path d="${wedgePath(cx,cy,rTripleIn,rTripleOut,aStart,aEnd)}" fill="${dtFill}" stroke="#0C1512" stroke-width="1" class="board-seg" data-num="${num}" data-seg="triple" style="cursor:pointer;${isSel('triple')?'filter:brightness(1.5);':''}"/>`;
    const lp = polar(cx,cy,rDoubleOut+14,(aStart+aEnd)/2);
    labels += `<text x="${lp[0]}" y="${lp[1]}" fill="#F2ECDC" font-family="Oswald,sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">${num}</text>`;
  }
  const bullOuterSel = pending && pending.seg==='bullouter';
  const bullInnerSel = pending && pending.seg==='bullinner';
  wedges += `<circle cx="${cx}" cy="${cy}" r="${rBullOuter}" fill="#3C7A56" stroke="#0C1512" class="board-seg" data-num="B" data-seg="bullouter" style="cursor:pointer;${bullOuterSel?'filter:brightness(1.4);':''}"/>`;
  wedges += `<circle cx="${cx}" cy="${cy}" r="${rBullInner}" fill="#A23B3B" stroke="#0C1512" class="board-seg" data-num="B" data-seg="bullinner" style="cursor:pointer;${bullInnerSel?'filter:brightness(1.4);':''}"/>`;
  return `<svg viewBox="0 0 400 400" width="290" height="290" onclick="handleBoardClick(event)">
    <circle cx="${cx}" cy="${cy}" r="${rDoubleOut+16}" fill="#0C1512"/>
    ${wedges}${labels}
  </svg>`;
}
function handleBoardClick(evt){
  const t = evt.target;
  if(!t.classList || !t.classList.contains('board-seg')) return;
  const num = t.getAttribute('data-num');
  const seg = t.getAttribute('data-seg');
  let label;
  if(seg==='bullouter'){ label='Outer Bull (25)'; }
  else if(seg==='bullinner'){ label='Bull (50)'; }
  else { label = (seg==='single'?'Single ':seg==='double'?'Double ':'Triple ')+num; }
  const candidate = {num, seg, label};
  if(!state.settings.boardConfirm){
    commitBoardThrow(candidate);
    return;
  }
  if(state.pendingBoard && state.pendingBoard.num===num && state.pendingBoard.seg===seg){
    commitBoardThrow(candidate);
  } else {
    state.pendingBoard = candidate;
    render();
  }
}
function commitBoardThrow(c){
  state.pendingBoard = null;
  if(c.seg==='bullinner'){ dispatchThrow('B','bull'); }
  else if(c.seg==='bullouter'){ dispatchThrow('B','single'); }
  else { dispatchThrow(parseInt(c.num,10), c.seg); }
}

/* ========================= THROW DISPATCH ========================= */
function dispatchThrow(num, segType){
  const s = state.session;
  if(!s) return;
  if(s.kind==='x01'){
    let throwObj;
    if(num==='B' && segType==='bull') throwObj = {label:'DB',value:50,type:'bull'};
    else if(num==='B' && segType==='single') throwObj = {label:'SB',value:25,type:'bull'};
    else {
      const n = num;
      if(segType==='single') throwObj = {label:'S'+n,value:n,type:'single',n};
      else if(segType==='double') throwObj = {label:'D'+n,value:n*2,type:'double',n};
      else throwObj = {label:'T'+n,value:n*3,type:'triple',n};
    }
    const res = x01ApplyDart(s, throwObj);
    if(res.turnOver){
      if(res.bust){ finalizeBustThenAdvance(s); }
      else { x01EndTurn(s); if(s.complete) finishX01Game(s); }
    }
  } else if(s.kind==='cricket'){
    const validNums = [20,19,18,17,16,15,'B'];
    const targetNum = num==='B' ? 'B' : num;
    if(!validNums.includes(targetNum)){ /* off-cricket-number hit: just record as miss-equivalent */ 
      state.session.currentTurnDarts.push({label:'No Score', num:null, marksHit:0, pointsScored:0});
      if(state.session.currentTurnDarts.length>=3){ cricketEndTurn(s); }
      render(); return;
    }
    const marksHit = segType==='bull' ? 2 : segType==='double' ? 2 : segType==='triple' ? 3 : 1;
    const realMarks = (targetNum==='B') ? (segType==='bull'?2:1) : marksHit;
    const res = cricketApplyDart(s, targetNum, realMarks);
    if(res.turnOver){
      cricketEndTurn(s);
      if(s.complete){ finishCricketGame(s); }
    }
  }
  render();
}
function recordMiss(){
  const s = state.session;
  if(s.kind==='x01'){
    if(s.currentTurnDarts.length===0) s.scoreBeforeTurn = x01Current(s).score;
    s.currentTurnDarts.push({label:'Miss', value:0});
    x01Current(s).stats.darts++;
    if(s.currentTurnDarts.length>=3){ x01EndTurn(s); if(s.complete) finishX01Game(s); }
  } else if(s.kind==='cricket'){
    s.currentTurnDarts.push({label:'Miss', num:null, marksHit:0, pointsScored:0});
    if(s.currentTurnDarts.length>=3){ cricketEndTurn(s); if(s.complete) finishCricketGame(s); }
  }
  render();
}
function finalizeBustThenAdvance(s){
  // score already reverted in x01ApplyDart (not applied), just end turn now
  x01EndTurn(s);
}
function finishX01Game(s){
  const winner = state.players.find(p=>p.id===s.winnerId);
  state.history.unshift({
    type:'501/301', name: s.startScore + ' Game', date: new Date().toLocaleString(),
    winner: winner ? winner.name : 'Unknown',
    detail: `Started at ${s.startScore}, ${s.outRule} out.`
  });
  state.screen = 'win';
}
function finishCricketGame(s){
  const winner = state.players.find(p=>p.id===s.winnerId);
  state.history.unshift({
    type:'Cricket', name:'Cricket ('+s.variant+')', date:new Date().toLocaleString(),
    winner: winner? winner.name : 'Unknown',
    detail: 'Closed all numbers first.'
  });
  state.screen = 'win';
}
function doUndo(){
  const s = state.session;
  if(!s) return;
  if(s.kind==='x01') x01Undo(s);
  else if(s.kind==='cricket') cricketUndo(s);
  state.screen = 'active';
  render();
}
function doClearTurn(){
  const s = state.session;
  if(!s) return;
  if(s.kind==='x01'){
    x01Current(s).score = s.scoreBeforeTurn;
    s.currentTurnDarts = [];
  } else if(s.kind==='cricket'){
    // revert marks/points for darts thrown this turn
    while(s.currentTurnDarts.length>0){ cricketUndo(s); }
  }
  render();
}
function doEndTurnManually(){
  const s = state.session;
  if(!s || s.currentTurnDarts.length===0) return;
  if(s.kind==='x01'){ x01EndTurn(s); if(s.complete) finishX01Game(s); }
  else { cricketEndTurn(s); if(s.complete) finishCricketGame(s); }
  render();
}

function proceedToOptions(){
  if(state.selectedPlayerIds.length===0) return;
  state.screen='gameOptions';
  state.gameOptions = {startScore: state.pendingGameId==='301'?301:501, inRule:'straight', outRule:'double', guidance:'beginner', variant:'standard'};
  render();
}
function setOption(key,val){ state.gameOptions[key]=val; render(); }
function launchGame(){
  const g = GAMES.find(x=>x.id===state.pendingGameId);
  if(g.id==='cricket'){
    state.session = startCricketSession(state.selectedPlayerIds, state.gameOptions);
  } else {
    state.session = startX01Session(state.selectedPlayerIds, state.gameOptions);
  }
  state.showAllNumbers = false;
  state.pendingSelection = null;
  state.pendingBoard = null;
  state.screen = 'active';
  render();
}
function toggleEntryMethod(){
  state.settings.entryMethod = state.settings.entryMethod==='grid' ? 'board' : 'grid';
  state.pendingSelection = null; state.pendingBoard = null;
  render();
}
function selectNumberGrid(num){
  if(num==='B'){ state.pendingSelection = {num:'B'}; render(); return; }
  if(num==='miss'){ recordMiss(); return; }
  state.pendingSelection = {num};
  render();
}
function chooseMultiplier(mult){
  const sel = state.pendingSelection;
  state.pendingSelection = null;
  if(sel.num==='B'){
    dispatchThrow('B', mult==='bull'?'bull':'single');
  } else {
    dispatchThrow(sel.num, mult);
  }
}
function cancelPending(){ state.pendingSelection=null; state.pendingBoard=null; render(); }
function toggleShowAll(){ state.showAllNumbers = !state.showAllNumbers; render(); }
function openGameMenu(){ state.gameMenuOpen=true; render(); }
function closeGameMenu(){ state.gameMenuOpen=false; render(); }
function quitToHome(){ state.gameMenuOpen=false; state.session=null; state.screen='home'; state.navTab='play'; render(); }
function goHomeFromWin(){ state.session=null; state.screen='home'; render(); }

/* Practice handlers */
function startPracticeFlow(practId){
  const def0 = PRACTICES.find(p=>p.id===practId) || state.customPractices.find(p=>p.id===practId);
  if(!def0) return;
  if(def0.status==='soon') return;
  let def;
  if(practId==='threeofeach'){
    def = {targets:Array.from({length:20},(_,i)=>i+1), order:'numerical', requiredHits:3, multiplierRule:'simple'};
  } else {
    def = def0;
  }
  const playerId = state.players[0] ? state.players[0].id : null;
  if(!playerId){ state.screen='practicePlayerNeeded'; render(); return; }
  state.practiceSession = startPracticeSession(def, playerId);
  state.pendingSelection = null;
  state.screen = 'practiceActive';
  render();
}
function practiceSelectNumber(num){
  if(num==='miss'){ practiceApplyDart(state.practiceSession, null, null); checkPracticeDone(); render(); return; }
  state.pendingSelection = {num};
  render();
}
function practiceChooseMultiplier(mult){
  const sel = state.pendingSelection;
  state.pendingSelection = null;
  practiceApplyDart(state.practiceSession, sel.num, mult);
  checkPracticeDone();
  render();
}
function checkPracticeDone(){
  if(state.practiceSession.complete){
    const ps = state.practiceSession;
    const acc = ps.totalDarts? Math.round((ps.successfulHits/ps.totalDarts)*1000)/10 : 0;
    state.history.unshift({
      type:'Practice', name: ps.def.name || 'Custom Routine', date:new Date().toLocaleString(),
      winner: (state.players.find(p=>p.id===ps.playerId)||{}).name || 'You',
      detail: `${ps.totalDarts} darts, ${acc}% accuracy`
    });
    state.screen = 'practiceResults';
  }
}
function exitPracticeEarly(){ state.practiceSession=null; state.screen='home'; state.navTab='practice'; render(); }
function backToPracticeFromResults(){ state.practiceSession=null; state.screen='home'; state.navTab='practice'; render(); }

/* Custom builder handlers */
function openCustomBuilder(){
  state.customBuilder = {name:'', targets:[], order:'numerical', requiredHits:3, multiplierRule:'simple'};
  state.screen = 'customBuilder';
  render();
}
function cbSetName(v){ state.customBuilder.name = v; }
function cbToggleTarget(t){
  const arr = state.customBuilder.targets;
  const i = arr.indexOf(t);
  if(i===-1) arr.push(t); else arr.splice(i,1);
  render();
}
function cbSetOrder(v){ state.customBuilder.order=v; render(); }
function cbSetRequired(v){ state.customBuilder.requiredHits=parseInt(v,10); render(); }
function cbSetMultiplierRule(v){ state.customBuilder.multiplierRule=v; render(); }
function cbSave(){
  const cb = state.customBuilder;
  const nameInput = document.getElementById('cbNameInput');
  const name = (nameInput ? nameInput.value.trim() : cb.name) || 'My Routine';
  if(cb.targets.length===0) return;
  let targets = cb.targets.slice();
  if(cb.order==='reverse') targets = targets.slice().sort((a,b)=>b-a);
  else if(cb.order==='numerical') targets = targets.slice().sort((a,b)=>a-b);
  else if(cb.order==='random'){ for(let i=targets.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [targets[i],targets[j]]=[targets[j],targets[i]]; } }
  const def = {id:'custom-'+nextId(), name, desc:'Custom routine — '+targets.length+' targets', status:'live',
    targets, order:cb.order, requiredHits:cb.requiredHits, multiplierRule:cb.multiplierRule, isCustom:true};
  state.customPractices.push(def);
  state.customBuilder = null;
  state.navTab = 'practice';
  state.screen = 'home';
  render();
}
function cbCancel(){ state.customBuilder=null; state.screen='home'; render(); }

/* Settings */
function setSetting(key, val){ state.settings[key]=val; render(); }

/* Checkout table */
function openCheckoutTable(fromScreen, outRule){
  state.checkoutReturnScreen = fromScreen || state.screen;
  state.checkoutOutRule = outRule || (state.session && state.session.kind==='x01' ? state.session.outRule : 'double');
  state.screen = 'checkoutTable';
  render();
}
function closeCheckoutTable(){
  state.screen = state.checkoutReturnScreen || 'home';
  state.checkoutReturnScreen = null;
  render();
}

/* ========================= RENDER: SHELL ========================= */
function render(){
  applyTheme();
  const app = document.getElementById('app');
  let html = '';
  switch(state.screen){
    case 'home': html = renderHomeShell(); break;
    case 'rules': html = renderRulesScreen(); break;
    case 'playerSetup': html = renderPlayerSetup(); break;
    case 'gameOptions': html = renderGameOptions(); break;
    case 'active': html = renderActiveShell(); break;
    case 'win': html = renderWin(); break;
    case 'practicePlayerNeeded': html = renderPracticeNeedsPlayer(); break;
    case 'practiceActive': html = renderPracticeActive(); break;
    case 'practiceResults': html = renderPracticeResults(); break;
    case 'customBuilder': html = renderCustomBuilder(); break;
    case 'settings': html = renderSettings(); break;
    case 'checkoutTable': html = renderCheckoutTable(); break;
    default: html = renderHomeShell();
  }
  app.innerHTML = html;
}
function bottomNav(){
  const tabs = [
    {id:'play', icon:'&#127919;', label:'Play'},
    {id:'practice', icon:'&#127993;', label:'Practice'},

/* ========================= RENDER: ACTIVE GAME ========================= */
function playerName(id){ const p = state.players.find(x=>x.id===id); return p? p.name : '???'; }
function renderActiveShell(){
  const s = state.session;
  if(!s) return renderHomeShell();
  const g = GAMES.find(x=> (x.id==='cricket'&&s.kind==='cricket') || (x.id!=='cricket' && s.kind==='x01' && x.id==(s.startScore===301?'301':'501')) );
  const gname = s.kind==='cricket' ? 'Cricket' : (s.startScore+'');
  let objective='', top='';
  if(s.kind==='x01'){
    const p = x01Current(s);
    const dartsLeft = 3 - s.currentTurnDarts.length;
    let guideBig='', guideSmall='';
    if(s.guidance!=='none'){
      if(s.guidance==='basic'){ guideBig = p.score+' remaining'; guideSmall='Aim at 20 to keep your score moving.'; }
      else if(s.guidance==='beginner'){
        const b = beginnerSuggestion(p.score, s.outRule);
        guideBig = p.score+' remaining'; guideSmall = b.big+' — '+b.small;
      } else if(s.guidance==='standard'){
        const route = findCheckout(p.score, dartsLeft, s.outRule);
        guideBig = p.score+' remaining';
        guideSmall = route ? 'Possible finish: '+route.join(', ') : 'No checkout yet — keep scoring.';
      }
    } else {
      guideBig = p.score+' remaining'; guideSmall='';
    }
    objective = `<div class="objective-banner"><div class="big">${guideBig}</div>${guideSmall?`<div class="small">${guideSmall}</div>`:''}
      <div style="margin-top:8px;"><a class="linklike" onclick="openCheckoutTable('active','${s.outRule}')">View full checkout table &#9656;</a></div>
    </div>`;
  } else if(s.kind==='cricket'){
    const p = cricketCurrent(s);
    const open = CRICKET_NUMS.filter(n=>!cricketNumClosed(p,n));
    const nextTarget = open[0];
    objective = `<div class="objective-banner"><div class="big">${nextTarget!==undefined? 'Close '+(nextTarget==='B'?'Bull':nextTarget) : 'All closed!'}</div><div class="small">${open.length} number${open.length!==1?'s':''} still open</div></div>`;
  }
  return `<div class="active-top">
    <div class="game-title">${gname} &middot; Round ${s.round}</div>
    <h2>${playerName((s.kind==='x01'?x01Current(s):cricketCurrent(s)).playerId)}'s turn</h2>
    ${objective}
  </div>
  ${renderScoreStrip(s)}
  ${renderTurnArea(s)}
  ${renderEntryArea(s)}
  ${renderBottomControls(s)}
  ${state.gameMenuOpen ? renderGameMenu(s) : ''}`;
}
function renderScoreStrip(s){
  if(s.kind==='x01'){
    return `<div class="score-strip">${s.participants.map((p,i)=>`
      <div class="score-card ${i===s.currentIdx?'active':''}">
        <div class="pname">${i===s.currentIdx?'<span class="dartpip">&#9679;</span>':''} ${playerName(p.playerId)}</div>
        <div class="pscore">${p.score}</div>
        <div class="pmarks">${p.finished? 'Finished' : p.stats.darts+' darts'}</div>
      </div>
    `).join('')}</div>`;
  } else {
    return `<div class="score-strip">${s.participants.map((p,i)=>`
      <div class="score-card ${i===s.currentIdx?'active':''}">
        <div class="pname">${i===s.currentIdx?'<span class="dartpip">&#9679;</span>':''} ${playerName(p.playerId)}</div>
        <div class="pscore">${p.points}</div>
        <div class="pmarks">${CRICKET_NUMS.map(n=>{
          const m = p.marks[n];
          return (n==='B'?'B':n)+':'+ (m>=3?'&#10003;':'&#9675;'.repeat(Math.min(m,2))+'&#9679;'.repeat(Math.max(0,m-2)));
        }).join(' ')}</div>
      </div>
    `).join('')}</div>`;
  }
}
function renderTurnArea(s){
  const darts = s.currentTurnDarts;
  const chips = [0,1,2].map(i=> darts[i] ? `<span class="dart-chip">${darts[i].label}</span>` : `<span class="dart-chip empty">—</span>`).join('');
  let total = '';
  if(s.kind==='x01'){
    const sum = darts.reduce((a,d)=>a+(d.value||0),0);
    total = `<span class="turn-total">Turn total: ${sum}</span>`;
  }
  return `<div class="turn-area"><div class="turn-darts">${chips}${total}</div></div>`;
}
function renderEntryArea(s){
  let entryHtml='';
  if(state.settings.entryMethod==='grid'){
    entryHtml = renderNumberGrid(s);
  } else {
    entryHtml = `<div class="board-wrap">${renderDartboardSVG(state.pendingBoard)}</div>
    ${state.pendingBoard ? `<div class="confirm-banner">${state.pendingBoard.label} selected — tap again to confirm</div>` : '<div class="confirm-banner" style="opacity:0.6;">Tap a segment to select a dart</div>'}
    <div style="padding:0 18px 8px 18px; display:flex; gap:8px;">
      <button class="btn btn-secondary" onclick="recordMiss()">Miss</button>
      ${state.pendingBoard ? `<button class="btn btn-danger" onclick="cancelPending()">Cancel</button>` : ''}
    </div>`;
  }
  return `<div class="entry-toggle">
    <button class="btn ${state.settings.entryMethod==='grid'?'btn-primary':'btn-secondary'}" onclick="if(state.settings.entryMethod!=='grid') toggleEntryMethod();">Number Grid</button>
    <button class="btn ${state.settings.entryMethod==='board'?'btn-primary':'btn-secondary'}" onclick="if(state.settings.entryMethod!=='board') toggleEntryMethod();">Dartboard</button>
  </div>
  ${entryHtml}`;
}
function renderNumberGrid(s){
  if(state.pendingSelection){
    const n = state.pendingSelection.num;
    if(n==='B'){
      return `<div class="multibar"><div class="msg">Bull selected</div><div class="multi-row">
        <button onclick="chooseMultiplier('single')">Outer (25)</button>
        <button onclick="chooseMultiplier('bull')">Bull (50)</button>
        <button class="cancel" onclick="cancelPending()">Cancel</button>
      </div></div>`;
    }
    return `<div class="multibar"><div class="msg">${n} selected</div><div class="multi-row">
      <button onclick="chooseMultiplier('single')">Single</button>
      <button onclick="chooseMultiplier('double')">Double</button>
      <button onclick="chooseMultiplier('triple')">Triple</button>
    </div><div class="multi-row" style="margin-top:6px;"><button class="cancel" style="width:100%;" onclick="cancelPending()">Cancel</button></div></div>`;
  }
  if(s.kind==='cricket'){
    const p = cricketCurrent(s);
    return `<div class="numgrid" style="grid-template-columns:repeat(4,1fr);">
      ${CRICKET_NUMS.map(n=>{
        const closed = cricketNumClosed(p,n);
        const label = n==='B'?'Bull':n;
        return `<div class="num-btn ${closed?'closed':''}" onclick="selectNumberGrid('${n}')">${label}<span class="marks">${'&#9679;'.repeat(Math.min(p.marks[n],3))}</span></div>`;
      }).join('')}
      <div class="num-btn wide" onclick="selectNumberGrid('miss')">Miss</div>
    </div>`;
  }
  // x01
  const p = x01Current(s);
  const dartsLeft = 3 - s.currentTurnDarts.length;
  let recommended = new Set();
  if(s.guidance==='basic') recommended.add(20);
  else if(s.guidance==='beginner'){
    if(p.score<=40 && p.score%2===0) recommended.add(p.score/2);
    else recommended.add(20);
  } else if(s.guidance==='standard'){
    const route = findCheckout(p.score, dartsLeft, s.outRule);
    if(route){ route.forEach(lbl=>{ const m = lbl.match(/(\d+)/); if(m) recommended.add(parseInt(m[1],10)); }); }
  }
  const highScore = p.score > 60;
  let nums = Array.from({length:20},(_,i)=>i+1);
  if(!state.showAllNumbers && highScore){
    nums = [20,19,18,17,16];
  }
  return `<div class="quicktargets">
    <div class="qlabel">Quick Targets</div>
    <div class="qt-row">
      ${Array.from(recommended).slice(0,3).map(n=>`<button class="qt-btn" onclick="selectNumberGrid(${n})">${n}</button>`).join('') || `<button class="qt-btn" onclick="selectNumberGrid(20)">20</button>`}
      <button class="qt-btn" onclick="selectNumberGrid('B')">Bull</button>
    </div>
  </div>
  <div class="numgrid">
    ${nums.map(n=>`<div class="num-btn ${recommended.has(n)?'recommended':''}" onclick="selectNumberGrid(${n})">${n}</div>`).join('')}
    <div class="num-btn ${recommended.has(25)?'recommended':''}" onclick="selectNumberGrid('B')">Bull</div>
    <div class="num-btn wide" onclick="selectNumberGrid('miss')">Miss</div>
    ${!state.showAllNumbers && highScore ? `<div class="num-btn wide" style="grid-column:span 5;" onclick="toggleShowAll()">Show All Numbers</div>` : (highScore? `<div class="num-btn wide" style="grid-column:span 5;" onclick="toggleShowAll()">Show Fewer Numbers</div>`:'')}
  </div>`;
}
function renderBottomControls(s){
  return `<div class="bottom-controls">
    <button onclick="doUndo()">Undo</button>
    <button onclick="doClearTurn()">Clear Turn</button>
    <button onclick="doEndTurnManually()">End Turn</button>
    <button class="warn" onclick="openGameMenu()">Menu</button>
  </div>`;
}
function renderGameMenu(s){
  return `<div class="modal-overlay" onclick="if(event.target===this) closeGameMenu();">
    <div class="modal">
      <h3>Game Menu</h3>
      <button class="btn btn-secondary btn-full" style="margin-bottom:8px;" onclick="closeGameMenu()">Resume Game</button>
      <button class="btn btn-secondary btn-full" style="margin-bottom:8px;" onclick="state.gameMenuOpen=false; state.screen='rules'; state.rulesGameId='${s.kind==='cricket'?'cricket':(s.startScore===301?'301':'501')}'; render();">View Rules</button>
      <button class="btn btn-danger btn-full" onclick="quitToHome()">Quit to Home</button>
    </div>
  </div>`;
}

/* ========================= RENDER: WIN ========================= */
function renderWin(){
  const h = state.history[0];
  return `<div class="topbar"><div class="brand"><span class="dot"></span><h1 style="color:var(--brass);">Game Over</h1></div><div style="width:38px;"></div></div>
  <div class="content">
    <div class="rule-block" style="text-align:center; padding:28px 16px;">
      <div style="font-size:34px; margin-bottom:8px;">&#127942;</div>
      <h2 style="color:var(--brass); font-size:26px;">${h?h.winner:''} wins!</h2>
      <p style="color:var(--cream-dim); margin-top:6px;">${h?h.detail:''}</p>
    </div>
    <button class="btn btn-primary btn-full" onclick="goHomeFromWin()">Back to Home</button>
  </div>`;
}

/* ========================= RENDER: PRACTICE ========================= */
function renderPracticeNeedsPlayer(){
  return `<div class="topbar"><div class="iconbtn" onclick="state.screen='home'; render();">&#8592;</div><h1 style="color:var(--brass); font-size:19px;">Add a Player</h1><div style="width:38px;"></div></div>
  <div class="content">
    <p style="color:var(--cream-dim); font-size:14px;">Practice sessions are tracked to a player. Add one to continue.</p>
    <div style="display:flex; gap:8px;">
      <input class="input" id="newPlayerName" placeholder="Your name">
      <button class="btn btn-secondary" style="flex:none; padding:10px 16px;" onclick="addGuestPlayer(); if(state.players.length){state.screen='home';}">Add</button>
    </div>
  </div>`;
}
function renderPracticeActive(){
  const ps = state.practiceSession;
  const target = practiceCurrentTarget(ps);
  const darts = [];
  return `<div class="active-top">
    <div class="game-title">${ps.def.name || 'Practice'} &middot; Target ${ps.idx+1} of ${ps.sequence.length}</div>
    <h2>Hit ${target}</h2>
    <div class="objective-banner"><div class="big">${ps.hitsOnCurrent} of ${ps.requiredHits}</div><div class="small">${ps.totalDarts} darts thrown so far</div></div>
  </div>
  <div class="entry-toggle">
    <button class="btn ${state.settings.entryMethod==='grid'?'btn-primary':'btn-secondary'}" onclick="if(state.settings.entryMethod!=='grid'){state.settings.entryMethod='grid'; render();}">Number Grid</button>
    <button class="btn ${state.settings.entryMethod==='board'?'btn-primary':'btn-secondary'}" onclick="if(state.settings.entryMethod!=='board'){state.settings.entryMethod='board'; render();}">Dartboard</button>
  </div>
  ${state.settings.entryMethod==='grid' ? renderPracticeGrid(ps) : renderPracticeBoard(ps)}
  <div class="bottom-controls">
    <button onclick="exitPracticeEarly()">Quit</button>
  </div>`;
}
function renderPracticeGrid(ps){
  if(state.pendingSelection){
    const n = state.pendingSelection.num;
    return `<div class="multibar"><div class="msg">${n} selected</div><div class="multi-row">
      <button onclick="practiceChooseMultiplier('single')">Single</button>
      <button onclick="practiceChooseMultiplier('double')">Double</button>
      <button onclick="practiceChooseMultiplier('triple')">Triple</button>
    </div><div class="multi-row" style="margin-top:6px;"><button class="cancel" style="width:100%;" onclick="cancelPending()">Cancel</button></div></div>`;
  }
  const target = practiceCurrentTarget(ps);
  const nums = Array.from({length:20},(_,i)=>i+1);
  return `<div class="numgrid">
    ${nums.map(n=>`<div class="num-btn ${n===target?'recommended':''}" onclick="practiceSelectNumber(${n})">${n}</div>`).join('')}
    <div class="num-btn wide" style="grid-column:span 5;" onclick="practiceSelectNumber('miss')">Miss</div>
  </div>`;
}
function renderPracticeBoard(ps){
  return `<div class="board-wrap">${renderDartboardSVG(state.pendingBoard)}</div>
  ${state.pendingBoard ? `<div class="confirm-banner">${state.pendingBoard.label} — tap again to confirm</div>` : '<div class="confirm-banner" style="opacity:0.6;">Tap a segment to select a dart</div>'}
  <div style="padding:0 18px 8px 18px;"><button class="btn btn-secondary btn-full" onclick="practiceApplyDart(state.practiceSession,null,null); checkPracticeDone(); render();">Miss</button></div>`;
}
function renderPracticeResults(){
  const ps = state.practiceSession;
  const acc = ps.totalDarts? Math.round((ps.successfulHits/ps.totalDarts)*1000)/10 : 0;
  return `<div class="topbar"><div class="brand"><span class="dot"></span><h1 style="color:var(--brass);">Session Complete</h1></div><div style="width:38px;"></div></div>
  <div class="content">
    <div class="rule-block" style="text-align:center;"><h2 style="color:var(--brass);">${ps.def.name || 'Practice'} Complete</h2></div>
    <div class="stat-grid">
      <div class="stat-box"><div class="val">${ps.totalDarts}</div><div class="lab">Darts Thrown</div></div>
      <div class="stat-box"><div class="val">${ps.successfulHits}</div><div class="lab">Target Hits</div></div>
      <div class="stat-box"><div class="val">${ps.misses}</div><div class="lab">Misses</div></div>
      <div class="stat-box"><div class="val">${acc}%</div><div class="lab">Accuracy</div></div>
      <div class="stat-box"><div class="val">${ps.completionTime||0}s</div><div class="lab">Time</div></div>
    </div>
    <button class="btn btn-primary btn-full" onclick="backToPracticeFromResults()">Back to Practice</button>
  </div>`;
}

/* ========================= RENDER: CUSTOM BUILDER ========================= */
function renderCustomBuilder(){
  const cb = state.customBuilder;
  const nums = Array.from({length:20},(_,i)=>i+1);
  return `<div class="topbar"><div class="iconbtn" onclick="cbCancel()">&#8592;</div><h1 style="color:var(--brass); font-size:19px;">Build a Routine</h1><div style="width:38px;"></div></div>
  <div class="content">
    <div>
      <span class="field-label">Name</span>
      <input class="input" id="cbNameInput" placeholder="e.g. Big Numbers Warm-Up" value="${cb.name}">
    </div>
    <div>
      <span class="field-label">Targets (tap to select)</span>
      <div class="numgrid" style="padding:6px 0;">
        ${nums.map(n=>`<div class="num-btn ${cb.targets.includes(n)?'recommended':''}" style="font-size:14px;" onclick="cbToggleTarget(${n})">${n}</div>`).join('')}
      </div>
    </div>
    <div>
      <span class="field-label">Order</span>
      <div class="chip-wrap">
        <span class="chip ${cb.order==='numerical'?'selected':''}" onclick="cbSetOrder('numerical')">Numerical</span>
        <span class="chip ${cb.order==='reverse'?'selected':''}" onclick="cbSetOrder('reverse')">Reverse</span>
        <span class="chip ${cb.order==='random'?'selected':''}" onclick="cbSetOrder('random')">Random</span>
      </div>
    </div>
    <div>
      <span class="field-label">Hits Required Per Target</span>
      <div class="chip-wrap">
        ${[1,2,3,5].map(v=>`<span class="chip ${cb.requiredHits===v?'selected':''}" onclick="cbSetRequired(${v})">${v}</span>`).join('')}
      </div>
    </div>
    <div>
      <span class="field-label">Multiplier Behavior</span>
      <div class="chip-wrap">
        <span class="chip ${cb.multiplierRule==='simple'?'selected':''}" onclick="cbSetMultiplierRule('simple')">Any hit = 1</span>
        <span class="chip ${cb.multiplierRule==='weighted'?'selected':''}" onclick="cbSetMultiplierRule('weighted')">Double=2, Triple=3</span>
      </div>
    </div>
    <button class="btn btn-primary btn-full" ${cb.targets.length===0?'disabled':''} onclick="cbSave()">Save Routine</button>
  </div>`;
}

/* ========================= RENDER: CHECKOUT TABLE ========================= */
function renderCheckoutTable(){
  const outRule = state.checkoutOutRule;
  const rows = buildCheckoutTable(outRule);
  const currentScore = (state.session && state.session.kind==='x01') ? x01Current(state.session).score : null;
  return `<div class="topbar">
    <div class="iconbtn" onclick="closeCheckoutTable()">&#8592;</div>
    <h1 style="color:var(--brass); font-size:19px;">Checkout Table</h1>
    <div style="width:38px;"></div>
  </div>
  <div class="subtitle">Every finish from 170 down to 2, assuming a fresh 3-dart turn and ${outRule==='master'?'Master Out':outRule==='straight'?'Straight Out':'Double Out'} rules.</div>
  <div class="co-tabs">
    ${['double','master','straight'].map(r=>`<button class="btn ${outRule===r?'btn-primary':'btn-secondary'}" onclick="state.checkoutOutRule='${r}'; render();">${r==='double'?'Double Out':r==='master'?'Master Out':'Straight Out'}</button>`).join('')}
  </div>
  <div class="content" style="padding-top:0;">
    <div class="rule-block" style="padding:0; overflow:hidden;">
      ${rows.map(r=>`<div class="co-row ${r.score===currentScore?'highlight':''}">
        <span class="co-score">${r.score}</span>
        <span class="${r.route?'co-route':'co-none'}">${r.route ? r.route.join('  &middot;  ') : 'no 3-dart finish'}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ========================= INIT ========================= */
render();
</script>
</body>
</html>
